<script>
window.Cmcap={
 roles:['Representante de los trabajadores','Coordinador de CMCAP','Vocal - Representante del Patrón','Secretario - Representa del Patrón','Vocal - Representante de los trabajadores','Secretario - Representa de los trabajadores'],
 role(value){return value==='Coordinador'?'Coordinador de CMCAP':value},
 signatureLabel(role){if(role.startsWith('Vocal'))return 'Vocal';if(role.startsWith('Secretario'))return 'Secretario';return this.role(role)},
 status(member,date=this.today()){if(!this.valid(member.startDate)||!this.valid(member.endDate))return {text:'Fechas pendientes',kind:'pending'};if(date>member.endDate)return {text:'Vencido',kind:'expired'};if(date<member.startDate)return {text:'Próximo',kind:'pending'};return {text:'Vigente',kind:'active'}},
 today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},
 valid(date){const d=new Date(date+'T12:00:00Z');return /^\d{4}-\d{2}-\d{2}$/.test(date||'')&&!Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===date},
 end(start){if(!this.valid(start))return '';const [y,m,d]=start.split('-').map(Number);const last=new Date(Date.UTC(y+2,m,0)).getUTCDate();const end=new Date(Date.UTC(y+2,m-1,Math.min(d,last)));end.setUTCDate(end.getUTCDate()-1);return end.toISOString().slice(0,10)},
 member(rows,role,date){if(!this.valid(date))throw Error('Selecciona la fecha del documento.');const matches=rows.filter(m=>this.role(m.role)===this.role(role)&&m.name&&this.valid(m.startDate)&&this.valid(m.endDate)&&m.startDate<=date&&date<=m.endDate);if(matches.length!==1)throw Error(matches.length?'Hay vigencias superpuestas para '+role+'.':'No hay integrante vigente como '+role+' el '+date+'. Revisa la CMCAP.');return matches[0]},
 validateAddition(rows,member){this.validate([member]);const complete=rows.filter(m=>this.roles.includes(this.role(m.role))&&m.name&&this.valid(m.startDate)&&this.valid(m.endDate));for(const m of complete){if(this.role(m.role)===this.role(member.role)&&m.startDate<=member.endDate&&member.startDate<=m.endDate)throw Error('No se pueden superponer vigencias del mismo puesto: '+member.role+'.');}return [...rows,member]},
 validate(rows){for(const m of rows){if(!m.name&&!m.startDate&&!m.endDate)continue;if(!this.roles.includes(this.role(m.role)))throw Error('Selecciona uno de los seis puestos correctos de la CMCAP.');if(!m.name||!this.valid(m.startDate)||!this.valid(m.endDate))throw Error('Completa integrante y fechas de '+m.role+'.');if(m.endDate<m.startDate||m.endDate>this.end(m.startDate))throw Error('La vigencia de '+m.role+' debe ser de hasta dos años.');}for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length;j++){const a=rows[i],b=rows[j];if(this.role(a.role)===this.role(b.role)&&a.name&&b.name&&a.startDate&&b.startDate&&a.startDate<=b.endDate&&b.startDate<=a.endDate)throw Error('No se pueden superponer vigencias del mismo puesto: '+a.role+'.');}return rows}
};
</script>
