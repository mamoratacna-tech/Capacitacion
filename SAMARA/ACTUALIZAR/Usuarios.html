<style>
#users-nav[hidden]{display:none!important}#user-editor{width:min(620px,94vw);border:0;border-radius:18px;padding:28px;color:#111}#user-editor::backdrop{background:#15283f80}#user-editor label{display:block;margin:14px 0;font-size:13px;font-weight:600}#user-editor input,#user-editor select{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #d5deea;border-radius:8px;font:inherit;color:#111;background:white}#user-editor .password-field{display:flex;gap:8px;align-items:center}#user-editor .password-field input{flex:1;min-width:0}#user-editor .password-field button{flex:none}#user-editor .dialog-actions{margin-top:24px;display:flex;justify-content:flex-end;gap:10px}#users-message,#user-error{white-space:pre-line}#users-table .user-actions{display:flex;justify-content:flex-end;gap:8px}#session-user{font-size:12px;overflow-wrap:anywhere;min-width:0}.session-footer .user-card{gap:10px}.session-footer #logout-user{width:100%;margin:8px 0 0;background:#171717;color:white;border-color:#444}.session-footer #session-message{font-size:11px;color:#ddd;margin:6px 0 0}.session-footer #session-message:empty{display:none}
</style>
<dialog id="user-editor"><form id="user-form"><div class="dialog-head"><div><div class="eyebrow">ADMINISTRACIÓN GENERAL</div><h2 id="user-title">Crear usuario</h2></div><button type="button" id="user-close" class="close-dialog" aria-label="Cerrar">×</button></div><label>Nombre completo o área<input name="name" maxlength="120" required></label><label>Usuario de acceso<input name="username" autocomplete="off" required minlength="3" maxlength="60" pattern="[a-zA-Z0-9._\-]+"><small>Sin espacios ni acentos.</small></label><label>Rol<select name="role"><option value="coordinator">Coordinador CMCAP · captura y consulta</option><option value="admin">Administrador general · incluye gestión de usuarios</option></select></label><label>Estado<select name="active"><option value="true">Activo</option><option value="false">Inactivo</option></select></label><label>Contraseña nueva<div class="password-field"><input name="password" id="user-password" type="password" autocomplete="new-password" minlength="12"><button class="button outline" id="user-show-password" type="button">Mostrar</button></div></label><p class="form-hint" id="user-password-hint">Al menos 12 caracteres. Puedes mostrar la nueva contraseña antes de guardarla. Las contraseñas anteriores no se pueden consultar.</p><p id="user-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button outline" id="user-cancel">Cancelar</button><button class="button primary" type="submit">Guardar usuario</button></div></form></dialog>
<script>
(function(){
 const $=id=>document.getElementById(id),call=(method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));
 const access=window.SamaraAccess={token:sessionStorage.getItem('samara.session')||'',user:window.SAMARA_ENTRY?.user||null,beforeLogout:null,dispose:null,loadUsers};let users=[],editing='';
 const escape=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
 const hex=bytes=>Array.from(new Uint8Array(bytes),n=>n.toString(16).padStart(2,'0')).join('');
 async function credential(password){if(password.length<12)throw Error('Usa al menos 12 caracteres.');const salt=hex(crypto.getRandomValues(new Uint8Array(16))),key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);return {salt,key:hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:600000},key,256))};}
 async function loadUsers(){if(access.user?.role!=='admin')return;try{users=await call('api_usersList',access.token);$('users-table').innerHTML=users.map(user=>'<tr><td>'+escape(user.name)+'</td><td>'+escape(user.username)+'</td><td>'+escape(user.role==='admin'?'Administrador general':'Coordinador CMCAP')+'</td><td>'+(user.active?'Activo':'Inactivo')+'</td><td><div class="user-actions"><button class="button outline" type="button" data-edit-user="'+escape(user.id)+'">✎ Editar</button>'+(user.id===access.user.id?'':'<button class="button outline" type="button" data-delete-user="'+escape(user.id)+'">Eliminar</button>')+'</div></td></tr>').join('');}catch(error){$('users-message').textContent=error.message;}}
 function editUser(id){const user=users.find(item=>item.id===id);editing=user?.id||'';const form=$('user-form');form.reset();form.elements.name.value=user?.name||'';form.elements.username.value=user?.username||'';form.elements.role.value=user?.role||'coordinator';form.elements.active.value=user?.active===false?'false':'true';form.elements.password.required=!user;form.elements.password.type='password';$('user-show-password').textContent='Mostrar';$('user-error').textContent='';$('user-title').textContent=user?'Editar usuario':'Crear usuario';$('user-password-hint').textContent=user?'Deja la contraseña vacía para conservarla. Si cambias el usuario de acceso, asigna una contraseña nueva. Guardar cambios cerrará sus sesiones anteriores.':'Al menos 12 caracteres. Puedes mostrar la nueva contraseña antes de guardarla; después no podrá consultarse.';$('user-editor').showModal();}
 $('new-user').addEventListener('click',()=>editUser(''));
 $('user-close').onclick=$('user-cancel').onclick=()=>{$('user-form').reset();$('user-editor').close();};
 $('user-show-password').onclick=()=>{const input=$('user-password');input.type=input.type==='password'?'text':'password';$('user-show-password').textContent=input.type==='password'?'Mostrar':'Ocultar';};
 $('users-table').addEventListener('click',async event=>{const edit=event.target.closest('[data-edit-user]'),remove=event.target.closest('[data-delete-user]');if(edit)editUser(edit.dataset.editUser);if(!remove)return;const target=users.find(user=>user.id===remove.dataset.deleteUser);if(!target)return;const dialog=document.createElement('dialog');dialog.className='app-confirm';dialog.innerHTML='<div class="record-editor"><h2>Eliminar usuario</h2><p></p><div class="dialog-actions"><button class="button outline" data-answer="cancel">Cancelar</button><button class="button primary" data-answer="accept">Eliminar usuario</button></div></div>';dialog.querySelector('p').textContent='¿Eliminar el acceso de '+target.name+'? Sus sesiones se cerrarán y los datos capturados se conservarán.';dialog.addEventListener('click',e=>{const button=e.target.closest('[data-answer]');if(button)dialog.close(button.dataset.answer);});dialog.addEventListener('close',async()=>{const accepted=dialog.returnValue==='accept';dialog.remove();if(!accepted)return;try{await call('api_usersDelete',target.id,access.token);$('users-message').textContent='Usuario eliminado. Sus registros se conservan.';await loadUsers();}catch(error){$('users-message').textContent=error.message;}});document.body.append(dialog);dialog.showModal();});
 $('user-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.target,button=form.querySelector('[type="submit"]');button.disabled=true;$('user-error').textContent='';try{const payload={id:editing,username:form.elements.username.value.trim().toLowerCase(),name:form.elements.name.value.trim(),role:form.elements.role.value,active:form.elements.active.value==='true'};if(form.elements.password.value)payload.credential=await credential(form.elements.password.value);if(editing===access.user?.id&&access.beforeLogout)await access.beforeLogout();await call('api_usersSave',payload,access.token);form.reset();$('user-editor').close();$('users-message').textContent='Usuario guardado. Las sesiones anteriores de ese usuario quedaron cerradas.';if(editing===access.user.id){access.beforeLogout=null;await leaveSession();return;}await loadUsers();}catch(error){$('user-error').textContent=error.message||String(error);}finally{button.disabled=false;}});
 async function leaveSession(){
  const button=$('logout-user');button.disabled=true;const oldText=button.textContent;
  try{button.textContent='Guardando…';$('session-message').textContent='';if(access.beforeLogout)await access.beforeLogout();button.textContent='Cerrando sesión…';const html=await call('api_authLogoutPage',access.token);sessionStorage.removeItem('samara.session');access.dispose?.();window.SAMARA_ENTRY=null;window.SAMARA_LOGIN_CONFIGURED=true;await window.SamaraEntry.render(html);}
  catch(error){$('session-message').textContent=error.message||String(error);}finally{button.disabled=false;button.textContent=oldText;}
 }
 $('logout-user').onclick=leaveSession;
 function showUser(user){access.user=user;$('session-name').textContent=user.name;$('session-role').textContent=user.role==='admin'?'Administración general':'Coordinador CMCAP';$('session-avatar').textContent=user.role==='admin'?'RH':'CC';$('users-nav').hidden=user.role!=='admin';}
 if(access.user)showUser(access.user);else call('api_authMe',access.token).then(showUser).catch(error=>{$('session-message').textContent=error.message||'Inicia sesión.';});

})();
</script>
