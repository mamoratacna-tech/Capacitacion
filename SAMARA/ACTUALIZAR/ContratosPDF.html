<style>
.contract-pdf-dialog{width:min(1000px,calc(100vw - 32px));max-height:90vh;overflow:auto;border:0;border-radius:14px;padding:26px;color:#28465b}.contract-pdf-dialog::backdrop{background:#12293e88}.contract-pdf-dialog table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;white-space:normal}.contract-pdf-dialog td,.contract-pdf-dialog th{padding:10px 6px;border-bottom:1px solid #e1e8ee;text-align:left;white-space:normal;overflow-wrap:anywhere}.contract-pdf-dialog input{margin:16px 0;max-width:100%}.contract-pdf-note{font-size:12px;line-height:1.7;color:#718595}.contract-pdf-error{color:#b92b3a;font-size:12px}.contract-pdf-changes{margin:16px 0}.contract-pdf-dialog .dialog-actions{flex-wrap:wrap}@media(max-width:650px){.contract-pdf-dialog thead{display:none}.contract-pdf-dialog tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ddd}.contract-pdf-dialog td{display:block;border:0}.contract-pdf-dialog td:before{content:attr(data-label);display:block;font-size:9px;color:#8495a5}}
</style>
<script>
window.SamaraContractsPdf=(()=>{
'use strict';
const number=v=>String(v??'').trim().replace(/^0+(?=\d)/,''),norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reportDate(value){const m=String(value||'').match(/^(\d{1,2})\/([a-zA-ZÁÉÍÓÚáéíóú]+|\d{1,2})\/(\d{2}|\d{4})$/);if(!m)return '';const months={ene:1,jan:1,feb:2,mar:3,abr:4,apr:4,may:5,jun:6,jul:7,ago:8,aug:8,sep:9,sept:9,oct:10,nov:11,dic:12,dec:12},month=months[norm(m[2])]||Number(m[2]),year=m[3].length===2?2000+Number(m[3]):Number(m[3]),out=year+'-'+String(month).padStart(2,'0')+'-'+m[1].padStart(2,'0');return window.SamaraEvaluations.date(out)?out:'';}
function parse(text){
 text=String(text||'').replace(/\r/g,'');const starts=[...text.matchAll(/^\s*(\d{4,8})[ \t]+([^\n]+)/gm)],rows=[],errors=[],seen=new Set();
 for(let i=0;i<starts.length;i++){const m=starts[i],block=text.slice(m.index,starts[i+1]?.index??text.length),duration=block.match(/\b(\d{1,4})\s*d[ií]as\b/i),dates=duration?[...block.slice(duration.index+duration[0].length).matchAll(/\b\d{1,2}\/(?:[a-zA-ZÁÉÍÓÚáéíóú]+|\d{1,2})\/\d{2,4}\b/g)]:[];
  if(!duration||dates.length<2){errors.push('Empleado '+m[1]+': no se pudo leer duración, inicio y vencimiento.');continue;}
  const no=number(m[1]),start=reportDate(dates[0][0]),end=reportDate(dates[1][0]),days=String(Number(duration[1]));if(seen.has(no)){errors.push('Empleado '+no+': está repetido en el PDF.');continue;}seen.add(no);
  if(!start||!end||end<start){errors.push('Empleado '+no+': revisa las fechas del PDF.');continue;}
  try{const computed=SamaraEvaluations.contractPatch({contractType:'Temporal',contractDays:days,contractStart:start});if(computed.contractEnd!==end)throw Error('el vencimiento no coincide con los días');rows.push({no,pdfName:m[2].split('$')[0].trim(),contractType:'Temporal',contractDays:days,contractStart:start,contractEnd:end});}catch(error){errors.push('Empleado '+no+': '+error.message+'.');}
 }
 if(!starts.length)errors.push('No se encontraron contratos con texto. Usa el PDF original del reporte Mxli Vencimiento de Contrato.');return {rows,errors};
}
function plan(existing,rows){const next=existing.map(e=>({...e})),changes=[],issues=[],unchanged=[];const fields=['contractType','contractDays','contractStart','contractEnd'];
 for(const r of rows){const matches=next.filter(e=>norm(e.company||e.empresa||e.entity||'SAMARA')==='samara'&&number(e.no)===number(r.no));const tag='Empleado '+r.no;
  if(matches.length!==1){issues.push({no:r.no,name:r.pdfName||'',message:tag+': '+(matches.length?'número ambiguo en Personal; revisa duplicados.':'no encontrado en SAMARA. No se crea un empleado con datos truncados del PDF.')});continue;}
  const e=matches[0];if(['inactivo','inactiva','baja','bajas'].includes(norm(e.activeStatus||e.status||e._legacy?.estado||'Activo'))){issues.push({no:r.no,name:r.pdfName||'',message:tag+': está inactivo en Personal; no se reactiva ni se modifica.'});continue;}
  if(/indefin|indetermin/.test(norm(e.contractType))){issues.push({no:r.no,name:r.pdfName||'',message:tag+': tiene contrato indefinido en Personal; requiere revisión antes de reemplazarlo por uno temporal.'});continue;}
  if(SamaraEvaluations.date(e.contractStart)&&e.contractStart>r.contractStart){issues.push({no:r.no,name:r.pdfName||'',message:tag+': Personal tiene un contrato posterior al PDF; se conserva el vigente.'});continue;}
  const patch=Object.fromEntries(fields.map(f=>[f,r[f]])),diff=fields.filter(f=>String(e[f]||'')!==String(patch[f]||''));if(!diff.length){unchanged.push(r.no);continue;}
  const index=next.indexOf(e);next[index]={...e,...patch};changes.push({no:r.no,name:[e.paternal,e.maternal,e.names].filter(Boolean).join(' '),department:e.department||'Sin departamento',before:Object.fromEntries(fields.map(f=>[f,e[f]||''])),after:patch,fields:diff});
 }
 return {next,changes,issues,unchanged};
}
let api=null,dialog=null,rows=null,busy=false;const can=()=>!window.SamaraAccess?.can||window.SamaraAccess.can('people','edit');
function preview(){const result=plan(api.context(),rows||[]),target=dialog.querySelector('#contracts-pdf-preview');target.innerHTML='<p><b>'+rows.length+' contratos leídos · '+result.changes.length+' por actualizar · '+result.unchanged.length+' sin cambios · '+result.issues.length+' por revisar</b></p><p class="contract-pdf-note">Se actualizan únicamente tipo, días, inicio y vencimiento de contratos encontrados. Los departamentos, puestos, plantas, clasificaciones, estados y evaluaciones realizadas se conservan.</p>'+(result.changes.length?'<table><thead><tr>'+['No. / Empleado','Departamento','Contrato anterior','Contrato del PDF'].map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+result.changes.map(r=>'<tr>'+[r.no+' · '+r.name,r.department,(r.before.contractType||'Pendiente')+' / '+(r.before.contractDays||'—')+' días / '+(r.before.contractStart||'—')+' a '+(r.before.contractEnd||'—'),r.after.contractDays+' días / '+r.after.contractStart+' a '+r.after.contractEnd].map((v,i)=>'<td data-label="'+['Empleado','Departamento','Anterior','Nuevo'][i]+'">'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'')+(result.issues.length?'<details open><summary>Contratos que requieren revisión</summary>'+result.issues.map(i=>'<p class="contract-pdf-error">'+esc(i.message)+'</p>').join('')+'</details>':'');dialog.querySelector('#import-contracts-apply').disabled=!result.changes.length||!can();return result;}
function open(){if(!can())return api.toast('Necesitas Captura / edición en Personal para actualizar los contratos.');rows=null;dialog.innerHTML='<div class="dialog-head"><div><div class="eyebrow">PERSONAL · CONTRATOS</div><h2>Actualizar contratos desde PDF</h2></div><button type="button" class="close-dialog" data-contracts-close aria-label="Cerrar">×</button></div><p class="contract-pdf-note">Selecciona el reporte Mxli Vencimiento de Contrato. Se cruza por número de empleado con Personal SAMARA. No se crean empleados, no se registran evaluaciones como realizadas y no se dan bajas a los ausentes.</p><label>Reporte PDF<input type="file" id="contracts-pdf-file" accept="application/pdf,.pdf"></label><p id="contracts-pdf-status" role="status"></p><div id="contracts-pdf-preview" class="contract-pdf-changes"></div><div class="dialog-actions"><button class="button outline" type="button" data-contracts-close>Cancelar</button><button class="button primary" type="button" id="import-contracts-apply" disabled>Actualizar contratos en Personal</button></div>';
 dialog.querySelectorAll('[data-contracts-close]').forEach(b=>b.onclick=()=>{if(!busy)dialog.close();});dialog.oncancel=e=>{if(busy)e.preventDefault();};dialog.querySelector('#contracts-pdf-file').onchange=async event=>{if(!can()||busy)return;const file=event.target.files[0];if(!file)return;busy=true;const status=dialog.querySelector('#contracts-pdf-status');dialog.querySelector('#import-contracts-apply').disabled=true;dialog.querySelector('#contracts-pdf-preview').innerHTML='';let pdf;
 try{pdf=await window.SamaraPdfReader.open(file);let text='';for(let i=1;i<=pdf.pages;i++){status.textContent='Leyendo página '+i+' de '+pdf.pages+' en tu equipo…';const page=await pdf.document.getPage(i);try{const data=await page.getTextContent();text+=SamaraPdfReader.positionedLines(data.items)+'\n';}finally{page.cleanup?.();}}
  const result=parse(text);if(result.errors.length)throw Error(result.errors.join('\n'));rows=result.rows;status.textContent='Lectura terminada. Revisa los contratos antes de aplicar.';preview();
 }catch(error){rows=null;status.textContent=error.message||String(error);}finally{await pdf?.document.destroy?.();busy=false;event.target.value='';}};
 dialog.querySelector('#import-contracts-apply').onclick=async event=>{if(!rows||!can()||busy)return;const button=event.target;busy=true;button.disabled=true;const status=dialog.querySelector('#contracts-pdf-status');try{const result=plan(api.context(),rows);if(!result.changes.length){preview();status.textContent='No hay contratos nuevos por aplicar.';return;}status.textContent='Guardando contratos en Personal…';await api.save(result.next);status.textContent=result.changes.length+' contratos actualizados. Evaluaciones ya toma estos datos de Personal.';preview();api.toast('Contratos actualizados en Personal.');}catch(error){status.textContent='No se guardó: '+error.message;button.disabled=false;}finally{busy=false;}};
 dialog.showModal();window.SamaraAccess?.apply(dialog);
}
function init(config){api=config;dialog=document.createElement('dialog');dialog.id='contracts-pdf-dialog';dialog.className='contract-pdf-dialog';document.body.append(dialog);document.getElementById('import-contracts-pdf')?.addEventListener('click',open);}
return {init,open,parse,plan,reportDate};
})();
</script>
