<style>
.report-kicker{color:#8796a2;font-size:8px;font-weight:700;letter-spacing:.8px;margin-top:12px}
.report-actions{display:flex;gap:7px;flex-wrap:wrap}
.report-actions .button,.report-card .button{font-size:9px;padding:0 10px}
.report-dialog-content{padding:23px;max-height:82vh;overflow-y:auto}
.report-dialog-content .dialog-head{margin-bottom:13px}
.report-label{display:block;font-size:10px;font-weight:600;color:#647787;margin:0 0 12px}
.report-label input,.report-label select{display:block;width:100%;height:36px;margin-top:6px;border:1px solid #dfe6eb;border-radius:6px;padding:0 10px;background:white;font:11px "DM Sans";color:#43596a;outline-color:#79cfb5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form-hint{color:#82919d;font-size:9px;line-height:1.5;margin:10px 0 0}
.report-preview-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.report-preview-box div{background:#f6f8fa;padding:9px;border-radius:6px}
.report-preview-box span,.report-preview-box b{display:block}
.report-preview-box span{font-size:8px;color:#8997a2}
.report-preview-box b{font-size:9px;color:#3d5366;margin-top:4px}
.notice-box.compact{margin:7px 0;padding:11px}
.field-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.field-chips span{font-size:8px;color:#53766d;background:#edf6f2;border-radius:10px;padding:5px 7px}
.approval-check{display:flex;gap:8px;align-items:flex-start;font-size:9px;color:#546979;margin-top:6px}
.approval-check input{margin:1px 0 0;accent-color:#409b81}
.report-label .invalid{border-color:#dc766b;background:#fff9f8}
#print-stage{display:none}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}.report-dialog-content{padding:18px}.report-card p{min-height:0}}
@media print{
  @page{size:letter;margin:12mm}
  body{background:white!important}
  body>*:not(#print-stage){display:none!important}
  #print-stage{display:block!important;color:#182d40;font-family:Arial,sans-serif}
  .print-sheet{width:100%;min-height:250mm;padding:0}
  .print-brand{display:flex;align-items:center;gap:10px;border-bottom:2px solid #1d3d56;padding-bottom:11px;margin-bottom:20px}
  .print-mark{width:35px;height:35px;border-radius:8px;background:#dff4ed;color:#163d50;display:grid;place-items:center;font-size:20px;font-weight:bold}
  .print-brand b,.print-brand small{display:block}
  .print-brand b{font-size:12px;letter-spacing:1.5px}
  .print-brand small{font-size:8px;color:#687986;margin-top:3px}
  .print-brand>span{margin-left:auto;font-size:8px;font-weight:bold;letter-spacing:.5px}
  .print-sheet h1{font:700 17px Arial;color:#17334b;margin:0 0 4px}
  .print-sub{font-size:9px;color:#627585;margin:0 0 18px}
  .print-sheet h2{font-size:10px;text-transform:uppercase;color:#315b6e;border-bottom:1px solid #cbd7df;padding-bottom:5px;margin:16px 0 9px}
  .print-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .print-grid section{min-height:43px;border:1px solid #d6dfe5;padding:7px 8px;margin:-1px 0 0 -1px}
  .print-grid small,.print-grid b{display:block}
  .print-grid small{font-size:7px;color:#748593;letter-spacing:.35px;margin-bottom:4px}
  .print-grid b{font-size:9px;color:#20394e;line-height:1.35}

  .signature-grid section{border-top:1px solid #526a7a;text-align:center;padding-top:7px;font-size:8px;color:#526a7a;min-height:40px}
  .print-note{border:1px solid #d9e6e1;background:#f3f8f6;padding:9px;margin-top:16px;font-size:8px;line-height:1.45;color:#42685f}
  .print-foot{border-top:1px solid #d6dfe5;margin-top:22px;padding-top:7px;font-size:7px;color:#7d8b96;text-align:center}
  .print-sheet:has(.signature-grid) .print-note{background:#fff8ec;border-color:#eadcc3;color:#806b47}
