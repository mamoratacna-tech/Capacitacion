function code(kind,value){const text=String(value??'').trim(),rows=C[kind]||[];const exact=rows.find(row=>row.code===text);if(exact)return exact.code;const prefix=text.match(/^\d+/)?.[0];if(prefix&&rows.some(row=>row.code===prefix)&&/^\d+\s*[·.\-]/.test(text))return prefix;return rows.find(row=>norm(row.name)===norm(text))?.code||'';}
function areaCode(value){const text=String(value||'').trim();return code('areas',text)||C.areas.find(row=>norm(row.name).startsWith(norm(text))&&norm(text).length>3)?.code||'';}
function date(value){const text=String(value||'');return /^\d{4}-\d{2}-\d{2}$/.test(text)&&!isNaN(Date.parse(text+'T12:00:00Z'))&&new Date(text+'T12:00:00Z').toISOString().slice(0,10)===text;}
function dmy(value){if(!date(value))throw Error('Selecciona fechas válidas para SIRCE.');return value.slice(8,10)+'-'+value.slice(5,7)+'-'+value.slice(2,4);}
function rows(list,people,positions,course,instructor){
 const m=list.sirceDatos||{},issues=[],output=[],key=String(m.claveCurso||'').trim();
 if(!key)issues.push('Falta la CLAVE CURSO asignada por SIRCE a este listado.');
 if(!date(m.inicio)||!date(m.fin)||m.fin<m.inicio)issues.push('Revisa las fechas de inicio y término.');
 for(const [field,kind,label] of [['estado','states','estado'],['area','areas','área temática'],['modalidad','modalities','modalidad'],['objetivo','objectives','objetivo']])if(!code(kind,m[field]))issues.push('Selecciona '+label+' del catálogo adjunto.');
 const state=C.states.find(row=>row.code===m.estado);if(!C.municipalities.some(row=>row.code===m.municipio&&norm(row.entity)===norm(state?.name)))issues.push('El municipio debe corresponder al estado elegido.');
 const agent=instructor?.type==='Interno'?'1':instructor?.type==='Externo'?'2':String(m.agente||'');
 if(!code('agents',agent))issues.push('Selecciona el tipo de agente.');
 const rfc=agent==='1'?'':String(m.rfc||instructor?.rfc||'').trim().toUpperCase();if(agent==='2'&&!rfc)issues.push('Falta el RFC del agente externo.');
 const duration=String(list.encabezado?.duracion||course?.duration||'');if(!(Number(duration)>0))issues.push('Falta la duración del curso.');
 const signed=(list.asistentes||[]).filter(a=>a.firmo);if(!signed.length)issues.push('No hay asistentes con firma para exportar.');
 const seen=new Set();
 signed.forEach((a,index)=>{
  const tag='Asistente '+(index+1)+' ('+(a.numero||a.nombre||'sin identificar')+'): ';
  if(a.estado!=='ok'){issues.push(tag+'debe estar validado.');return;}
  const matches=people.filter(e=>String(e.no)===String(a.numero));if(matches.length!==1){issues.push(tag+'no se identifica de forma única en Personal.');return;}
  const e=matches[0],curp=String(e.curp||'').trim().toUpperCase();if(curp.length!==18)issues.push(tag+'revisa la CURP.');if(seen.has(curp))issues.push(tag+'CURP duplicada en el listado.');seen.add(curp);
  if(!e.names||!e.paternal)issues.push(tag+'faltan nombre o primer apellido.');
  const position=positions.find(p=>norm(p.job)===norm(e.position));
  const occupation=code('occupations',position?.sirceCode)||code('occupations',position?.sirceOccupation);
  const studies=code('studies',e.studies),document=code('documents',e.proofDocType),institution=code('institutions',e.institutionType);
  for(const [label,value] of [['ocupación SIRCE',occupation],['escolaridad',studies],['documento probatorio',document],['institución',institution]])if(!value)issues.push(tag+'revisa '+label+' en Personal/Puestos SIRCE.');
  output.push([curp,String(e.names||'').toUpperCase(),String(e.paternal||'').toUpperCase(),String(e.maternal||'').toUpperCase(),m.estado,m.municipio,occupation,studies,document,institution,key,list.cursoNombre||course?.name||'',m.area,duration,date(m.inicio)?dmy(m.inicio):'',date(m.fin)?dmy(m.fin):'',agent,rfc,m.modalidad,m.objetivo,'862341']);
 });
 return {headers:D.headers,rows:output,issues:[...new Set(issues)],excluded:(list.asistentes||[]).length-signed.length};
}
function bulkPlan(table,lists){
 const head=table[0]||[],columns={};head.forEach((value,index)=>columns[norm(value)]=index);
 const idColumn=columns.IDLISTADO,keyColumn=columns.CLAVECURSO,dateColumn=columns.FECHA,courseColumn=columns.NOMENCLATURA??columns.CODIGOCURSO,instructorColumn=columns.INSTRUCTOR;
 if(keyColumn===undefined)throw Error('El archivo debe incluir CLAVE CURSO. Descarga la plantilla de claves.');
 const updates=new Map(),errors=[];
 table.slice(1).forEach((row,index)=>{
  const key=String(row[keyColumn]??'').trim();if(!key)return;
  const id=idColumn===undefined?'':String(row[idColumn]??'').trim();let matches;
  if(id)matches=lists.filter(list=>list.id===id);else{
   const course=String(row[courseColumn]??'').trim(),day=String(row[dateColumn]??'').trim();
   if(!course||!date(day)){errors.push('Fila '+(index+2)+': requiere ID LISTADO o NOMENCLATURA y FECHA AAAA-MM-DD.');return;}
   matches=lists.filter(list=>list.cursoCodigo===course&&list.fecha===day&&(instructorColumn===undefined||!row[instructorColumn]||norm(list.encabezado?.instructor)===norm(row[instructorColumn])));
  }
  if(matches.length!==1){errors.push('Fila '+(index+2)+': '+(matches.length?'coincide con varios listados; utiliza ID LISTADO.':'no se encontró el listado.'));return;}
  const list=matches[0];if(updates.has(list.id)&&updates.get(list.id).key!==key){errors.push('Fila '+(index+2)+': dos claves distintas para el mismo listado.');return;}
  updates.set(list.id,{id:list.id,key,previous:String(list.sirceDatos?.claveCurso||''),course:list.cursoNombre,date:list.fecha});
 });
 const finalKeys=new Map();lists.forEach(list=>{const key=updates.get(list.id)?.key||String(list.sirceDatos?.claveCurso||'');if(!key)return;if(finalKeys.has(key)&&finalKeys.get(key)!==list.id)errors.push('La clave '+key+' se repite en distintos listados.');finalKeys.set(key,list.id);});
 const changes=[...updates.values()].filter(change=>change.key!==change.previous);
 return {changes,errors:[...new Set(errors)],unchanged:updates.size-changes.length};
}
const xml=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
async function workbook(result){
 if(result.issues?.length)throw Error(result.issues.join('\n'));if(!window.JSZip)throw Error('No se cargó el generador de Excel. Vuelve a cargar la aplicación.');
 const zip=await window.JSZip.loadAsync(D.template,{base64:true});let source=await zip.file('xl/worksheets/sheet1.xml').async('string');
 const data=[D.headers,...result.rows].map((row,index)=>'<row r="'+(index+1)+'">'+row.map((value,column)=>{const cell=String.fromCharCode(65+column)+(index+1);return index>0&&[4,5,6,7,8,9,12,13,16,18,19,20].includes(column)&&String(value)!==''&&Number.isFinite(Number(value))?'<c r="'+cell+'"><v>'+Number(value)+'</v></c>':'<c r="'+cell+'" t="inlineStr"><is><t xml:space="preserve">'+xml(value)+'</t></is></c>';}).join('')+'</row>').join('');
 source=source.replace(/<sheetData\b[^>]*>[\s\S]*?<\/sheetData>/,'<sheetData>'+data+'</sheetData>').replace(/<dimension\b[^>]*\/?\s*>/,'<dimension ref="A1:U'+(result.rows.length+1)+'"/>');zip.file('xl/worksheets/sheet1.xml',source);
 let book=await zip.file('xl/workbook.xml').async('string');book=book.replace(/(<definedName[^>]*name="_xlnm.Print_Area"[^>]*>)[\s\S]*?(<\/definedName>)/,(_,start,end)=>start+"'Sheet1'!$A$1:$U$"+(result.rows.length+1)+end);zip.file('xl/workbook.xml',book);
 return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
window.SirceListados={catalogs:C,headers:D.headers,code,areaCode,date,rows,bulkPlan,workbook};
})();

</script>
