        existing = courses.find(course => course.code === editingCourseCode);

      const matcher = new RegExp("^".concat(prefix, "(\\d+)$"), 'i');
      const max = courses.filter(course => course.code !== editingCourseCode).reduce((value, course) => Math.max(value, Number(course.code.match(matcher)?.[1] || 0)), 0);
      return "".concat(prefix).concat(String(max + 1).padStart(3, '0'));

    function parseCsv(text) {
      const rows = [];
      let row = [],
        cell = '',
        quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"' && quoted && text[i + 1] === '"') {
          cell += '"';
          i++;
        } else if (ch === '"') quoted = !quoted;else if (ch === ',' && !quoted) {
          row.push(cell);
          cell = '';
        } else if ((ch === '\n' || ch === '\r') && !quoted) {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(cell);
          if (row.some(value => value.trim())) rows.push(row);
          row = [];
          cell = '';
        } else cell += ch;
      }
      row.push(cell);
      if (row.some(value => value.trim())) rows.push(row);
      return rows;
    }

        firstSheet = workbook.getElementsByTagNameNS(ns, 'sheet')[0];

        relationships = new DOMParser().parseFromString(await zip.file('xl/_rels/workbook.xml.rels').async('string'), 'application/xml'),
        relation = [...relationships.getElementsByTagNameNS('*', 'Relationship')].find(node => node.getAttribute('Id') === rid);
      let target = relation?.getAttribute('Target');

        sheetFile = zip.file(target);

      const sheet = new DOMParser().parseFromString(await sheetFile.async('string'), 'application/xml');
      return [...sheet.getElementsByTagNameNS(ns, 'row')].map(row => {

          if (type === 's') value = shared[Number(value)] || '';else if (type === 'inlineStr') value = xmlText(cell, 't');
          cells[index] = value;
        }
        return cells.map(value => value ?? '');
      });
    }

    /* foto */
    async function atReducir(file, max) {
      let bmp = null;
      try {
        bmp = await createImageBitmap(file);
      } catch (e) {
        bmp = await new Promise(r => {
          const im = new Image();
          im.onload = () => r(im);
          im.onerror = () => r(null);
          im.src = URL.createObjectURL(file);
        });
      }
      if (!bmp || !bmp.width) {
        if (/^image\/(jpeg|png|webp)$/.test(file.type) && file.size <= max) return file;
        throw {
          code: 'formato'
        };
      }
      const sc = Math.min(1, 2200 / Math.max(bmp.width, bmp.height)),
        cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * sc);
      cv.height = Math.round(bmp.height * sc);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      let q = 0.85,
        blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
      while (blob && blob.size > max && q > 0.4) {
        q -= 0.15;
        blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
      }
      return blob || file;
    }

    async function atPaginasPDF(file) {
      if(!window.pdfjsLib&&window.samaraLoadPdfLibrary)await window.samaraLoadPdfLibrary('reader');
      if (!window.pdfjsLib) throw new Error('No se cargó el lector de PDF.');
      const pdf = await pdfjsLib.getDocument({
          data: await file.arrayBuffer()
        }).promise,
        out = [];
      for (let n = 1; n <= pdf.numPages; n++) {
        const pg = await pdf.getPage(n),
          v0 = pg.getViewport({
            scale: 1
          }),
          sc = Math.min(3, 2200 / Math.max(v0.width, v0.height)),
          v = pg.getViewport({
            scale: sc
          }),
          cv = document.createElement('canvas');
        cv.width = Math.round(v.width);
        cv.height = Math.round(v.height);
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff';
        cx.fillRect(0, 0, cv.width, cv.height);
        await pg.render({
          canvasContext: cx,
          viewport: v
        }).promise;
        out.push({
          nombre: pdf.numPages > 1 ? "".concat(file.name, " · hoja ").concat(n) : file.name,
          blob: await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85))
        });
      }
      return out;
    }

          };

            names: (String(r[2] || '').trim() || prev.names || '').toUpperCase(),

            proofDocType: String(r[6] || prev.proofDocType || ''),

            position: String(r[8] || '').trim() || dep[no]?.position || prev.position || '',
            department: dep[no]?.department || prev.department || '',
            demo: false
          });
        });
        employees = [...byNo.values()];
        saveStore('samara.employees.v2', employees);
        try {
          renderPeople();

        renderAttendance();

      } catch (e) {

      } finally {
        btn.disabled = false;
        btn.textContent = '⇣ Importar padrón SIRCE';
      }
    }

      atPintar();
    });
    window.SamaraProgram.init({load:()=>loadStore('samara.courseProgram.v1',[]),save:records=>persistCollection('samara.courseProgram.v1',records),context:()=>({courses,employees,positions:activeMatrixPositions(),departments:matrixDepartments,attendance}),confirm:appConfirm,toast,print:html=>{$('#print-stage').innerHTML=html;printPreparedDocument(true,'A4');document.getElementById('print-page-layout').textContent+='@page{@bottom-right{content:"Página " counter(page) " de " counter(pages);font:6pt Arial;}}';}});
    window.SamaraDashboard.init({context:()=>({courses,employees:employees.map(e=>({...e,company:employeeCompany(e),activeStatus:employeeIsActive(e)?'Activo':'Inactivo'})),positions:activeMatrixPositions(),catalogPositions:positions,departments:matrixDepartments,attendance,plans:loadStore('samara.courseProgram.v1',[]),instructors,cmcap:cmcapMembers,legal:legalRepresentative,authorizedCourseCodes:courses.filter(c=>atIns().some(i=>atAutorizado(i,c.code))).map(c=>c.code),certifiedInstructorIds:atIns().filter(i=>courses.some(c=>positionIsActive(c)&&atAutorizado(i,c.code))).map(i=>i.id)}),validateList:ssResult,can:module=>!window.SamaraAccess?.can||window.SamaraAccess.can(module),navigate:(module,options={})=>{
      if(window.SamaraAccess?.can&&!window.SamaraAccess.can(module)){toast('No tienes acceso a este módulo.');return;}
      if(module==='people'){activeEmployeeCompany='SAMARA';$('#people-search').value=options.search||'';}
      if(module==='courses')$('#course-search').value=options.courseCode||'';
      if(module==='attendance'&&!AT.ed){AT.scopeSamara=true;AT.q='';AT.sirce='Todos';AT.estado=options.review?'Por revisar':'Todos';AT.desde=options.start||'';AT.hasta=options.end||'';}
      showView(module);
      if(module==='attendance'&&options.listId&&AT.ed)toast('Tienes una captura abierta. Guárdala o cancélala antes de abrir otro listado.');
      if(module==='program')window.SamaraProgram.focus(options);
      if(module==='cmcap'&&options.name){const row=[...document.querySelectorAll('#view-cmcap tbody tr')].find(r=>r.textContent.includes(options.name)&&(!options.startDate||r.textContent.includes(options.startDate)));if(row){row.scrollIntoView({block:'center'});row.animate([{background:'#e7f8f2'},{background:'transparent'}],{duration:2200});}}
      if(module==='attendance'&&options.listId&&options.review&&!AT.ed){const list=attendance.find(row=>row.id===options.listId);if(list&&(!window.SamaraAccess?.can||window.SamaraAccess.can('attendance','edit')))AT_A.abrir({id:list.id});else if(list)ssOpen(list.id);}
      if(module==='attendance'&&options.listId&&!options.review&&!AT.ed){ssOpen(options.listId);if(options.fixPeople){const list=attendance.find(row=>row.id===options.listId);if(list){ssPersonFixes(ssResult(list));$('#sirce-result').textContent='Completa los datos del expediente antes de descargar.';}}}
    }});
    window.SamaraReports.init({context:()=>{const base={courses,employees:employees.map(e=>({...e,company:employeeCompany(e),activeStatus:employeeIsActive(e)?'Activo':'Inactivo'})),positions:activeMatrixPositions(),catalogPositions:positions,departments:matrixDepartments,attendance,plans:loadStore('samara.courseProgram.v1',[]),instructors,cmcap:cmcapMembers,legal:legalRepresentative,authorizedCourseCodes:courses.filter(c=>atIns().some(i=>atAutorizado(i,c.code))).map(c=>c.code),certifiedInstructorIds:atIns().filter(i=>courses.some(c=>positionIsActive(c)&&atAutorizado(i,c.code))).map(i=>i.id)};return {...base,instructorAuthorizations:atIns().flatMap(i=>{const record=instructors.find(r=>r.id===i.id);return courses.filter(c=>atAutorizado(i,c.code)).map(c=>{const authorization=(record.authorizedCourses||[]).find(row=>row.courseCode===c.code||atNorm(row.name)===atNorm(c.name));return {id:i.id,name:i.nombre,type:i.tipo,reference:i.tipo==='Interno'?(record.employeeNo||''):i.rfc,department:record.employeeDepartment||record.department||(i.tipo==='Externo'?'Proveedor externo':''),code:c.code,course:c.name,certificationDate:authorization?instructorCertificationDate(authorization,record):''};});})};},validateList:ssResult,can:()=>!window.SamaraAccess?.can||window.SamaraAccess.can('reports'),print:html=>{$('#print-stage').innerHTML=html;printPreparedDocument(true,'A4');}});
    window.SamaraNotifications.init({readState:bootstrap.notificationReads||{},context:window.SamaraDashboard.context,today:window.SamaraDashboard.today,can:module=>!window.SamaraAccess?.can||window.SamaraAccess.can(module),validateList:ssResult,navigate:window.SamaraDashboard.navigate,save:(records,activeIds)=>googleCall('api_notificationRead',records,activeIds)});
    window.SamaraDashboard.render();
    renderAttendance();
    if(window.SamaraAccess?.can&&!window.SamaraAccess.can('dashboard')){const first=['courses','matrix','people','instructors','attendance','program','cmcap','reports'].find(module=>window.SamaraAccess.can(module));if(first)showView(first);}
    else if (window.SAMARA_INITIAL_VIEW === 'attendance') showView('attendance');
    /* ==================== FIN MÓDULO LISTADOS ==================== */
  } catch (error) {
    document.getElementById('cloud-loading')?.remove();
    document.getElementById('cloud-error').hidden = false;
    document.getElementById('cloud-retry').hidden = true;
    document.getElementById('cloud-reload').hidden = false;
    document.getElementById('cloud-reload').onclick = () => location.reload();
    document.getElementById('cloud-error-message').textContent = 'No se pudo cargar la información. Vuelve a intentarlo. ' + (error.message || '');
    console.error(error);
  }
})();
</script>
