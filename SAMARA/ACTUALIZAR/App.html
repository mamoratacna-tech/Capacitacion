<script>
(async function(){
try{
// Shared Google Sheets persistence. The Site UI calls these synchronous wrappers.
const cloud = {cache:{},pending:{},revision:0,saving:false,blocked:false,timer:null};
const cloudKeys = ['samara.attendance.v1','samara.attendanceMigration.v1','samara.matrixPositions.v2','samara.positions.v2','samara.occupationCatalog.v1','samara.employees.v2','samara.demoEmployees.v1','samara.instructors.v1','samara.cmcap.v2','samara.courses.v2'];
function googleCall(method,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));}
function cloudLabel(text){document.getElementById('cloud-status').textContent=text;}
function cloudError(error,conflict=false){
  cloud.blocked=true;cloudLabel(conflict?'Hay cambios de otro usuario':'Cambios pendientes de guardar');
  document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());
  const panel=document.getElementById('cloud-error');panel.hidden=false;
  document.getElementById('cloud-error-title').textContent=conflict?'Otro usuario actualizó la información':'No se pudieron guardar los cambios';
  document.getElementById('cloud-error-message').textContent=conflict?'Descarga tus cambios pendientes y vuelve a cargar la aplicación para ver la versión más reciente.':'Tus cambios siguen en esta ventana. Puedes descargar una copia o volver a intentar el guardado.';
  document.getElementById('cloud-retry').hidden=conflict;
  document.getElementById('cloud-reload').hidden=!conflict;
  console.error('Google save:',error?.message||String(error));
}
async function flushCloud(){
  if(cloud.saving||cloud.blocked||!Object.keys(cloud.pending).length)return;
  const batch=cloud.pending;cloud.pending={};cloud.saving=true;cloudLabel('Guardando en Google…');
  try{
    const result=await googleCall('api_saveAppState',batch,cloud.revision);
    if(result.conflict){cloud.pending={...batch,...cloud.pending};cloudError(new Error('Conflicto de versión'),true);return;}
    cloud.revision=result.revision;cloudLabel('Guardado en Google');
  }catch(error){cloud.pending={...batch,...cloud.pending};cloudError(error);}
  finally{cloud.saving=false;if(!cloud.blocked&&Object.keys(cloud.pending).length)cloud.timer=setTimeout(flushCloud,0);}
}
function loadStore(key,fallback){
  if(!Object.prototype.hasOwnProperty.call(cloud.cache,key))saveStore(key,structuredClone(fallback));
  return structuredClone(cloud.cache[key]);
}
function saveStore(key,value){
  if(!cloudKeys.includes(key))throw new Error('Colección desconocida');
  cloud.cache[key]=structuredClone(value);cloud.pending[key]=structuredClone(value);
  cloudLabel('Cambios pendientes…');clearTimeout(cloud.timer);cloud.timer=setTimeout(flushCloud,100);
}
function migrateLegacy(data){
  if(!data)return;
  const array=value=>Array.isArray(value)?value:(()=>{try{const parsed=JSON.parse(value);return Array.isArray(parsed)?parsed:[]}catch{return String(value||'').split(/[,;\n]/).map(item=>item.trim()).filter(Boolean)}})();
  const merge=(key,items,id)=>{
    if(!items.length||Object.prototype.hasOwnProperty.call(cloud.cache,key))return;
    const defaults=key==='samara.positions.v2'?window.seedData.positions:key==='samara.matrixPositions.v2'?window.seedData.matrixPositions:key==='samara.courses.v2'?window.seedData.courses.map(course=>({...course,department:course.department||course.code?.split('-')[0]||'',entity:course.entity||course.code?.match(/-(SAMARA|TACNA)\d+$/i)?.[1]||'',duration:String(course.duration||''),owner:course.instructor||'Por asignar',agent:course.instructorClass||'Interno',type:course.category||'Anual',area:course.theme||'',modality:course.modality==='Presencial, En línea'?'Mixta':course.modality,plant:course.program?.population||'Todas las áreas',date:'Por programar',time:course.program?.attendance||'Según programa anual',status:'En programa',participants:0})):[];
    saveStore(key,[...new Map([...defaults,...items].map(item=>[id(item),item])).values()]);
  };
  const legacyPositions=data.puestos||[],byId=new Map(legacyPositions.map(item=>[String(item.id),item]));
  const matrix=legacyPositions.map(item=>({id:`${item.nombre}|${item.departamento||'Por asignar'}`,job:item.nombre,department:item.departamento||'Por asignar',classification:'',applies:{},_legacy:item}));
  merge('samara.matrixPositions.v2',matrix,item=>item.id);
  merge('samara.positions.v2',legacyPositions.map(item=>({job:item.nombre,sirceCode:String(item.sirce||''),sirceOccupation:item.sirceOccupation||'',_legacy:item})),item=>item.job);
  merge('samara.employees.v2',(data.empleados||[]).map(item=>({no:String(item.no||''),curp:item.curp,names:item.nombres,paternal:item.apellidoPaterno,maternal:item.apellidoMaterno,studies:item.estudios,proofDocType:item.docProbatorio,institutionType:item.tipoInstitucion,position:byId.get(String(item.puestoId))?.nombre||item.puesto||'',department:byId.get(String(item.puestoId))?.departamento||'',demo:String(item.curp).includes('DEMO'),_legacy:item})),item=>item.curp);
  const employeeById=new Map((data.empleados||[]).map(item=>[String(item.id),item]));
  merge('samara.instructors.v1',(data.instructores||[]).map(item=>{
    const employee=employeeById.get(String(item.empleadoId)),internal=String(item.tipo).toLowerCase().includes('intern');
    return {id:item.id,type:internal?'Interno':'Externo',authorizationDate:item.authorizationDate||'',employeeCurp:employee?.curp||'',employeeNo:String(employee?.no||''),employeeName:employee?[employee.nombres,employee.apellidoPaterno,employee.apellidoMaterno].filter(Boolean).join(' '):internal?item.nombre:'',employeePosition:byId.get(String(employee?.puestoId))?.nombre||'',employeeDepartment:item.area||'',externalName:internal?'':item.nombre,rfc:item.rfc||'',stpsRegistration:item.certificacion||'',phone:item.contacto||'',authorizedCourses:array(item.cursos).map(value=>typeof value==='object'?value:{courseCode:'__other__',name:value,experience:['Empírica']}),_legacy:item};
  }),item=>item.id);
  merge('samara.courses.v2',(data.cursos||[]).map(item=>{
    const groups=array(item.comisiones).join(' ').toLowerCase();
    return {code:item.codigo,name:item.nombre,department:item.departamento,entity:item.sede,duration:String(item.duracion||''),instructor:array(item.instructores).join(', '),instructorIds:array(item.instructores).filter(id=>(data.instructores||[]).some(record=>record.id===id)),instructorClass:item.clasificacionInstructor,modality:item.modalidad,official:item.validezOficial,category:item.tipo,frequency:item.frecuencia,objective:item.objetivo,ec:item.noEC,revision:item.revision||'A',theme:item.areaDC3,sirce:item.sirce,activeStatus:item.estado||'Activo',applicablePositions:array(item.puestos).map(id=>{const position=byId.get(String(id));return position?`${position.nombre}|${position.departamento||'Por asignar'}`:id}),cmcapOnly:groups.includes('cmcap'),safetyCommissionOnly:groups.includes('higiene'),emergencyBrigadesOnly:groups.includes('brigada'),_legacy:item};
  }),item=>item.code);
  if((data.cmcap||[]).some(item=>item.nombre)&&!cloud.cache['samara.cmcap.v2'])saveStore('samara.cmcap.v2',data.cmcap.map(item=>({role:item.rol,name:item.nombre,term:''})));
}
document.getElementById('cloud-retry').onclick=()=>{cloud.blocked=false;document.getElementById('cloud-error').hidden=true;flushCloud();};
document.getElementById('cloud-reload').onclick=()=>{cloud.pending={};cloud.saving=false;location.reload();};
document.getElementById('cloud-backup').onclick=()=>{
  const link=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({savedRevision:cloud.revision,pending:cloud.pending,state:cloud.cache},null,2)],{type:'application/json'}));
  link.href=url;link.download='SAMARA-cambios-pendientes.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
window.addEventListener('beforeunload',event=>{if(cloud.saving||Object.keys(cloud.pending).length){event.preventDefault();event.returnValue='';}});
const bootstrap=await googleCall('api_loadAppState');
cloud.cache=bootstrap.state;cloud.revision=bootstrap.revision;
migrateLegacy(bootstrap.legacy);
cloudLabel('Conectado a Google');
document.getElementById('cloud-loading').remove();

// Catalogs from STPS: https://sirceempresas.stps.gob.mx/Uploads/Plantillas.zip
const employeeSirceCatalogs = {"studies": [["1", "Ninguno"], ["2", "Primaria"], ["3", "Secundaria"], ["4", "Bachillerato"], ["5", "Carrera técnica"], ["6", "Licenciatura"], ["7", "Especialidad"], ["8", "Maestría"], ["9", "Doctorado"]], "proofDocType": [["1", "Título"], ["2", "Certificado"], ["3", "Diploma"], ["4", "Otro"], ["5", "Ninguno"]], "institutionType": [["1", "Pública"], ["2", "Privada"], ["3", "Ninguna"]]};
function employeeCatalogCode(field,value){const entry=employeeSirceCatalogs[field].find(([code,label])=>String(value).trim()===code||norm(value)===norm(label)||norm(value)===norm(code+' · '+label));return entry?entry[0]:String(value||'')}
function employeeCatalogLabel(field,value){const code=employeeCatalogCode(field,value),entry=employeeSirceCatalogs[field].find(item=>item[0]===code);return entry?entry[0]+' · '+entry[1]:String(value||'')}
function fillEmployeeCatalogs(employee){for(const [field,entries] of Object.entries(employeeSirceCatalogs)){const select=employeeForm.elements[field],value=employeeCatalogCode(field,employee?.[field]||'');select.innerHTML='<option value="">Selecciona una opción</option>'+entries.map(([code,label])=>`<option value="${code}">${code} · ${escapeHtml(label)}</option>`).join('');if(value&&!entries.some(([code])=>code===value))select.add(new Option(value+' · Valor previo (revisar)',value));select.value=value}}
const $=selector=>document.querySelector(selector), $$=selector=>[...document.querySelectorAll(selector)];
const seed=window.seedData;
let matrixPositions=loadStore('samara.matrixPositions.v2',seed.matrixPositions);
let positions=loadStore('samara.positions.v2',seed.positions);
let occupationCatalog=loadStore('samara.occupationCatalog.v1',[...new Map(seed.positions.map(position=>[position.sirceCode,{code:position.sirceCode,occupation:position.sirceOccupation}])).values()]);
let employees=loadStore('samara.employees.v2',[]);
if(!loadStore('samara.demoEmployees.v1',false)){
  const demos=[
    {no:'PRUEBA-001',curp:'DEMOEMPLEADO0000001',names:'Ana Sofía',paternal:'Luna',maternal:'Torres',position:'COORDINADOR DE EHS',department:'SAMARA - EHS'},
    {no:'PRUEBA-002',curp:'DEMOEMPLEADO0000002',names:'Luis Eduardo',paternal:'Vega',maternal:'Ríos',position:'INSPECTOR DE CALIDAD',department:'SAMARA-CALIDAD'},
    {no:'PRUEBA-003',curp:'DEMOEMPLEADO0000003',names:'Mariana',paternal:'Solís',maternal:'Campos',position:'ANALISTA DE RH/RECEPCION',department:'TACNA - RH'}
  ].map(employee=>({...employee,studies:'Licenciatura',proofDocType:'Título',institutionType:'Privada',demo:true}));
  employees.push(...demos.filter(demo=>!employees.some(employee=>employee.curp===demo.curp)));
  saveStore('samara.employees.v2',employees);saveStore('samara.demoEmployees.v1',true);
}
let instructors=loadStore('samara.instructors.v1',[]);
let activeInstructorModule='Interno';
const cmcapRoles=Cmcap.roles;
let cmcapMembers=loadStore('samara.cmcap.v2',[]);
const icons=['◎','◉','⚕','↟','▣','◌','⚡','♧','▤','✓','⌗','✦'];
let courses=loadStore('samara.courses.v2',seed.courses.map((course,index)=>({
  ...course,department:course.department||course.code?.split('-')[0]||'',entity:course.entity||course.code?.match(/-(SAMARA|TACNA)\d+$/i)?.[1]||'',type:course.category||'Anual',area:course.theme||'',duration:String(course.duration||''),
  owner:course.instructor||'Por asignar',agent:course.instructorClass||'Interno',
  modality:course.modality==='Presencial, En línea'?'Mixta':course.modality,plant:course.program?.population||'Todas las áreas',
  date:course.program?.startDate&&course.program?.endDate?`${course.program.startDate} – ${course.program.endDate}`:'Por programar',
  time:course.program?.attendance||'Según programa anual',participants:0,status:'En programa',symbol:icons[index%icons.length]
})));
courses=courses.map(course=>({...course,department:course.department||course.code?.split('-')[0]||'',entity:course.entity||course.code?.match(/-(SAMARA|TACNA)\d+$/i)?.[1]||''}));
let editingCourseCode=null,editingEmployeeCurp=null,editingPositionJob=null,editingMatrixId=null,activeReport='';
let selectedCoursePositions=new Set();
const courseDialog=$('#course-dialog'),courseForm=$('#course-form'),instructorDialog=$('#instructor-dialog'),instructorForm=$('#instructor-form'),employeeDialog=$('#employee-dialog'),employeeForm=$('#employee-form'),positionDialog=$('#position-dialog'),positionForm=$('#position-form'),matrixDialog=$('#matrix-dialog'),reportDialog=$('#report-dialog');

function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function initials(name){return String(name||'RH').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function pillClass(status){return status==='En regla'?'full':status==='Pendiente'?'pending':'scheduled'}
function fullEmployeeName(e){return [e.names,e.paternal,e.maternal].filter(Boolean).join(' ')}
function objectiveCode(course){const text=String(course?.objective||'').toLowerCase();if(text.includes('riesgos'))return '2';if(text.includes('productividad'))return '3';if(text.includes('nivel educativo')||text.includes('mejorar nivel'))return '4';if(text.includes('vacante')||text.includes('puesto de nueva')||text.includes('preparar'))return '5';if(text.includes('actualizar')||text.includes('conocimientos')||text.includes('tecnologías'))return '1';return course?.objectiveCode?String(course.objectiveCode):'1'}
function objectiveLabel(code){return ({'1':'Actualizar y perfeccionar conocimientos y habilidades, y proporcionar información de nuevas tecnologías','2':'Prevenir riesgos de trabajo','3':'Incrementar la productividad','4':'Mejorar el nivel educativo','5':'Preparar para ocupar vacantes o puestos de nueva creación'})[String(code)]||''}
function fullInstructorName(item){return item.type==='Interno'?item.employeeName:item.externalName}
function renderSessions(){
  $('#sessions-table').innerHTML=courses.slice(0,4).map(c=>`<tr><td><div class="course-cell"><span class="course-symbol">${c.symbol||'▤'}</span><div><div class="course-title">${escapeHtml(c.name)}</div><div class="course-sub">${escapeHtml(c.code)} · ${escapeHtml(c.duration)} h</div></div></div></td><td><div class="date-main">${escapeHtml(c.date)}</div><div class="date-sub">${escapeHtml(c.time)}</div></td><td>${escapeHtml(c.plant)}</td><td><span class="person-count">Según matriz</span></td><td><div class="owner-cell"><span class="mini-avatar">${initials(c.owner)}</span>${escapeHtml(c.owner||'Por asignar')}</div></td><td><span class="status-pill ${pillClass(c.status)}">${escapeHtml(c.status)}</span></td><td><button class="row-more" data-edit-course="${escapeHtml(c.code)}" aria-label="Editar curso">✎</button></td></tr>`).join('');
}
function compareCourseCodes(a,b){return String(a.code||'').localeCompare(String(b.code||''),'es',{numeric:true,sensitivity:'base'})}
function filteredGlossaryCourses(){
  const query=($('#course-search')?.value||'').toLowerCase(),sirce=$('#course-type')?.value||'Todos',status=$('#course-status')?.value||'Todos';
  return courses.filter(course=>[course.code,course.name,course.instructor,course.owner,course.area,course.theme].join(' ').toLowerCase().includes(query)&&(sirce==='Todos'||norm(course.sirce)===norm(sirce))&&(status==='Todos'||(course.activeStatus||'Activo')===status)).sort(compareCourseCodes);
}
function deleteCourse(code){
  const course=courses.find(item=>item.code===code);if(!course)return;
  if(!window.confirm(`¿Eliminar ${code} · ${course.name}? Se quitará del glosario y de la matriz.`))return;
  courses=courses.filter(item=>item.code!==code);
  matrixPositions=matrixPositions.map(position=>{const applies={...(position.applies||{})};delete applies[code];return {...position,applies}});
  instructors=instructors.map(instructor=>({...instructor,authorizedCourses:(instructor.authorizedCourses||[]).map(authorized=>authorized.courseCode===code?{...authorized,courseCode:'__other__'}:authorized)}));
  saveStore('samara.courses.v2',courses);saveStore('samara.matrixPositions.v2',matrixPositions);saveStore('samara.instructors.v1',instructors);
  renderCourses();renderMatrix();renderSessions();renderInstructors();toast('Curso eliminado.');
}
function renderCourses(){
  const filtered=filteredGlossaryCourses();
  $('#course-grid').innerHTML=filtered.length?`<div class="course-list-heading"><span>Código / Curso</span><span>Instructor</span><span>Estado / SIRCE</span><span>Acciones</span></div>`+filtered.map(course=>`<article class="course-list-row"><div class="course-list-name"><small>${escapeHtml(course.code)}</small><h3>${escapeHtml(course.name)}</h3><span>${escapeHtml(course.duration)} h · ${escapeHtml(course.modality||'Por definir')}</span></div><div class="course-list-instructor">${escapeHtml(course.instructor||'Por asignar')}</div><div class="course-list-status"><span class="tag ${course.activeStatus==='Inactivo'?'soft':'green'}">${escapeHtml(course.activeStatus||'Activo')}</span><small>${course.sirce==='Sí'?'SIRCE':'Sin SIRCE'}</small></div><div class="course-list-actions"><button type="button" class="course-action edit" data-edit-course="${escapeHtml(course.code)}" aria-label="Editar ${escapeHtml(course.code)}" title="Editar curso">✎</button><button type="button" class="course-action delete" data-delete-course="${escapeHtml(course.code)}" aria-label="Eliminar ${escapeHtml(course.code)}" title="Eliminar curso">×</button></div></article>`).join(''):'<article class="panel empty-state">No encontramos cursos con esos filtros.</article>';
  $('#course-count').textContent=courses.length;$('#active-course-value').textContent=courses.length;
}
function syncCourseCatalog(){courses=loadStore('samara.courses.v2',courses);matrixPositions=loadStore('samara.matrixPositions.v2',matrixPositions)}
window.addEventListener('storage',event=>{if(['samara.courses.v2','samara.matrixPositions.v2'].includes(event.key)){syncCourseCatalog();renderMatrix();renderCourses();renderSessions()}});
window.addEventListener('focus',()=>{syncCourseCatalog();renderMatrix();renderCourses();renderSessions()});
function deleteMatrixPosition(id){
 const position=matrixPositions.find(item=>item.id===id);if(!position)return;
 if(!window.confirm(`¿Eliminar ${position.job} de ${position.department} en la matriz? Se quitarán sus asignaciones de cursos en este departamento.`))return;
 matrixPositions=matrixPositions.filter(item=>item.id!==id);
 courses=courses.map(course=>({...course,applicablePositions:(course.applicablePositions||[]).filter(positionId=>positionId!==id)}));
 saveStore('samara.matrixPositions.v2',matrixPositions);saveStore('samara.courses.v2',courses);
 renderMatrix();renderCourses();toast('Puesto eliminado de la matriz.');
}
function filteredMatrixRows(){
  const query=($('#matrix-search').value||'').toLowerCase(),status=$('#matrix-status').value,sirce=$('#matrix-sirce').value;
  return matrixPositions.filter(position=>(position.job+' '+position.department).toLowerCase().includes(query)).map(position=>({position,applicable:courses.filter(course=>((course.applicablePositions||[]).includes(position.id)||course.cmcapOnly||course.safetyCommissionOnly||course.emergencyBrigadesOnly)&&(status==='Todos'||(course.activeStatus||'Activo')===status)&&(sirce==='Todos'||norm(course.sirce)===norm(sirce)))})).filter(row=>row.applicable.length||(status==='Todos'&&sirce==='Todos'));
}
function filteredMatrixCourses(){const status=$('#matrix-status').value,sirce=$('#matrix-sirce').value;return courses.filter(course=>(status==='Todos'||(course.activeStatus||'Activo')===status)&&(sirce==='Todos'||norm(course.sirce)===norm(sirce))).sort(compareCourseCodes)}
function matrixCellLabel(position,course){const groups=[];if(course.cmcapOnly)groups.push('CMCAP');if(course.safetyCommissionOnly)groups.push('CSH');if(course.emergencyBrigadesOnly)groups.push('Brigadas');if(groups.length)return `Integrantes ${groups.join(' / ')} · Todos los puestos`;return (course.applicablePositions||[]).includes(position.id)?'Aplica':'No aplica'}
function crossMatrixTable(rows,columns,editable=false){return `<table class="cross-matrix"><colgroup><col class="matrix-class-col"><col class="matrix-job-col"><col class="matrix-dept-col">${columns.map(()=>'<col class="matrix-course-col">').join('')}${editable?'<col style="width:110px">':''}</colgroup><thead><tr><th rowspan="2">Clas.</th><th rowspan="2">Puesto</th><th rowspan="2">Departamento</th>${columns.map(course=>`<th class="matrix-area-head">${escapeHtml(course.department||course.code.split('-')[0])}</th>`).join('')}${editable?'<th rowspan="2">Acciones</th>':''}</tr><tr>${columns.map(course=>`<th class="matrix-code-head" title="${escapeHtml(course.name)}"><span>${escapeHtml(course.code)}</span></th>`).join('')}</tr></thead><tbody>${rows.map(({position},index)=>`<tr class="${index===0||rows[index-1].position.department!==position.department?'matrix-department-start':''}"><td>${escapeHtml(position.classification||'—')}</td><td>${escapeHtml(position.job)}</td><td>${escapeHtml(position.department)}</td>${columns.map(course=>{const label=matrixCellLabel(position,course);return `<td class="matrix-intersection ${label==='No aplica'?'not-applicable':label==='Aplica'?'applicable':'group-applicable'}" title="${escapeHtml(course.name)} · ${escapeHtml(label)}"><span class="matrix-screen-label">${label==='No aplica'?'—':label==='Aplica'?'✓':'◆'}</span><span class="matrix-print-label">${escapeHtml(label)}</span></td>`}).join('')}${editable?`<td><div class="course-list-actions"><button type="button" class="course-action edit" data-edit-position="${escapeHtml(position.job)}" aria-label="Editar puesto ${escapeHtml(position.job)}" title="Editar puesto">✎</button><button type="button" class="course-action edit" data-edit-matrix="${escapeHtml(position.id)}" aria-label="Editar cursos aplicables" title="Editar cursos aplicables">▦</button><button type="button" class="course-action delete" data-delete-matrix-position="${escapeHtml(position.id)}" aria-label="Eliminar puesto de la matriz" title="Eliminar puesto de la matriz">×</button></div></td>`:''}</tr>`).join('')}</tbody></table>`}
function renderMatrix(){
  const rows=filteredMatrixRows(),columns=filteredMatrixCourses();
  $('#matrix-summary').textContent=`${rows.length} puestos · ${columns.length} de ${courses.length} cursos visibles · ✓ Aplica · ◆ Integrantes de comisión o brigada (todos los puestos) · — No aplica`;
  $('#matrix-table').innerHTML=rows.length&&columns.length?`<div class="matrix-cross-scroll">${crossMatrixTable(rows,columns,true)}</div>`:'<div class="panel empty-state">No hay registros con estos filtros.</div>';
}
function renderPeople(){
  const query=($('#people-search')?.value||'').toLowerCase();

async function persistCollection(key,draft){
 const deadline=Date.now()+15000;
 while(cloud.saving||Object.keys(cloud.pending).length){
  if(cloud.blocked)throw Error('Hay cambios pendientes que no se pudieron guardar. Reintenta el guardado desde el aviso de conexión.');
  if(Date.now()>deadline)throw Error('El guardado anterior tarda demasiado. Espera un momento y vuelve a intentar.');
  if(!cloud.saving)await flushCloud();else await new Promise(resolve=>setTimeout(resolve,50));
 }
 if(cloud.blocked)throw Error('La conexión tiene cambios pendientes. Revisa el aviso de conexión.');
 cloud.saving=true;cloudLabel('Guardando cambios…');
 try{
  const result=await googleCall('api_saveAppState',{[key]:draft},cloud.revision);
  if(result.conflict)throw Error('Otra ventana cambió los datos. Descarga tus cambios pendientes y vuelve a cargar antes de agregar al integrante.');
  cloud.revision=result.revision;cloud.cache[key]=structuredClone(draft);cloudLabel('Guardado en Google');
 }catch(error){cloudLabel('No se pudieron guardar los cambios');throw error}finally{cloud.saving=false;if(Object.keys(cloud.pending).length&&!cloud.blocked)cloud.timer=setTimeout(flushCloud,0)}
}

  let pg,y,num=0;const nueva=()=>{pg=doc.addPage([W,H]);num++;pg.drawRectangle({x:0,y:H-46,width:W,height:46,color:rgb(.063,.141,.227)});pg.drawText('Listados de asistencia',{x:M,y:H-29,size:14,font:fb,color:rgb(1,1,1)});pg.drawText(wa(`SAMARA · Filtros: SIRCE ${AT.sirce} · Estado ${AT.estado}${AT.q?' · "'+AT.q+'"':''} · Emitido ${atFmt(atHoy())}`),{x:M,y:H-41,size:7.5,font:f,color:rgb(.8,.85,.9)});
    y=H-70;let x=M;cols.forEach(([t,w])=>{pg.drawText(t.toUpperCase(),{x:x+3,y,size:7,font:fb,color:rgb(.4,.47,.53)});x+=w});y-=8;pg.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.6,color:rgb(.85,.88,.9)});y-=14};
  nueva();l.forEach(s=>{if(y<40){pg.drawText(`Página ${num}`,{x:W-M-40,y:18,size:7,font:f});nueva()}const v=(s.asistentes||[]).filter(a=>a.estado==='ok').length;
    const vals=[s.cursoCodigo,s.cursoNombre||s.listaCurso,atFmt(s.fecha),s.encabezado?.instructor,(s.asistentes||[]).length,v,atSirce(s)?'Sí':'No',s.estado];let x=M;vals.forEach((t,i)=>{pg.drawText(cut(t,cols[i][1],f,8),{x:x+3,y,size:8,font:f,color:rgb(.07,.13,.2)});x+=cols[i][1]});y-=6;pg.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.4,color:rgb(.92,.93,.95)});y-=13});
  pg.drawText(`Página ${num}`,{x:W-M-40,y:18,size:7,font:f});await window.descargarArchivo(new Blob([await doc.save()],{type:'application/pdf'}),`Listados de asistencia ${atHoy()}.pdf`)}
function atCSV(){const l=atFiltrados();if(!l.length)return toast('No hay listados con estos filtros.');atRefrescarPadron();const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Código','Curso','Fecha','Lugar','Instructor','SIRCE','Estado del listado','No. empleado','Nombre','Puesto','Departamento','Firmó','Estado del asistente']];
  l.forEach(s=>(s.asistentes||[]).forEach(a=>{const p=AT_P[a.numero];rows.push([s.cursoCodigo,s.cursoNombre||s.listaCurso,s.fecha,s.encabezado?.lugar,s.encabezado?.instructor,atSirce(s)?'Sí':'No',s.estado,a.numero,p?p.nombre:(a.nombre||a.escrito),p?p.puesto:a.puesto,p?p.depto:a.departamento,a.firmo?'Sí':'No',{ok:'Validado',wa:'Por validar',no:'Sin firma'}[a.estado]||(s.estado==='Borrador'?'Borrador':'')])}));
  window.descargarArchivo(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`Listados de asistencia ${atHoy()}.csv`)}
/* importar padrón desde la hoja SIRCE */
async function atImportar(btn){if(!window.leerHojaSIRCE)return toast('La importación no está disponible aquí.');btn.disabled=true;btn.textContent='Importando…';
  try{const [bd,tr]=await Promise.all([window.leerHojaSIRCE('BD!A2:K1000'),window.leerHojaSIRCE('Trabajadores!A8:H1009')]);
    const dep={};tr.forEach(r=>{const n=String(r[0]||'').trim();if(n)dep[n]={department:String(r[4]||'').trim(),position:String(r[3]||'').trim()}});
    const byNo=new Map(employees.filter(e=>!e.demo).map(e=>[String(e.no),e]));let nuevos=0;
    bd.forEach(r=>{const no=String(r[0]||'').trim();if(!/^\d{3,}$/.test(no))return;const prev=byNo.get(no)||{};if(!byNo.has(no))nuevos++;byNo.set(no,{...prev,no,curp:String(r[1]||'').trim().toUpperCase()||prev.curp||'',names:(String(r[2]||'').trim()||prev.names||'').toUpperCase(),paternal:(String(r[3]||'').trim()||prev.paternal||'').toUpperCase(),maternal:(String(r[4]||'').trim()||prev.maternal||'').toUpperCase(),studies:String(r[5]||prev.studies||''),proofDocType:String(r[6]||prev.proofDocType||''),institutionType:String(r[7]||prev.institutionType||''),position:String(r[8]||'').trim()||dep[no]?.position||prev.position||'',department:dep[no]?.department||prev.department||'',demo:false})});
    employees=[...byNo.values()];saveStore('samara.employees.v2',employees);try{renderPeople()}catch(e){}renderAttendance();toast(`Padrón actualizado: ${employees.length} colaboradores (${nuevos} nuevos).`)}
  catch(e){toast('No se pudo leer la hoja: '+(e.message||e.code||e))}finally{btn.disabled=false;btn.textContent='⇣ Importar padrón SIRCE'}}
/* eventos */
const AT_A={
  nueva:()=>atNuevaDialog(),cerrar:()=>$('#att-dialog').close(),manual:()=>{$('#att-dialog').close();atAbrir({leida:false,cursoCodigo:'',fecha:atHoy()})},
  importar:(d,el)=>atImportar(el),vertodos:()=>{AT.q='';AT.sirce='Todos';AT.estado='Todos';AT.desde='';AT.hasta='';renderAttendance()},limpiarcola:()=>{AT.cola=[];renderAttendance()},imprimirtabla:()=>atImprimirTabla(),csv:()=>atCSV(),cancelar:()=>{AT.ed=null;renderAttendance()},
  abrir:d=>{const s=attendance.find(x=>x.id===d.id);if(!s)return;atAbrir(atEdDe(s))},
  borrar:(d,el)=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='¿Eliminar?';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='🗑'}},3000);return}attendance=attendance.filter(x=>x.id!==d.id);saveStore('samara.attendance.v1',attendance);renderAttendance();toast('Listado eliminado.')},
  borrarlista:(d,el)=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Toca otra vez';return}attendance=attendance.filter(x=>x.id!==AT.ed.id);saveStore('samara.attendance.v1',attendance);AT.ed=null;renderAttendance();toast('Listado eliminado.')},
  pdflista:d=>atPdfLista(d.id),pdfdc3:d=>atPdfDC3(d.id),guardar:()=>atGuardar(),
  usarcat:d=>{AT.ed.enc[d.k]=atCatVal(d.k,atC(AT.ed.cursoCodigo))||'';atPintar()},dejar:d=>{AT.ed.encOk[d.k]=true;atPintar()},
  quitar:d=>{AT.ed.asistentes.splice(+d.i,1);atPintar()},confirmar:d=>{AT.ed.asistentes[+d.i].ok=true;atPintar()},
  sugerencia:d=>{if(AT.ed.asistentes.some(a=>a.numero===d.n))return toast('Ese colaborador ya está en la lista.');const a=AT.ed.asistentes[+d.i];a.numero=d.n;a.ok=true;atPintar()},
  altaemp:d=>atAltaPersonal(d.i),
  altains:()=>{AT.pendIns=true;openInstructorEditor('',AT.ed.enc.clasificacion==='Externo'?'Externo':'Interno')},
  editins:d=>{AT.pendIns=true;openInstructorEditor(d.id)},
};
document.addEventListener('click',ev=>{
  const o=ev.target.closest('.att-cbo');if(o){ev.preventDefault();const inp=o.parentElement.previousElementSibling;
    if(o.dataset.alta==='ins'){atCbCerrar();AT.ed.enc.instructor=inp.value.trim()||AT.ed.enc.instructor;AT.ed.enc.instructorId='';AT_A.altains();return}
    if(o.dataset.alta==='emp'){atCbCerrar();const i=inp.dataset.i;if(i==='new'){AT.ed.asistentes.push({numero:'',escrito:inp.value.trim(),firmo:true,ok:false});atPintar();atAltaPersonal(AT.ed.asistentes.length-1)}else{AT.ed.asistentes[+i].escrito=inp.value.trim()||AT.ed.asistentes[+i].escrito;atAltaPersonal(i)}return}
    atCbElegir(inp,o.dataset.v);return}
  if(!ev.target.closest('.att-cb'))atCbCerrar();
  const el=ev.target.closest('[data-att]');if(!el)return;const f=AT_A[el.dataset.att];if(f){ev.preventDefault();f(el.dataset,el)}});
document.addEventListener('focusin',ev=>{if(ev.target.classList?.contains('att-cbi')){atCbCerrar();atCbAbrir(ev.target)}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.classList?.contains('att-cbi'))atCbAbrir(t);else if(t.id==='att-search'){AT.q=t.value;const pos=t.selectionStart;renderAttendance();const n=$('#att-search');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',ev=>{const t=ev.target;if(!t.classList?.contains('att-cbi'))return;const box=t.nextElementSibling;if(ev.key==='Escape')return atCbCerrar();if(ev.key==='ArrowDown'){const f=box.querySelector('.att-cbo');if(f){ev.preventDefault();f.focus()}}if(ev.key==='Enter'){ev.preventDefault();const f=box.querySelector('.att-cbo[data-v]');if(f&&!box.hidden)atCbElegir(t,f.dataset.v)}});
document.addEventListener('change',ev=>{const t=ev.target;if(!t.closest('#view-attendance,#att-dialog'))return;
  if(t.id==='att-foto'&&t.files?.length)atLeerVarios([...t.files]);
  else if(t.id==='att-f-sirce'){AT.sirce=t.value;renderAttendance()}
  else if(t.id==='att-f-estado'){AT.estado=t.value;renderAttendance()}
  else if(t.id==='att-f-desde'){AT.desde=t.value;renderAttendance()}
  else if(t.id==='att-f-hasta'){AT.hasta=t.value;renderAttendance()}
  else if(t.id==='att-curso'){AT.ed.cursoCodigo=t.value;AT.ed.encOk={};atPintar()}
  else if(t.id==='att-fecha')AT.ed.fecha=t.value;
  else if(t.dataset.h){AT.ed.enc[t.dataset.h]=t.value;delete AT.ed.encOk[t.dataset.h];atPintar()}
  else if(t.dataset.firma){AT.ed.asistentes[+t.dataset.firma].firmo=t.checked;atPintar()}});
$('#instructor-dialog').addEventListener('close',()=>{if(!AT.pendIns||!AT.ed)return;AT.pendIns=false;const e=AT.ed;if(!atI(e.enc.instructorId)){const i=atBuscarIns(e.enc.instructor);if(i){e.enc.instructorId=i.id;e.enc.instructor=i.nombre}}const i=atI(e.enc.instructorId);if(i){if(i.tipo)e.enc.clasificacion=i.tipo;if(i.rfc)e.enc.rfc=i.rfc;if(i.registro)e.enc.registro=i.registro}atPintar()});
renderAttendance();
if(window.SAMARA_INITIAL_VIEW==='attendance')showView('attendance');
/* ==================== FIN MÓDULO LISTADOS ==================== */

}catch(error){document.getElementById("cloud-loading")?.remove();document.getElementById("cloud-error").hidden=false;document.getElementById("cloud-retry").hidden=true;document.getElementById("cloud-reload").hidden=false;document.getElementById("cloud-reload").onclick=()=>location.reload();document.getElementById("cloud-error-message").textContent="No se pudo cargar la información. Vuelve a intentarlo. "+(error.message||"");console.error(error);}
})();
</script>
