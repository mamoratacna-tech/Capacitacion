<script>
// SAMARA: compatibilidad HtmlService; sin plantillas literales.
(async function () {
  try {
    // Shared Google Sheets persistence. The Site UI calls these synchronous wrappers.
    const cloud = {
      cache: {},
      pending: {},
      revision: 0,
      saving: false,
      inFlight: null,
      lastError: null,
      blocked: false,
      timer: null
    };
    const cloudKeys = ['samara.legalRepresentative.v1','samara.attendance.v1', 'samara.attendanceMigration.v1', 'samara.matrixPositions.v2', 'samara.positions.v2', 'samara.occupationCatalog.v1', 'samara.employees.v2', 'samara.demoEmployees.v1', 'samara.instructors.v1', 'samara.cmcap.v2', 'samara.courses.v2'];
    function appConfirm(message) {
      return new Promise(resolve => {
        const dialog = document.createElement('dialog');
        dialog.className = 'app-confirm';
        dialog.setAttribute('aria-labelledby','app-confirm-title');
        dialog.innerHTML = '<div class="record-editor"><div class="dialog-head"><div><div class="eyebrow">SAMARA</div><h2 id="app-confirm-title">Confirmar acción</h2></div><button type="button" class="close-dialog" aria-label="Cerrar">×</button></div><p class="confirm-message"></p><div class="dialog-actions"><button type="button" class="button outline" data-answer="cancel">Cancelar</button><button type="button" class="button primary" data-answer="accept">Aceptar</button></div></div>';
        dialog.querySelector('.confirm-message').textContent = message;
        dialog.addEventListener('click',event => {
          const button = event.target.closest('button');
          if (button) dialog.close(button.dataset.answer || 'cancel');
        });
        dialog.addEventListener('close',()=>{ const accepted = dialog.returnValue === 'accept'; dialog.remove(); resolve(accepted); },{once:true});
        document.body.append(dialog);
        dialog.showModal();
        dialog.querySelector('[data-answer="cancel"]').focus();
      });
    }
    function googleCall(method, ...args) {
      return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));
    }
    function cloudLabel(text) {
      document.getElementById('cloud-status').textContent = text;
    }
    function cloudError(error, conflict = false) {
      cloud.blocked = true;
      cloudLabel(conflict ? 'Hay cambios de otro usuario' : 'Cambios pendientes de guardar');
      document.querySelectorAll('dialog[open]').forEach(dialog => dialog.close());
      const panel = document.getElementById('cloud-error');
      panel.hidden = false;
      document.getElementById('cloud-error-title').textContent = conflict ? 'Otro usuario actualizó la información' : 'No se pudieron guardar los cambios';
      document.getElementById('cloud-error-message').textContent = conflict ? 'Descarga tus cambios pendientes y vuelve a cargar la aplicación para ver la versión más reciente.' : 'Tus cambios siguen en esta ventana. Puedes descargar una copia o volver a intentar el guardado.';
      document.getElementById('cloud-retry').hidden = conflict;
      document.getElementById('cloud-reload').hidden = !conflict;
      console.error('Google save:', error?.message || String(error));
    }
    function flushCloud() {
      if (cloud.inFlight) return cloud.inFlight;
      if (cloud.blocked || !Object.keys(cloud.pending).length) return Promise.resolve();
      clearTimeout(cloud.timer);
      cloud.saving = true;
      cloud.inFlight = (async function () {
        try {
          while (!cloud.blocked && Object.keys(cloud.pending).length) {
            const batch = cloud.pending;
            cloud.pending = {};
            cloudLabel('Guardando en Google…');
            try {
              const result = await googleCall('api_saveAppState', batch, cloud.revision);
              if (result.conflict) {
                const error = new Error('Otra ventana actualizó la información. Descarga tus cambios pendientes antes de volver a cargar.');
                error.conflict = true;
                throw error;
              }
              cloud.revision = result.revision;
              cloud.lastError = null;
            } catch (error) {
              cloud.pending = { ...batch, ...cloud.pending };
              cloud.lastError = error;
              cloudError(error, !!error.conflict);
            }
          }
          if (!cloud.blocked) cloudLabel('Guardado en Google');
        } finally {
          cloud.saving = false;
          cloud.inFlight = null;
        }
      })();
      return cloud.inFlight;
    }
    function loadStore(key, fallback) {
      if (!Object.prototype.hasOwnProperty.call(cloud.cache, key)) saveStore(key, structuredClone(fallback));
      return structuredClone(cloud.cache[key]);
    }
    function saveStore(key, value) {
      if (!cloudKeys.includes(key)) throw new Error('Colección desconocida');
      cloud.cache[key] = structuredClone(value);
      cloud.pending[key] = structuredClone(value);
      cloudLabel('Cambios pendientes…');
      clearTimeout(cloud.timer);
      cloud.timer = setTimeout(flushCloud, 100);
    }
    function migrateLegacy(data) {
      if (!data) return;
      const array = value => Array.isArray(value) ? value : (() => {
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return String(value || '').split(/[,;\n]/).map(item => item.trim()).filter(Boolean);
        }
      })();
      const merge = (key, items, id) => {
        if (!items.length || Object.prototype.hasOwnProperty.call(cloud.cache, key)) return;
        const defaults = key === 'samara.positions.v2' ? window.seedData.positions : key === 'samara.matrixPositions.v2' ? window.seedData.matrixPositions : key === 'samara.courses.v2' ? window.seedData.courses.map(course => ({
          ...course,
          department: course.department || course.code?.split('-')[0] || '',
          entity: course.entity || course.code?.match(/-(SAMARA|TACNA)\d+$/i)?.[1] || '',
          duration: String(course.duration || ''),
          owner: course.instructor || 'Por asignar',
          agent: course.instructorClass || 'Interno',
          type: course.category || 'Anual',
          area: course.theme || '',
          modality: course.modality === 'Presencial, En línea' ? 'Mixta' : course.modality,
          plant: course.program?.population || 'Todas las áreas',
          date: 'Por programar',
          time: course.program?.attendance || 'Según programa anual',
          status: 'En programa',
          participants: 0
        })) : [];
        saveStore(key, [...new Map([...defaults, ...items].map(item => [id(item), item])).values()]);
      };
      const legacyPositions = data.puestos || [],
        byId = new Map(legacyPositions.map(item => [String(item.id), item]));
      const matrix = legacyPositions.map(item => ({
        id: "".concat(item.nombre, "|").concat(item.departamento || 'Por asignar'),
        job: item.nombre,
        department: item.departamento || 'Por asignar',
        classification: '',
        applies: {},
        _legacy: item
      }));
      merge('samara.matrixPositions.v2', matrix, item => item.id);
      merge('samara.positions.v2', legacyPositions.map(item => ({
        job: item.nombre,
        sirceCode: String(item.sirce || ''),
        sirceOccupation: item.sirceOccupation || '',
        _legacy: item
      })), item => item.job);
      merge('samara.employees.v2', (data.empleados || []).map(item => ({
        no: String(item.no || ''),
        curp: item.curp,
        names: item.nombres,
        paternal: item.apellidoPaterno,
        maternal: item.apellidoMaterno,
        studies: item.estudios,
        proofDocType: item.docProbatorio,
        institutionType: item.tipoInstitucion,
        position: byId.get(String(item.puestoId))?.nombre || item.puesto || '',
        department: byId.get(String(item.puestoId))?.departamento || '',
        demo: String(item.curp).includes('DEMO'),
        _legacy: item
      })), item => item.curp);
      const employeeById = new Map((data.empleados || []).map(item => [String(item.id), item]));
      merge('samara.instructors.v1', (data.instructores || []).map(item => {
        const employee = employeeById.get(String(item.empleadoId)),
          internal = String(item.tipo).toLowerCase().includes('intern');
        return {
          id: item.id,
          type: internal ? 'Interno' : 'Externo',
          authorizationDate: item.authorizationDate || '',
          employeeCurp: employee?.curp || '',
          employeeNo: String(employee?.no || ''),
          employeeName: employee ? [employee.nombres, employee.apellidoPaterno, employee.apellidoMaterno].filter(Boolean).join(' ') : internal ? item.nombre : '',
          employeePosition: byId.get(String(employee?.puestoId))?.nombre || '',
          employeeDepartment: item.area || '',
          externalName: internal ? '' : item.nombre,
          rfc: item.rfc || '',
          stpsRegistration: item.certificacion || '',
          phone: item.contacto || '',
          authorizedCourses: array(item.cursos).map(value => typeof value === 'object' ? value : {
            courseCode: '__other__',
            name: value,
            experience: ['Empírica']
          }),
          _legacy: item
        };
      }), item => item.id);
      merge('samara.courses.v2', (data.cursos || []).map(item => {
        const groups = array(item.comisiones).join(' ').toLowerCase();
        return {
          code: item.codigo,
          name: item.nombre,
          department: item.departamento,
          entity: item.sede,
          duration: String(item.duracion || ''),
          instructor: array(item.instructores).join(', '),
          instructorIds: array(item.instructores).filter(id => (data.instructores || []).some(record => record.id === id)),
          instructorClass: item.clasificacionInstructor,
          modality: item.modalidad,
          official: item.validezOficial,
          category: item.tipo,
          frequency: item.frecuencia,
          objective: item.objetivo,
          ec: item.noEC,
          revision: item.revision || 'A',
          theme: item.areaDC3,
          sirce: item.sirce,
          activeStatus: item.estado || 'Activo',
          applicablePositions: array(item.puestos).map(id => {
            const position = byId.get(String(id));
            return position ? "".concat(position.nombre, "|").concat(position.departamento || 'Por asignar') : id;
          }),
          cmcapOnly: groups.includes('cmcap'),
          safetyCommissionOnly: groups.includes('higiene'),
          emergencyBrigadesOnly: groups.includes('brigada'),
          _legacy: item
        };
      }), item => item.code);
      if ((data.cmcap || []).some(item => item.nombre) && !cloud.cache['samara.cmcap.v2']) saveStore('samara.cmcap.v2', data.cmcap.map(item => ({
        role: item.rol,
        name: item.nombre,
        term: ''
      })));
    }
    document.getElementById('cloud-retry').onclick = () => {
      cloud.blocked = false;
      document.getElementById('cloud-error').hidden = true;
      flushCloud();
    };
    document.getElementById('cloud-reload').onclick = () => {
      cloud.pending = {};
      cloud.saving = false;
      location.reload();
    };
    document.getElementById('cloud-backup').onclick = () => {
      const link = document.createElement('a'),
        url = URL.createObjectURL(new Blob([JSON.stringify({
          savedRevision: cloud.revision,
          pending: cloud.pending,
          state: cloud.cache
        }, null, 2)], {
          type: 'application/json'
        }));
      link.href = url;
      link.download = 'SAMARA-cambios-pendientes.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    window.addEventListener('beforeunload', event => {
      if (cloud.saving || Object.keys(cloud.pending).length) {
        event.preventDefault();
        event.returnValue = '';
      }
    });
    const bootstrap = await googleCall('api_loadAppState');
    cloud.cache = bootstrap.state;
    cloud.revision = bootstrap.revision;
    migrateLegacy(bootstrap.legacy);
    cloudLabel('Conectado a Google');
    document.getElementById('cloud-loading').remove();

    // Catalogs from STPS: https://sirceempresas.stps.gob.mx/Uploads/Plantillas.zip
    const employeeSirceCatalogs = {
      'studies': [['1', 'Ninguno'], ['2', 'Primaria'], ['3', 'Secundaria'], ['4', 'Bachillerato'], ['5', 'Carrera técnica'], ['6', 'Licenciatura'], ['7', 'Especialidad'], ['8', 'Maestría'], ['9', 'Doctorado']],
      'proofDocType': [['1', 'Título'], ['2', 'Certificado'], ['3', 'Diploma'], ['4', 'Otro'], ['5', 'Ninguno']],
      'institutionType': [['1', 'Pública'], ['2', 'Privada'], ['3', 'Ninguna']]
    };
    function employeeCatalogCode(field, value) {
      const entry = employeeSirceCatalogs[field].find(([code, label]) => String(value).trim() === code || norm(value) === norm(label) || norm(value) === norm(code + ' · ' + label));
      return entry ? entry[0] : String(value || '');
    }
    function employeeCatalogLabel(field, value) {
      const code = employeeCatalogCode(field, value),
        entry = employeeSirceCatalogs[field].find(item => item[0] === code);
      return entry ? entry[0] + ' · ' + entry[1] : String(value || '');
    }
    function fillEmployeeCatalogs(employee) {
      for (const [field, entries] of Object.entries(employeeSirceCatalogs)) {
        const select = employeeForm.elements[field],
          value = employeeCatalogCode(field, employee?.[field] || '');
        select.innerHTML = '<option value="">Selecciona una opción</option>' + entries.map(([code, label]) => "<option value=\"".concat(code, "\">").concat(code, " · ").concat(escapeHtml(label), "</option>")).join('');
        if (value && !entries.some(([code]) => code === value)) select.add(new Option(value + ' · Valor previo (revisar)', value));
        select.value = value;
      }
    }
    const $ = selector => document.querySelector(selector),
      $$ = selector => [...document.querySelectorAll(selector)];
    const seed = window.seedData;
    let matrixPositions = loadStore('samara.matrixPositions.v2', seed.matrixPositions);
    let positions = loadStore('samara.positions.v2', seed.positions);
    let occupationCatalog = loadStore('samara.occupationCatalog.v1', [...new Map(seed.positions.map(position => [position.sirceCode, {
      code: position.sirceCode,
      occupation: position.sirceOccupation
    }])).values()]);
    let employees = loadStore('samara.employees.v2', []);
    if (!loadStore('samara.demoEmployees.v1', false)) {
      const demos = [{
        no: 'PRUEBA-001',
        curp: 'DEMOEMPLEADO0000001',
        names: 'Ana Sofía',
        paternal: 'Luna',
        maternal: 'Torres',
        position: 'COORDINADOR DE EHS',
        department: 'SAMARA - EHS'
      }, {
        no: 'PRUEBA-002',
        curp: 'DEMOEMPLEADO0000002',
        names: 'Luis Eduardo',
        paternal: 'Vega',
        maternal: 'Ríos',
        position: 'INSPECTOR DE CALIDAD',
        department: 'SAMARA-CALIDAD'
      }, {
        no: 'PRUEBA-003',
        curp: 'DEMOEMPLEADO0000003',
        names: 'Mariana',
        paternal: 'Solís',
        maternal: 'Campos',
        position: 'ANALISTA DE RH/RECEPCION',
        department: 'TACNA - RH'
      }].map(employee => ({
        ...employee,
        studies: 'Licenciatura',
        proofDocType: 'Título',
        institutionType: 'Privada',
        demo: true
      }));
      employees.push(...demos.filter(demo => !employees.some(employee => employee.curp === demo.curp)));
      saveStore('samara.employees.v2', employees);
      saveStore('samara.demoEmployees.v1', true);
    }
    let instructors = loadStore('samara.instructors.v1', []);
    let activeInstructorModule = 'Interno';
    const cmcapRoles = Cmcap.roles;
    let cmcapMembers = loadStore('samara.cmcap.v2', []);
    let legalRepresentative = loadStore('samara.legalRepresentative.v1', [{name: 'Mirna Ulbrich Labastida'}]);
    let cmcapEditing = null;
    function legalSigner() {
      const name = String(legalRepresentative[0]?.name || '').trim().toLocaleUpperCase('es-MX');
      if (!name) throw new Error('Completa el representante legal en CMCAP.');
      return name;
    }
    const icons = ['◎', '◉', '⚕', '↟', '▣', '◌', '⚡', '♧', '▤', '✓', '⌗', '✦'];
    let courses = loadStore('samara.courses.v2', seed.courses.map((course, index) => ({
      ...course,
      department: course.department || course.code?.split('-')[0] || '',
      entity: course.entity || course.code?.match(/-(SAMARA|TACNA)\d+$/i)?.[1] || '',
      type: course.category || 'Anual',
      area: course.theme || '',
      duration: String(course.duration || ''),
      owner: course.instructor || 'Por asignar',
      agent: course.instructorClass || 'Interno',
      modality: course.modality === 'Presencial, En línea' ? 'Mixta' : course.modality,
      plant: course.program?.population || 'Todas las áreas',
      date: course.program?.startDate && course.program?.endDate ? "".concat(course.program.startDate, " – ").concat(course.program.endDate) : 'Por programar',
      time: course.program?.attendance || 'Según programa anual',
      participants: 0,
      status: 'En programa',
      symbol: icons[index % icons.length]
    })));
    courses = courses.map(course => ({
      ...course,
      department: course.department || course.code?.split('-')[0] || '',
      entity: course.entity || course.code?.match(/-(SAMARA|TACNA)\d+$/i)?.[1] || ''
    }));
    let editingCourseCode = null,
      editingEmployeeCurp = null,
      editingPositionJob = null,
      editingMatrixId = null,
      activeReport = '';
    let selectedCoursePositions = new Set();
    const courseDialog = $('#course-dialog'),
      courseForm = $('#course-form'),
      instructorDialog = $('#instructor-dialog'),
      instructorForm = $('#instructor-form'),
      employeeDialog = $('#employee-dialog'),
      employeeForm = $('#employee-form'),
      positionDialog = $('#position-dialog'),
      positionForm = $('#position-form'),
      matrixDialog = $('#matrix-dialog'),
      reportDialog = $('#report-dialog');
    function toast(message) {
      const el = $('#toast');
      el.textContent = message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2600);
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c]);
    }
    function norm(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }
    function initials(name) {
      return String(name || 'RH').split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
    }
    function pillClass(status) {
      return status === 'En regla' ? 'full' : status === 'Pendiente' ? 'pending' : 'scheduled';
    }
    function fullEmployeeName(e) {
      return [e.names, e.paternal, e.maternal].filter(Boolean).join(' ');
    }
    function objectiveCode(course) {
      const text = String(course?.objective || '').toLowerCase();
      if (text.includes('riesgos')) return '2';
      if (text.includes('productividad')) return '3';
      if (text.includes('nivel educativo') || text.includes('mejorar nivel')) return '4';
      if (text.includes('vacante') || text.includes('puesto de nueva') || text.includes('preparar')) return '5';
      if (text.includes('actualizar') || text.includes('conocimientos') || text.includes('tecnologías')) return '1';
      return course?.objectiveCode ? String(course.objectiveCode) : '1';
    }
    function objectiveLabel(code) {
      return {
        '1': 'Actualizar y perfeccionar conocimientos y habilidades, y proporcionar información de nuevas tecnologías',
        '2': 'Prevenir riesgos de trabajo',
        '3': 'Incrementar la productividad',
        '4': 'Mejorar el nivel educativo',
        '5': 'Preparar para ocupar vacantes o puestos de nueva creación'
      }[String(code)] || '';
    }
    function fullInstructorName(item) {
      return item.type === 'Interno' ? item.employeeName : item.externalName;
    }
    function renderSessions() {
      $('#sessions-table').innerHTML = courses.slice(0, 4).map(c => "<tr><td><div class=\"course-cell\"><span class=\"course-symbol\">".concat(c.symbol || '▤', "</span><div><div class=\"course-title\">").concat(escapeHtml(c.name), "</div><div class=\"course-sub\">").concat(escapeHtml(c.code), " · ").concat(escapeHtml(c.duration), " h</div></div></div></td><td><div class=\"date-main\">").concat(escapeHtml(c.date), "</div><div class=\"date-sub\">").concat(escapeHtml(c.time), "</div></td><td>").concat(escapeHtml(c.plant), "</td><td><span class=\"person-count\">Según matriz</span></td><td><div class=\"owner-cell\"><span class=\"mini-avatar\">").concat(initials(c.owner), "</span>").concat(escapeHtml(c.owner || 'Por asignar'), "</div></td><td><span class=\"status-pill ").concat(pillClass(c.status), "\">").concat(escapeHtml(c.status), "</span></td><td><button class=\"row-more\" data-edit-course=\"").concat(escapeHtml(c.code), "\" aria-label=\"Editar curso\">✎</button></td></tr>")).join('');
    }
    function compareCourseCodes(a, b) {
      return String(a.code || '').localeCompare(String(b.code || ''), 'es', {
        numeric: true,
        sensitivity: 'base'
      });
    }
    function filteredGlossaryCourses() {
      const query = ($('#course-search')?.value || '').toLowerCase(),
        sirce = $('#course-type')?.value || 'Todos',
        status = $('#course-status')?.value || 'Todos';
      return courses.filter(course => [course.code, course.name, course.instructor, course.owner, course.area, course.theme].join(' ').toLowerCase().includes(query) && (sirce === 'Todos' || norm(course.sirce) === norm(sirce)) && (status === 'Todos' || (course.activeStatus || 'Activo') === status)).sort(compareCourseCodes);
    }
    async function deleteCourse(code) {
      const course = courses.find(item => item.code === code);
      if (!course) return;
      if (!await appConfirm("¿Eliminar ".concat(code, " · ").concat(course.name, "? Se quitará del glosario y de la matriz."))) return;
      courses = courses.filter(item => item.code !== code);
      matrixPositions = matrixPositions.map(position => {
        const applies = {
          ...(position.applies || {})
        };
        delete applies[code];
        return {
          ...position,
          applies
        };
      });
      instructors = instructors.map(instructor => ({
        ...instructor,
        authorizedCourses: (instructor.authorizedCourses || []).map(authorized => authorized.courseCode === code ? {
          ...authorized,
          courseCode: '__other__'
        } : authorized)
      }));
      saveStore('samara.courses.v2', courses);
      saveStore('samara.matrixPositions.v2', matrixPositions);
      saveStore('samara.instructors.v1', instructors);
      renderCourses();
      renderMatrix();
      renderSessions();
      renderInstructors();
      toast('Curso eliminado.');
    }
    function renderCourses() {
      const filtered = filteredGlossaryCourses();
      $('#course-grid').innerHTML = filtered.length ? "<div class=\"course-list-heading\"><span>Código / Curso</span><span>Instructor</span><span>Estado / SIRCE</span><span>Acciones</span></div>" + filtered.map(course => "<article class=\"course-list-row\"><div class=\"course-list-name\"><small>".concat(escapeHtml(course.code), "</small><h3>").concat(escapeHtml(course.name), "</h3><span>").concat(escapeHtml(course.duration), " h · ").concat(escapeHtml(course.modality || 'Por definir'), "</span></div><div class=\"course-list-instructor\">").concat(escapeHtml(course.instructor || 'Por asignar'), "</div><div class=\"course-list-status\"><span class=\"tag ").concat(course.activeStatus === 'Inactivo' ? 'soft' : 'green', "\">").concat(escapeHtml(course.activeStatus || 'Activo'), "</span><small>").concat(course.sirce === 'Sí' ? 'SIRCE' : 'Sin SIRCE', "</small></div><div class=\"course-list-actions\"><button type=\"button\" class=\"course-action edit\" data-edit-course=\"").concat(escapeHtml(course.code), "\" aria-label=\"Editar ").concat(escapeHtml(course.code), "\" title=\"Editar curso\">✎</button><button type=\"button\" class=\"course-action delete\" data-delete-course=\"").concat(escapeHtml(course.code), "\" aria-label=\"Eliminar ").concat(escapeHtml(course.code), "\" title=\"Eliminar curso\">×</button></div></article>")).join('') : '<article class="panel empty-state">No encontramos cursos con esos filtros.</article>';
      $('#course-count').textContent = courses.length;
      $('#active-course-value').textContent = courses.length;
    }
    function syncCourseCatalog() {
      courses = loadStore('samara.courses.v2', courses);
      matrixPositions = loadStore('samara.matrixPositions.v2', matrixPositions);
    }
    window.addEventListener('storage', event => {
      if (['samara.courses.v2', 'samara.matrixPositions.v2'].includes(event.key)) {
        syncCourseCatalog();

      if (cloud.blocked) throw cloud.lastError || new Error('Hay cambios pendientes. Reintenta el guardado desde el aviso de conexión.');
      // Join the same queue as automatic saves, including an already running request.
      // Keep the draft pending until Google confirms it; slow saves are not failures.

      await flushCloud();

    }

      try {
        const rows = file.name.toLowerCase().endsWith('.xlsx') ? await readXlsx(file) : parseCsv(await file.text());
        let header = -1,
          codeColumn = -1,
          occupationColumn = -1;
        for (let index = 0; index < Math.min(rows.length, 20); index++) {
          const keys = rows[index].map(norm);
          const code = keys.findIndex(key => ['codigosirce', 'idocupacion', 'clave', 'codigo', 'id'].includes(key)),
            occupation = keys.findIndex(key => ['ocupacion', 'ocupacionsirce', 'descripcion', 'descocupacion', 'nombreocupacion'].includes(key));
          if (code >= 0 && occupation >= 0 && code !== occupation) {
            header = index;
            codeColumn = code;

        if (header < 0) throw new Error('El archivo debe incluir las columnas Código SIRCE y Ocupación.');

    function parseCsv(text) {
      const rows = [];
      let row = [],
        cell = '',
        quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"' && quoted && text[i + 1] === '"') {
          cell += '"';
          i++;
        } else if (ch === '"') quoted = !quoted;else if (ch === ',' && !quoted) {
          row.push(cell);
          cell = '';
        } else if ((ch === '\n' || ch === '\r') && !quoted) {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(cell);
          if (row.some(value => value.trim())) rows.push(row);
          row = [];
          cell = '';
        } else cell += ch;
      }
      row.push(cell);
      if (row.some(value => value.trim())) rows.push(row);

      const workbook = new DOMParser().parseFromString(await zip.file('xl/workbook.xml').async('string'), 'application/xml'),
        firstSheet = workbook.getElementsByTagNameNS(ns, 'sheet')[0];

      const rid = firstSheet.getAttributeNS(relNs, 'id') || firstSheet.getAttribute('r:id'),
        relationships = new DOMParser().parseFromString(await zip.file('xl/_rels/workbook.xml.rels').async('string'), 'application/xml'),
        relation = [...relationships.getElementsByTagNameNS('*', 'Relationship')].find(node => node.getAttribute('Id') === rid);
      let target = relation?.getAttribute('Target');

        sheetFile = zip.file(target);
      if (!sheetFile) throw new Error('No se encontró la primera hoja del archivo.');
      const sheet = new DOMParser().parseFromString(await sheetFile.async('string'), 'application/xml');
      return [...sheet.getElementsByTagNameNS(ns, 'row')].map(row => {
        const cells = [];

          const index = columnIndex(cell.getAttribute('r')),
            type = cell.getAttribute('t');
          let value = xmlText(cell, 'v');
          if (type === 's') value = shared[Number(value)] || '';else if (type === 'inlineStr') value = xmlText(cell, 't');

    async function atReducir(file, max) {
      let bmp = null;
      try {
        bmp = await createImageBitmap(file);
      } catch (e) {
        bmp = await new Promise(r => {
          const im = new Image();
          im.onload = () => r(im);
          im.onerror = () => r(null);
          im.src = URL.createObjectURL(file);
        });
      }
      if (!bmp || !bmp.width) {
        if (/^image\/(jpeg|png|webp)$/.test(file.type) && file.size <= max) return file;
        throw {
          code: 'formato'
        };
      }
      const sc = Math.min(1, 2200 / Math.max(bmp.width, bmp.height)),
        cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * sc);
      cv.height = Math.round(bmp.height * sc);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      let q = 0.85,
        blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
      while (blob && blob.size > max && q > 0.4) {
        q -= 0.15;
        blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
      }
      return blob || file;
    }

    async function atPaginasPDF(file) {
      if (!window.pdfjsLib) throw new Error('No se cargó el lector de PDF.');
      const pdf = await pdfjsLib.getDocument({
          data: await file.arrayBuffer()
        }).promise,
        out = [];
      for (let n = 1; n <= pdf.numPages; n++) {
        const pg = await pdf.getPage(n),
          v0 = pg.getViewport({
            scale: 1
          }),
          sc = Math.min(3, 2200 / Math.max(v0.width, v0.height)),
          v = pg.getViewport({
            scale: sc
          }),
          cv = document.createElement('canvas');
        cv.width = Math.round(v.width);
        cv.height = Math.round(v.height);
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff';
        cx.fillRect(0, 0, cv.width, cv.height);
        await pg.render({
          canvasContext: cx,
          viewport: v
        }).promise;
        out.push({
          nombre: pdf.numPages > 1 ? "".concat(file.name, " · hoja ").concat(n) : file.name,
          blob: await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85))
        });
      }
      return out;
    }

          color: rgb(1, 1, 1)
        });
        pg.drawText(wa("SAMARA · Filtros: SIRCE ".concat(AT.sirce, " · Estado ").concat(AT.estado).concat(AT.q ? ' · "' + AT.q + '"' : '', " · Emitido ").concat(atFmt(atHoy()))), {
          x: M,
          y: H - 41,
          size: 7.5,
          font: f,
          color: rgb(0.8, 0.85, 0.9)
        });
        y = H - 70;
        let x = M;
        cols.forEach(([t, w]) => {
          pg.drawText(t.toUpperCase(), {
            x: x + 3,
            y,
            size: 7,
            font: fb,
            color: rgb(0.4, 0.47, 0.53)
          });
          x += w;
        });
        y -= 8;
        pg.drawLine({
          start: {
            x: M,
            y
          },
          end: {
            x: W - M,
            y
          },
          thickness: 0.6,
          color: rgb(0.85, 0.88, 0.9)
        });
        y -= 14;
      };
      nueva();
      l.forEach(s => {
        if (y < 40) {
          pg.drawText("Página ".concat(num), {
            x: W - M - 40,
            y: 18,
            size: 7,
            font: f
          });
          nueva();
        }
        const v = (s.asistentes || []).filter(a => a.estado === 'ok').length;
        const vals = [s.cursoCodigo, s.cursoNombre || s.listaCurso, atFmt(s.fecha), s.encabezado?.instructor, (s.asistentes || []).length, v, atSirce(s) ? 'Sí' : 'No', s.estado];
        let x = M;
        vals.forEach((t, i) => {
          pg.drawText(cut(t, cols[i][1], f, 8), {
            x: x + 3,
            y,
            size: 8,
            font: f,
            color: rgb(0.07, 0.13, 0.2)
          });
          x += cols[i][1];
        });
        y -= 6;
        pg.drawLine({
          start: {
            x: M,
            y
          },
          end: {
            x: W - M,
            y
          },
          thickness: 0.4,
          color: rgb(0.92, 0.93, 0.95)
        });
        y -= 13;
      });
      pg.drawText("Página ".concat(num), {
        x: W - M - 40,
        y: 18,
        size: 7,
        font: f
      });
      await window.descargarArchivo(new Blob([await doc.save()], {
        type: 'application/pdf'
      }), "Listados de asistencia ".concat(atHoy(), ".pdf"));
    }
    function atCSV() {
      const l = atFiltrados();
      if (!l.length) return toast('No hay listados con estos filtros.');
      atRefrescarPadron();
      const q = v => "\"".concat(String(v ?? '').replace(/"/g, '""'), "\"");
      const rows = [['Código', 'Curso', 'Fecha', 'Lugar', 'Instructor', 'SIRCE', 'Estado del listado', 'No. empleado', 'Nombre', 'Puesto', 'Departamento', 'Firmó', 'Estado del asistente']];
      l.forEach(s => (s.asistentes || []).forEach(a => {
        const p = AT_P[a.numero];
        rows.push([s.cursoCodigo, s.cursoNombre || s.listaCurso, s.fecha, s.encabezado?.lugar, s.encabezado?.instructor, atSirce(s) ? 'Sí' : 'No', s.estado, a.numero, p ? p.nombre : a.nombre || a.escrito, p ? p.puesto : a.puesto, p ? p.depto : a.departamento, a.firmo ? 'Sí' : 'No', {
          ok: 'Validado',
          wa: 'Por validar',
          no: 'Sin firma'
        }[a.estado] || (s.estado === 'Borrador' ? 'Borrador' : '')]);
      }));
      window.descargarArchivo(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n')], {
        type: 'text/csv;charset=utf-8'
      }), "Listados de asistencia ".concat(atHoy(), ".csv"));
    }
    /* importar padrón desde la hoja SIRCE */
    async function atImportar(btn) {
      if (!window.leerHojaSIRCE) return toast('La importación no está disponible aquí.');
      btn.disabled = true;
      btn.textContent = 'Importando…';
      try {
        const [bd, tr] = await Promise.all([window.leerHojaSIRCE('BD!A2:K1000'), window.leerHojaSIRCE('Trabajadores!A8:H1009')]);
        const dep = {};
        tr.forEach(r => {
          const n = String(r[0] || '').trim();
          if (n) dep[n] = {
            department: String(r[4] || '').trim(),
            position: String(r[3] || '').trim()
          };
        });
        const byNo = new Map(employees.filter(e => !e.demo).map(e => [String(e.no), e]));
        let nuevos = 0;
        bd.forEach(r => {
          const no = String(r[0] || '').trim();
          if (!/^\d{3,}$/.test(no)) return;
          const prev = byNo.get(no) || {};
          if (!byNo.has(no)) nuevos++;
          byNo.set(no, {
            ...prev,
            no,
            curp: String(r[1] || '').trim().toUpperCase() || prev.curp || '',
            names: (String(r[2] || '').trim() || prev.names || '').toUpperCase(),
            paternal: (String(r[3] || '').trim() || prev.paternal || '').toUpperCase(),
            maternal: (String(r[4] || '').trim() || prev.maternal || '').toUpperCase(),
            studies: String(r[5] || prev.studies || ''),
            proofDocType: String(r[6] || prev.proofDocType || ''),
            institutionType: String(r[7] || prev.institutionType || ''),
            position: String(r[8] || '').trim() || dep[no]?.position || prev.position || '',
            department: dep[no]?.department || prev.department || '',
            demo: false
          });
        });
        employees = [...byNo.values()];
        saveStore('samara.employees.v2', employees);
        try {
          renderPeople();
        } catch (e) {}
        renderAttendance();
        toast("Padrón actualizado: ".concat(employees.length, " colaboradores (").concat(nuevos, " nuevos)."));
      } catch (e) {
        toast('No se pudo leer la hoja: ' + (e.message || e.code || e));
      } finally {
        btn.disabled = false;
        btn.textContent = '⇣ Importar padrón SIRCE';
      }
    }
    /* eventos */
    const AT_A = {
      nueva: () => atNuevaDialog(),
      cerrar: () => $('#att-dialog').close(),
      manual: () => {
        $('#att-dialog').close();
        atAbrir({
          leida: false,
          cursoCodigo: '',
          fecha: atHoy()
        });
      },
      importar: (d, el) => atImportar(el),
      vertodos: () => {
        AT.q = '';
        AT.sirce = 'Todos';
        AT.estado = 'Todos';
        AT.desde = '';
        AT.hasta = '';
        renderAttendance();
      },
      limpiarcola: () => {
        AT.cola = [];
        renderAttendance();
      },
      imprimirtabla: () => atImprimirTabla(),
      csv: () => atCSV(),
      cancelar: () => {
        AT.ed = null;
        renderAttendance();
      },
      abrir: d => {
        const s = attendance.find(x => x.id === d.id);
        if (!s) return;
        atAbrir(atEdDe(s));
      },
      borrar: (d, el) => {
        if (!el.dataset.armed) {
          el.dataset.armed = '1';
          el.textContent = '¿Eliminar?';
          setTimeout(() => {
            if (el.isConnected) {
              delete el.dataset.armed;
              el.textContent = '🗑';
            }
          }, 3000);
          return;
        }
        attendance = attendance.filter(x => x.id !== d.id);
        saveStore('samara.attendance.v1', attendance);
        renderAttendance();
        toast('Listado eliminado.');
      },
      borrarlista: (d, el) => {
        if (!el.dataset.armed) {
          el.dataset.armed = '1';
          el.textContent = 'Toca otra vez';
          return;
        }
        attendance = attendance.filter(x => x.id !== AT.ed.id);
        saveStore('samara.attendance.v1', attendance);
        AT.ed = null;
        renderAttendance();
        toast('Listado eliminado.');
      },
      pdflista: d => atPdfLista(d.id),
      pdfdc3: d => atPdfDC3(d.id),
      guardar: () => atGuardar(),
      usarcat: d => {
        AT.ed.enc[d.k] = atCatVal(d.k, atC(AT.ed.cursoCodigo)) || '';
        atPintar();
      },
      dejar: d => {
        AT.ed.encOk[d.k] = true;
        atPintar();
      },
      quitar: d => {
        AT.ed.asistentes.splice(+d.i, 1);
        atPintar();
      },
      confirmar: d => {
        AT.ed.asistentes[+d.i].ok = true;
        atPintar();
      },
      sugerencia: d => {
        if (AT.ed.asistentes.some(a => a.numero === d.n)) return toast('Ese colaborador ya está en la lista.');
        const a = AT.ed.asistentes[+d.i];
        a.numero = d.n;
        a.ok = true;
        atPintar();
      },
      altaemp: d => atAltaPersonal(d.i),
      altains: () => {
        AT.pendIns = true;
        openInstructorEditor('', AT.ed.enc.clasificacion === 'Externo' ? 'Externo' : 'Interno');
      },
      editins: d => {
        AT.pendIns = true;
        openInstructorEditor(d.id);
      }
    };
    document.addEventListener('click', ev => {
      const o = ev.target.closest('.att-cbo');
      if (o) {
        ev.preventDefault();
        const inp = o.parentElement.previousElementSibling;
        if (o.dataset.alta === 'ins') {
          atCbCerrar();
          AT.ed.enc.instructor = inp.value.trim() || AT.ed.enc.instructor;
          AT.ed.enc.instructorId = '';
          AT_A.altains();
          return;
        }
        if (o.dataset.alta === 'emp') {
          atCbCerrar();
          const i = inp.dataset.i;
          if (i === 'new') {
            AT.ed.asistentes.push({
              numero: '',
              escrito: inp.value.trim(),
              firmo: true,
              ok: false
            });
            atPintar();
            atAltaPersonal(AT.ed.asistentes.length - 1);
          } else {
            AT.ed.asistentes[+i].escrito = inp.value.trim() || AT.ed.asistentes[+i].escrito;
            atAltaPersonal(i);
          }
          return;
        }
        atCbElegir(inp, o.dataset.v);
        return;
      }
      if (!ev.target.closest('.att-cb')) atCbCerrar();
      const el = ev.target.closest('[data-att]');
      if (!el) return;
      const f = AT_A[el.dataset.att];
      if (f) {
        ev.preventDefault();
        f(el.dataset, el);
      }
    });
    document.addEventListener('focusin', ev => {
      if (ev.target.classList?.contains('att-cbi')) {
        atCbCerrar();
        atCbAbrir(ev.target);
      }
    });
    document.addEventListener('input', ev => {
      const t = ev.target;
      if (t.classList?.contains('att-cbi')) atCbAbrir(t);else if (t.id === 'att-search') {
        AT.q = t.value;
        const pos = t.selectionStart;
        renderAttendance();
        const n = $('#att-search');
        n.focus();
        n.setSelectionRange(pos, pos);
      }
    });
    document.addEventListener('keydown', ev => {
      const t = ev.target;
      if (!t.classList?.contains('att-cbi')) return;
      const box = t.nextElementSibling;
      if (ev.key === 'Escape') return atCbCerrar();
      if (ev.key === 'ArrowDown') {
        const f = box.querySelector('.att-cbo');
        if (f) {
          ev.preventDefault();
          f.focus();
        }
      }
      if (ev.key === 'Enter') {
        ev.preventDefault();
        const f = box.querySelector('.att-cbo[data-v]');
        if (f && !box.hidden) atCbElegir(t, f.dataset.v);
      }
    });
    document.addEventListener('change', ev => {
      const t = ev.target;
      if (!t.closest('#view-attendance,#att-dialog')) return;
      if (t.id === 'att-foto' && t.files?.length) atLeerVarios([...t.files]);else if (t.id === 'att-f-sirce') {
        AT.sirce = t.value;
        renderAttendance();
      } else if (t.id === 'att-f-estado') {
        AT.estado = t.value;
        renderAttendance();
      } else if (t.id === 'att-f-desde') {
        AT.desde = t.value;
        renderAttendance();
      } else if (t.id === 'att-f-hasta') {
        AT.hasta = t.value;
        renderAttendance();
      } else if (t.id === 'att-curso') {
        AT.ed.cursoCodigo = t.value;
        AT.ed.encOk = {};
        atPintar();
      } else if (t.id === 'att-fecha') AT.ed.fecha = t.value;else if (t.dataset.h) {
        AT.ed.enc[t.dataset.h] = t.value;
        delete AT.ed.encOk[t.dataset.h];
        atPintar();
      } else if (t.dataset.firma) {
        AT.ed.asistentes[+t.dataset.firma].firmo = t.checked;
        atPintar();
      }
    });
    $('#instructor-dialog').addEventListener('close', () => {
      if (!AT.pendIns || !AT.ed) return;
      AT.pendIns = false;
      const e = AT.ed;
      if (!atI(e.enc.instructorId)) {
        const i = atBuscarIns(e.enc.instructor);
        if (i) {
          e.enc.instructorId = i.id;
          e.enc.instructor = i.nombre;
        }
      }
      const i = atI(e.enc.instructorId);
      if (i) {
        if (i.tipo) e.enc.clasificacion = i.tipo;
        if (i.rfc) e.enc.rfc = i.rfc;
        if (i.registro) e.enc.registro = i.registro;
      }
      atPintar();
    });
    renderAttendance();
    if (window.SAMARA_INITIAL_VIEW === 'attendance') showView('attendance');
    /* ==================== FIN MÓDULO LISTADOS ==================== */
  } catch (error) {
    document.getElementById('cloud-loading')?.remove();
    document.getElementById('cloud-error').hidden = false;
    document.getElementById('cloud-retry').hidden = true;
    document.getElementById('cloud-reload').hidden = false;
    document.getElementById('cloud-reload').onclick = () => location.reload();
    document.getElementById('cloud-error-message').textContent = 'No se pudo cargar la información. Vuelve a intentarlo. ' + (error.message || '');
    console.error(error);
  }
})();
</script>
