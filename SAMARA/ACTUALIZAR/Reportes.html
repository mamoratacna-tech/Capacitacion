<style>

or:#111;font:7pt/1.4 Arial;text-align:left;vertical-align:top;letter-spacing:normal}.reports-print th{background:#edf2f5!important}.reports-print thead{display:table-header-group}.reports-print tr{break-inside:avoid}.reports-print footer{margin-top:4mm;font:7pt Arial;color:#555}@media(max-width:1050px){.reports-filters{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.reports-filters{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}.reports-table thead{display:none}.reports-table,.reports-table tbody,.reports-table tr,.reports-table td{display:block;width:100%;box-sizing:border-box}.reports-table tr{padding:10px 0;border-bottom:1px solid #dce6ed}.reports-table td{border:0;display:grid;grid-template-columns:minmax(90px,35%) minmax(0,1fr);gap:10px;padding:5px 0}.reports-table td:before{content:attr(data-label);font-weight:600;color:#72899d}.reports-panel{padding:14px}}@media(max-width:400px){.reports-filters{grid-template-columns:1fr}}

<script>
window.SamaraReports=(()=>{
 'use strict';
 const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
 const TYPES={progress:'Avance de capacitación',pending:'Personal pendiente de capacitar',history:'Historial por empleado',evidence:'Control de evidencias y SIRCE',instructors:'Instructores autorizados',cmcap:'Vigencias de CMCAP'};
 const n=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const active=e=>!['inactivo','inactiva','baja','bajas','i','no','0','false'].includes(n(e.activeStatus||e.status||e._legacy?.estado||'Activo'));
 const samara=e=>n(e.company||e.empresa||e.entity||'SAMARA')==='samara';
 const key=e=>n(e.no||e.curp||e.id),name=e=>[e.names,e.paternal,e.maternal].filter(Boolean).join(' ')||e.nombre||e.name||e.no||'';
 const valid=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))&&!isNaN(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;
 const date=v=>valid(v)?v.split('-').reverse().join('/'):'Por completar';
 const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es',{numeric:true}));
 function build(context,filters,deps){
  const type=TYPES[filters.type]?filters.type:'progress',year=Number(filters.year),month=Number(filters.month)||0;
  const alias=new Map();(context.departments||[]).forEach(d=>[d.name,...(d.aliases||[])].forEach(a=>alias.set(n(a),d.name)));
  const dept=e=>alias.get(n(e.department))||e.department||'',matches=e=>(!filters.department||n(dept(e))===n(filters.department))&&(!filters.job||n(e.position)===n(filters.job));
  const people=context.employees.filter(e=>samara(e)&&matches(e)),byNo=new Map(context.employees.map(e=>[n(e.no),e])),byCurp=new Map(context.employees.filter(e=>e.curp).map(e=>[n(e.curp),e]));
  const resolve=a=>byNo.get(n(a.numero))||byCurp.get(n(a.curp)),selectedCourse=c=>!filters.course||n(c)===n(filters.course);
  const ctx={...context,employees:people},d=deps.dashboard.compute(ctx,{year,month,today:filters.today},deps.program.coverage);
  const isDated=l=>valid(l.fecha)&&Number(l.fecha.slice(0,4))===year&&l.fecha<=d.cutoff&&(!month||Number(l.fecha.slice(5,7))===month);
  const plant=l=>l.encabezado?.lugar||'',listMatches=l=>selectedCourse(l.cursoCodigo)&&(!filters.plant||plant(l)===filters.plant);
  const eligible=(a,l)=>n(l.estado)==='validada'&&a.estado==='ok'&&a.firmo===true;
  const personCells=e=>[e.no||'',name(e),e.position||'',dept(e),e.classification||''];
  const personColumns=['No. empleado','Nombre','Puesto','Departamento','Clasificación'];
  let columns=[],rows=[],summary=[],note='',totalRequired=0,totalTrained=0;
  const plans=d.plans.filter(p=>p.inPeriod&&selectedCourse(p.plan.courseCode));
  if(type==='progress'){
   columns=['Código','Curso','Meses programados','Objetivo','Capacitados','Pendientes','Avance','Estado'];
   rows=plans.map(p=>{totalRequired+=p.target.length;totalTrained+=p.trained.length;return [p.course.code,p.course.name,p.plan.months.map(m=>MONTHS[m-1]).join(', '),p.target.length,p.trained.length,p.pending.length,p.target.length?Math.round(100*p.trained.length/p.target.length)+'%':'—',!p.target.length||p.unconfigured?'Revisar población':p.complete?'Concluido':p.overdue?'Vencido':String(year)+'-'+String(Math.min(...p.plan.months)).padStart(2,'0')+'-01'>d.cutoff?'Programado':'En periodo'];});
   summary=[['Cursos',rows.length],['Requeridas',totalRequired],['Validadas',totalTrained],['Avance',totalRequired?Math.round(100*totalTrained/totalRequired)+'%':'—']];
   note='Población activa actual de SAMARA según puesto, departamento y clasificación de la matriz. El mes filtra los cursos programados; el avance acumula los meses de su periodo hasta el corte. Cada persona cuenta una vez por curso y periodo.';
  }else if(type==='pending'){
   columns=[...personColumns,'Código','Curso','Periodo','Situación'];
   rows=plans.flatMap(p=>p.pending.map(e=>[...personCells(e),p.course.code,p.course.name,p.plan.months.map(m=>MONTHS[m-1].slice(0,3)).join(', '),p.review.some(r=>key(r)===key(e))?'Asistencia por validar':p.overdue?'Curso vencido':'Por capacitar']));
   summary=[['Personas',new Set(rows.map(r=>r[0])).size],['Capacitaciones pendientes',rows.length],['Cursos',new Set(rows.map(r=>r[5])).size]];
   note='Personal activo de SAMARA con requisitos pendientes del programa y la matriz. Asistencia por validar sigue pendiente hasta validar la lista y la firma. El mes filtra los periodos programados; no vuelve a exigir un curso ya acreditado dentro de ese periodo.';
  }else if(type==='history'){
   columns=[...personColumns,'Estado empleado','Código','Curso','Fecha','Horas','Instructor / referencia','Resultado'];
   const status=e=>active(e)?'Activo':'Inactivo',allowed=e=>e&&samara(e)&&matches(e)&&(filters.employeeStatus==='Todos'||(filters.employeeStatus==='Inactivo'?!active(e):active(e)));
   for(const l of context.attendance.filter(l=>isDated(l)&&listMatches(l))){const seen=new Set();for(const a of l.asistentes||[]){const e=resolve(a);if(!allowed(e)||!eligible(a,l)||seen.has(key(e)))continue;seen.add(key(e));const c=context.courses.find(c=>n(c.code)===n(l.cursoCodigo));rows.push([...personCells(e),status(e),l.cursoCodigo,l.cursoNombre||c?.name||'',date(l.fecha),l.encabezado?.duracion||c?.duration||'',l.encabezado?.instructor||'Por completar','Capacitado']);}}
   if(!filters.plant){for(const c of context.courses.filter(c=>active(c)&&selectedCourse(c.code))){const p=d.plans.find(p=>n(p.course.code)===n(c.code));if(p&&!p.inPeriod)continue;if((c.cmcapOnly||c.safetyCommissionOnly||c.emergencyBrigadesOnly)&&!p)continue;const targets=p?p.pending:deps.program.population(ctx,c).filter(e=>!context.attendance.some(l=>valid(l.fecha)&&l.fecha<=d.cutoff&&n(l.cursoCodigo)===n(c.code)&&(l.asistentes||[]).some(a=>resolve(a)&&key(resolve(a))===key(e)&&eligible(a,l))));for(const e of targets.filter(allowed))rows.push([...personCells(e),'Activo',c.code,c.name,'—','—',p?'Programa '+year:'Matriz actual','Pendiente']);}}
   summary=[['Personas',new Set(rows.map(r=>r[0])).size],['Asistencias validadas',rows.filter(r=>r[11]==='Capacitado').length],['Requisitos pendientes',rows.filter(r=>r[11]==='Pendiente').length]];
   note='Las asistencias validadas se muestran por evento; repetir un curso conserva el historial. Los pendientes usan el periodo del programa; sin programación, la matriz se contrasta con el historial validado hasta el corte, sin exigir una repetición anual no programada. No se asignan pendientes a bajas. Con filtro de planta se muestran solo eventos, porque la plantilla no tiene una planta asignada de forma obligatoria.';
  }else if(type==='evidence'){
   columns=['Curso / código','Fecha / planta','Estado lista','Asistentes SAMARA','Validados con firma','Clave SIRCE','Datos por completar','Formatos disponibles'];
   let reviewed=0,missing=0,incomplete=0;
   for(const l of context.attendance.filter(l=>isDated(l)&&listMatches(l))){const attendees=(l.asistentes||[]).filter(a=>{const e=resolve(a);return e&&samara(e)&&matches(e);}),unknown=(l.asistentes||[]).filter(a=>!resolve(a));if(!attendees.length&&(((l.asistentes||[]).length&&!unknown.length)||filters.department||filters.job))continue;
    const result=deps.validateList?deps.validateList(l):{issues:[]},issues=(result.issues||[]).filter(i=>!String(i).includes('CLAVE CURSO')),count=new Set(attendees.filter(a=>eligible(a,l)).map(a=>key(resolve(a)))).size,clave=String(l.sirceDatos?.claveCurso||'').trim();
    if(n(l.estado)!=='validada')reviewed++;if(!clave)missing++;if(issues.length)incomplete++;
    rows.push([(l.cursoNombre||'')+' · '+(l.cursoCodigo||''),date(l.fecha)+' · '+(plant(l)||'Sin planta'),l.estado||'Borrador',new Set(attendees.map(a=>key(resolve(a)))).size,count,clave||'Pendiente',issues.length?issues.join('\n'):'Sin incidencias detectadas','Asistencia: disponible. DC3: '+count+' elegibles. Recepción DC3: '+(count?'disponible':'sin elegibles')+(unknown.length?'. '+unknown.length+' asistentes sin identificar':'')]);
   }
   summary=[['Listados',rows.length],['Por revisar',reviewed],['Sin clave',missing],['Datos por completar',incomplete]];
   note='Los formatos son disponibilidad para imprimir, no constancia de emisión, entrega o recepción firmada. La clave pendiente y los datos incompletos pueden coincidir. Los conteos de asistentes respetan departamento y puesto; las incidencias corresponden a la lista completa. Las listas con asistentes aún sin identificar se conservan para revisión.';
  }else if(type==='instructors'){
   columns=['Instructor','Tipo','No. empleado / RFC','Departamento','Código','Curso autorizado','Certificación','Carta aprobatoria'];
   rows=(context.instructorAuthorizations||[]).filter(r=>selectedCourse(r.code)&&(!filters.department||n(alias.get(n(r.department))||r.department)===n(filters.department))&&(!valid(r.certificationDate)||(Number(r.certificationDate.slice(0,4))===year&&r.certificationDate<=d.cutoff&&(!month||Number(r.certificationDate.slice(5,7))===month)))).map(r=>[r.name,r.type,r.reference||'',alias.get(n(r.department))||r.department||'',r.code,r.course,date(r.certificationDate),valid(r.certificationDate)?'Disponible por fecha de certificación':'Completar fecha']);
   summary=[['Instructores',new Set(rows.map(r=>r[0]+'|'+r[2])).size],['Autorizaciones',rows.length],['Fechas por completar',rows.filter(r=>r[6]==='Por completar').length]];
   note='Autorizaciones actuales con certificación en el año/mes elegido, más las fechas pendientes de completar. La disponibilidad de la carta requiere revisar los firmantes CMCAP vigentes a esa fecha en Instructores. Los instructores externos se incluyen cuando están autorizados en el catálogo.';
  }else{
   columns=['Integrante','Cargo','Inicio','Vencimiento','Días restantes','Estado'];
   rows=(context.cmcap||[]).map(m=>{const ok=valid(m.startDate)&&valid(m.endDate)&&m.endDate>=m.startDate,days=ok?Math.round((Date.parse(m.endDate+'T12:00:00Z')-Date.parse(d.cutoff+'T12:00:00Z'))/86400000):null;return [m.name||'Sin nombre',m.role||'Por completar',date(m.startDate),date(m.endDate),days??'—',!ok?'Revisar fechas':m.startDate>d.cutoff?'Próximo':days<0?'Vencido':days<=30?'Por vencer':'Vigente'];});
   summary=[['Vigentes',rows.filter(r=>['Vigente','Por vencer'].includes(r[5])).length],['Por vencer en 30 días',rows.filter(r=>r[5]==='Por vencer').length],['Vencidos',rows.filter(r=>r[5]==='Vencido').length]];
   note='Vigencias evaluadas a la fecha de corte; incluye nombramientos anteriores y próximos. Representante legal: '+((context.legal||[]).map(m=>m.name).filter(Boolean).join(', ')||'por registrar')+'. El registro del representante legal no implica una fecha de vencimiento.';
  }
  const q=n(filters.search);if(q){rows=rows.filter(r=>n(r.join(' ')).includes(q));
   if(type==='progress'){const required=rows.reduce((s,r)=>s+r[3],0),trained=rows.reduce((s,r)=>s+r[4],0);summary=[['Cursos',rows.length],['Requeridas',required],['Validadas',trained],['Avance',required?Math.round(100*trained/required)+'%':'—']];}
   if(type==='pending')summary=[['Personas',new Set(rows.map(r=>r[0])).size],['Capacitaciones pendientes',rows.length],['Cursos',new Set(rows.map(r=>r[5])).size]];
   if(type==='history')summary=[['Personas',new Set(rows.map(r=>r[0])).size],['Asistencias validadas',rows.filter(r=>r[11]==='Capacitado').length],['Requisitos pendientes',rows.filter(r=>r[11]==='Pendiente').length]];
   if(type==='evidence')summary=[['Listados',rows.length],['Por revisar',rows.filter(r=>n(r[2])!=='validada').length],['Sin clave',rows.filter(r=>r[5]==='Pendiente').length],['Datos por completar',rows.filter(r=>r[6]!=='Sin incidencias detectadas').length]];
   if(type==='instructors')summary=[['Instructores',new Set(rows.map(r=>r[0]+'|'+r[2])).size],['Autorizaciones',rows.length],['Fechas por completar',rows.filter(r=>r[6]==='Por completar').length]];
   if(type==='cmcap')summary=[['Vigentes',rows.filter(r=>['Vigente','Por vencer'].includes(r[5])).length],['Por vencer en 30 días',rows.filter(r=>r[5]==='Por vencer').length],['Vencidos',rows.filter(r=>r[5]==='Vencido').length]];
  }
  return {type,title:TYPES[type],columns,rows,summary,note,cutoff:d.cutoff,year,month,filters:{...filters}};
 }
 function csv(report){const cell=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};return '\ufeff'+[report.columns,...report.rows].map(r=>r.map(cell).join(',')).join('\r\n');}
 const WIDTHS={progress:[12,23,18,9,9,9,8,12],pending:[6,18,15,13,6,11,17,6,8],history:[5,14,12,11,5,6,10,14,7,4,7,5],evidence:[22,12,9,7,7,11,20,12],instructors:[18,7,11,13,12,20,9,10],cmcap:[22,27,13,13,10,15]};
 function table(report,rows=report.rows){return '<table class="'+(report.print?'':'reports-table')+'"><colgroup>'+report.columns.map((_,i)=>'<col style="width:'+((WIDTHS[report.type]||[])[i]||100/report.columns.length)+'%">').join('')+'</colgroup><thead><tr>'+report.columns.map(c=>'<th scope="col">'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((v,i)=>'<td data-label="'+esc(report.columns[i])+'">'+esc(v).replace(/\n/g,'<br>')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
 function filterText(r){const f=r.filters;return 'Año: '+r.year+' · Mes: '+(r.month?MONTHS[r.month-1]:'Todos')+(f.department?' · Departamento: '+f.department:'')+(f.job?' · Puesto: '+f.job:'')+(f.course?' · Curso: '+f.course:'')+(f.plant?' · Planta: '+f.plant:'')+(f.employeeStatus&&r.type==='history'?' · Personal: '+f.employeeStatus:'')+(f.search?' · Búsqueda: '+f.search:'')+'\nCorte: '+date(r.cutoff)+' · Generado: '+date(window.SamaraDashboard.today());}
 function printHtml(report){return '<article class="reports-print"><header><b>SAMARA · CONTROL DE CAPACITACIÓN</b><h1>'+esc(report.title)+'</h1><p>'+esc(filterText(report))+'</p><p>'+report.summary.map(([label,count])=>esc(label)+': '+esc(count)).join(' · ')+' · Filas filtradas: '+report.rows.length+'</p></header>'+table({...report,print:true})+'<footer>'+esc(report.note)+'</footer></article>';}
 let api,current,page=0;const $=id=>document.getElementById(id),SIZE=25;
 function selection(){return Object.fromEntries(['type','year','month','plant','department','job','course','search','employeeStatus'].map(k=>[k,$('reports-'+k).value]));}
 function options(id,values,label){const el=$(id),saved=el.value;el.innerHTML='<option value="">'+label+'</option>'+values.map(([value,text])=>'<option value="'+esc(value)+'">'+esc(text)+'</option>').join('');if([...el.options].some(o=>o.value===saved))el.value=saved;}
 function render(reset=false){if(!api||!api.can()||!$('view-reports').classList.contains('active'))return;if(reset)page=0;const ctx=api.context(),type=$('reports-type').value;
  const fields={plant:['history','evidence'],department:['progress','pending','history','evidence','instructors'],job:['progress','pending','history','evidence'],course:['progress','pending','history','evidence','instructors'],employeeStatus:['history']};Object.entries(fields).forEach(([field,types])=>{$('reports-'+field).closest('label').hidden=!types.includes(type);if(!types.includes(type))$('reports-'+field).value=field==='employeeStatus'?'Activo':'';});
  const selectedYear=$('reports-year').value,years=unique([Number(window.SamaraDashboard.today().slice(0,4)),...(ctx.plans||[]).map(p=>p.year),...ctx.attendance.map(l=>Number(String(l.fecha).slice(0,4))),...(ctx.instructorAuthorizations||[]).map(r=>Number(String(r.certificationDate).slice(0,4))),...(ctx.cmcap||[]).flatMap(m=>[Number(String(m.startDate).slice(0,4)),Number(String(m.endDate).slice(0,4))])]).filter(y=>y>=2000&&y<=2100).sort((a,b)=>b-a);$('reports-year').innerHTML=years.map(y=>'<option>'+y+'</option>').join('');$('reports-year').value=years.map(String).includes(selectedYear)?selectedYear:window.SamaraDashboard.today().slice(0,4);
  const departmentNames=new Map();(ctx.departments||[]).forEach(d=>[d.name,...(d.aliases||[])].forEach(a=>departmentNames.set(n(a),d.name)));
  const dep=e=>departmentNames.get(n(e.department))||e.department;
  const samaraPeople=ctx.employees.filter(samara);options('reports-department',unique(samaraPeople.map(dep).concat((ctx.instructorAuthorizations||[]).map(dep))).map(v=>[v,v]),'Todos los departamentos');options('reports-job',unique(samaraPeople.filter(e=>!$('reports-department').value||dep(e)===$('reports-department').value).map(e=>e.position)).map(v=>[v,v]),'Todos los puestos');options('reports-course',ctx.courses.slice().sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true})).map(c=>[c.code,c.code+' · '+c.name]),'Todos los cursos');
  current=build(ctx,selection(),{dashboard:window.SamaraDashboard,program:window.SamaraProgram,validateList:api.validateList});page=Math.max(0,Math.min(page,Math.ceil(current.rows.length/SIZE)-1));
  $('reports-title').textContent=current.title;$('reports-summary').innerHTML=current.summary.map(([label,value])=>'<span><b>'+esc(value)+'</b>'+esc(label)+'</span>').join('');$('reports-caption').textContent=filterText(current);$('reports-note').textContent=current.note;
  $('reports-results').innerHTML=current.rows.length?table(current,current.rows.slice(page*SIZE,(page+1)*SIZE)):'<p class="empty-state">No hay registros con estos filtros.</p>';
  $('reports-page').textContent=current.rows.length?'Filas '+(page*SIZE+1)+'–'+Math.min((page+1)*SIZE,current.rows.length)+' de '+current.rows.length+' · Página '+(page+1)+' de '+Math.ceil(current.rows.length/SIZE):'0 registros';$('reports-prev').disabled=page===0;$('reports-next').disabled=(page+1)*SIZE>=current.rows.length;$('reports-csv').disabled=$('reports-print').disabled=!current.rows.length;
 }
 function init(settings){api=settings;$('reports-type').innerHTML=Object.entries(TYPES).map(([key,label])=>'<option value="'+key+'">'+label+'</option>').join('');$('reports-month').innerHTML='<option value="">Todos los meses</option>'+MONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join('');
  $('reports-filters').addEventListener('change',()=>render(true));$('reports-search').addEventListener('input',()=>render(true));$('reports-prev').onclick=()=>{page--;render();};$('reports-next').onclick=()=>{page++;render();};
  $('reports-reset').onclick=()=>{$('reports-filters').reset();$('reports-year').value=window.SamaraDashboard.today().slice(0,4);render(true);};
  $('reports-csv').onclick=()=>{if(!api.can())return;render();if(!current.rows.length)return;const url=URL.createObjectURL(new Blob([csv(current)],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='SAMARA-'+n(current.title).replace(/[^a-z0-9]+/g,'-')+'-'+current.year+'.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  $('reports-print').onclick=()=>{if(!api.can())return;render();if(current.rows.length)api.print(printHtml(current));};
 }
 return {init,render,build,csv,printHtml};
})();
</script>
