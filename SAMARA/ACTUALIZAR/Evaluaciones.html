l;border:1px solid #777;padding:7px 4px;overflow-wrap:anywhere}.ev-print tr{break-inside:avoid}.ev-print .ev-sign{height:35px}.ev-print small{font-size:8pt}@media(max-width:800px){.ev-grid{grid-template-columns:1fr}.ev-wide{grid-column:1}.ev-table,.ev-table tbody{display:block}.ev-table thead{display:none}.ev-table tr{display:grid;grid-template-columns:1fr 1fr;padding:12px;border-bottom:1px solid #ddd}.ev-table td{display:block;border:0;padding:7px;width:auto!important}.ev-table td:first-child,.ev-table td:last-child{grid-column:1/-1}.ev-table td:before{content:attr(data-label);display:block;color:#8495a5;font-size:9px;margin-bottom:4px}}

<script>
window.SamaraEvaluations=(()=>{
'use strict';
const TYPES={mid:'Mitad de periodo',renewal:'Renovación',annual:'Anual'},FIRST_ANNUAL=2027;
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Tijuana'}).format(new Date());
const date=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')&&!isNaN(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;
const add=(v,n)=>{const d=new Date(v+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const name=e=>[e.paternal,e.maternal,e.names].filter(Boolean).join(' '),identity=e=>e.curp||((e.company||'SAMARA')+':'+e.no);
function inputDate(v){if(date(v))return v;const raw=String(v||'').trim();if(/^\d{5}(?:\.\d+)?$/.test(raw))return new Date(Date.UTC(1899,11,30)+Math.floor(Number(raw))*86400000).toISOString().slice(0,10);const m=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);const out=m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):'';return date(out)?out:'';}
function contractPatch(e){
 const out={...e},raw=String(e.contractType||'').trim();
 if(raw){const n=norm(raw);out.contractType=/indefin|indetermin/.test(n)?'Indefinido':n.includes('obra')?'Obra determinada':/temporal|dias|determinado/.test(n)||/^\d+$/.test(n)?'Temporal':'Especial';const days=raw.match(/\d+/);if(days&&e.contractDays&&Number(e.contractDays)!==Number(days[0]))throw Error('El tipo de contrato y los días capturados no coinciden.');if(!e.contractDays&&days)out.contractDays=days[0];}
 for(const field of ['contractStart','contractEnd','hireDate'])if(e[field]){const d=inputDate(e[field]);if(!d)throw Error('Revisa '+({contractStart:'inicio de contrato',contractEnd:'vencimiento',hireDate:'fecha de ingreso'}[field])+'.');out[field]=d;}
 if(out.contractType==='Indefinido'){out.contractDays='';out.contractEnd='';}
 else if(out.contractDays){const days=Number(out.contractDays);if(!Number.isInteger(days)||days<1||days>3650)throw Error('Los días de contrato deben estar entre 1 y 3650.');out.contractDays=String(days);if(date(out.contractStart))out.contractEnd=add(out.contractStart,days-1);}
 if(out.contractEnd&&out.contractStart&&out.contractEnd<out.contractStart)throw Error('El vencimiento no puede ser anterior al inicio.');return out;
}
function contractLabel(e){const raw=String(e.contractType||'').trim();if(!raw)return '';if(/indefin|indetermin/.test(norm(raw)))return 'Indefinido';if(norm(raw).includes('obra'))return 'Obra determinada';const days=e.contractDays||raw.match(/\d+/)?.[0];return days?days+' días':raw;}
function importContract(previous,incoming){const out={...previous,...incoming};if((Object.hasOwn(incoming,'contractType')||incoming.contractEnd)&&!incoming.contractDays)out.contractDays='';const normalized=contractPatch(out);if(incoming.contractEnd&&normalized.contractType!=='Indefinido'&&inputDate(incoming.contractEnd)!==normalized.contractEnd)throw Error('La fecha final del contrato no coincide con el inicio y los días capturados.');return normalized;}
function contract(e){let x;try{x=contractPatch(e);}catch(error){return {error:error.message};}if(x.contractType==='Indefinido')return {type:x.contractType,start:x.contractStart||'',end:'',cycle:'indefinido'};if(!x.contractType||!date(x.contractStart)||!date(x.contractEnd))return {error:'Completa tipo, inicio y días o vencimiento del contrato en Personal.'};const days=Math.round((Date.parse(x.contractEnd+'T12:00:00Z')-Date.parse(x.contractStart+'T12:00:00Z'))/86400000)+1;return {type:x.contractType,days,start:x.contractStart,end:x.contractEnd,mid:add(x.contractStart,Math.floor(days/2)),cycle:x.contractStart+':'+x.contractEnd};}
function classification(e,ctx){if(['D','I'].includes(String(e.classification||'').toUpperCase()))return e.classification.toUpperCase();const rows=[...(ctx.matrixPositions||[]),...(ctx.positions||[])].filter(p=>norm(p.job)===norm(e.position)&&norm(p.department)===norm(e.department));const classes=[...new Set(rows.map(r=>String(r.classification||'').toUpperCase()).filter(v=>['D','I'].includes(v)))];return classes.length===1?classes[0]:'';}
function format(r){return r.classification==='D'?'RHF0005F':r.kind==='mid'?'Evaluación de mitad de período':'Performance Review';}
function status(r,now=today()){if(r.exempt)return 'No aplica';if(r.completedDate)return 'Realizada';if(r.historical)return 'Histórico';if(r.scheduledDate<now)return 'Vencida';if(r.deliveredDate)return 'Entregada';return 'Pendiente';}
function dossier(r){if(!r.completedDate)return '';const missing=[];if(!r.evaluationReturned)missing.push('evaluación firmada');if(r.classification==='D'){if(!r.examReceived)missing.push('examen del área');if(!r.rioSigned||!r.rioLevel)missing.push('RIO firmado y nivel');}if(r.kind==='renewal'&&(!r.decision||!r.supervisorSigned))missing.push('autorización del departamento');return missing.length?'Falta '+missing.join(', '):'Expediente completo';}
function build(ctx,records,year,now=today()){
 const rows=[],issues=[],active=(ctx.employees||[]).filter(e=>norm(e.company||e.empresa||'SAMARA')==='samara'&&!['inactivo','baja'].includes(norm(e.activeStatus||'Activo'))),used=new Set(),ids=new Set();
 for(const e of active){const eid=identity(e);if(ids.has(eid)){issues.push({employee:e,message:'Identificador de empleado duplicado; revisa Personal.'});continue;}ids.add(eid);const cl=classification(e,ctx),c=contract(e);if(!cl){issues.push({employee:e,message:'Completa clasificación Directo (D) o Indirecto (I).'});continue;}if(c.error)issues.push({employee:e,message:c.error});
  const base={employeeId:eid,no:String(e.no),employeeName:name(e),position:e.position,department:e.department,plant:e.plant||e.planta||'',classification:cl,supervisor:e.supervisor||'',rioLevel:e.rioLevel||'',contractStart:c.start||'',contractEnd:c.end||'',contractType:c.type||'',contractDays:c.days||'',cycle:c.cycle||''};
  const emit=(kind,due,cycle)=>{const id='ev|'+eid+'|'+kind+'|'+cycle,saved=records.find(r=>r.id===id),row={...base,id,kind,scheduledDate:due,calculatedDate:due,periodStart:kind==='annual'?'':c.start||'',periodEnd:kind==='annual'?'':kind==='mid'?due:c.end||'',...saved};if(!row.completedDate)for(const key of ['department','position','plant','classification','employeeName','no','contractType','contractDays','contractStart','contractEnd'])row[key]=base[key];if(String(row.scheduledDate||'').slice(0,4)!==String(year))return;used.add(id);rows.push(row);};
  if(!c.error&&c.type!=='Indefinido'){emit('mid',c.mid,c.cycle);emit('renewal',c.end,c.cycle);}
  if(year>=FIRST_ANNUAL&&(!date(e.hireDate)||e.hireDate<=year+'-04-30')){
   emit('annual',year+'-04-30',String(year));const annual=rows.find(r=>r.employeeId===eid&&r.kind==='annual');if(annual&&!annual.completedDate&&records.some(r=>r.employeeId===eid&&['mid','renewal'].includes(r.kind)&&date(r.completedDate)&&r.completedDate.slice(0,4)===String(year))){annual.exempt=true;annual.reason='Mitad de periodo o renovación realizada en '+year+'. Próxima anual: abril '+(year+1)+'.';}
  }
 }
 for(const r of records)if(!used.has(r.id)&&String(r.scheduledDate||'').slice(0,4)===String(year))rows.push({...r,historical:!active.some(e=>identity(e)===r.employeeId)||!rows.some(x=>x.employeeId===r.employeeId&&x.cycle===r.cycle)});
 return {rows:rows.sort((a,b)=>String(a.scheduledDate).localeCompare(String(b.scheduledDate))||a.employeeName.localeCompare(b.employeeName,'es')),issues};
}
function validate(r,now=today()){
 if(!date(r.scheduledDate))throw Error('Captura una fecha programada válida.');for(const field of ['deliveredDate','completedDate'])if(r[field]&&(!date(r[field])||r[field]>now))throw Error('Revisa la fecha real de entrega o realización; no puede ser futura.');
 if(r.deliveredDate&&r.completedDate&&r.completedDate<r.deliveredDate)throw Error('La realización no puede ser anterior a la entrega.');
 if(r.evidenceUrl&&!/^https:\/\//i.test(r.evidenceUrl))throw Error('La evidencia debe ser un enlace HTTPS.');
 if(r.rioSigned&&!String(r.rioLevel||'').trim())throw Error('Indica el nivel del RIO firmado.');return r;
}
let api=null,current=null;const state={year:0,search:'',kind:'mid',status:'Por atender',department:'',classification:'',plant:'',from:'',to:''};
const $=id=>document.getElementById(id),canEdit=()=>!window.SamaraAccess?.can||window.SamaraAccess.can('evaluations','edit');
function years(ctx,records){const values=[Number(today().slice(0,4)),Number(today().slice(0,4))+1,FIRST_ANNUAL,...records.map(r=>Number(String(r.scheduledDate||'').slice(0,4)))];for(const e of ctx.employees){const c=contract(e);for(const d of [c.mid,c.end])if(date(d))values.push(Number(d.slice(0,4)));}return [...new Set(values.filter(y=>y>=2000&&y<2200))].sort((a,b)=>b-a);}
function allRows(){const ctx=api.context(),records=api.load(),annualYear=Math.max(FIRST_ANNUAL,Number(today().slice(0,4))),selected=state.year?[state.year]:years(ctx,records),rows=new Map(),issues=new Map();for(const year of selected){const result=build(ctx,records,year);for(const r of result.rows)if(state.year||r.kind!=='annual'||Number(r.scheduledDate.slice(0,4))===annualYear||records.some(saved=>saved.id===r.id))rows.set(r.id,r);for(const issue of result.issues)issues.set(identity(issue.employee)+issue.message,issue);}return {rows:[...rows.values()],issues:[...issues.values()]};}
function selection(){const data=allRows();return {...data,rows:data.rows.filter(r=>r.kind===state.kind&&(!state.search||norm([r.no,r.employeeName,r.position].join(' ')).includes(norm(state.search)))&&(!state.status||(state.status==='Por atender'?['Pendiente','Entregada','Vencida'].includes(status(r)):status(r)===state.status))&&(!state.department||r.department===state.department)&&(!state.classification||r.classification===state.classification)&&(!state.plant||norm(r.plant)===norm(state.plant))&&(!state.from||r.scheduledDate>=state.from)&&(!state.to||r.scheduledDate<=state.to))};}
const option=(value,label,chosen)=>'<option value="'+esc(value)+'" '+(value===chosen?'selected':'')+'>'+esc(label)+'</option>';
function rowHTML(r){return '<tr>'+['<b>'+esc(r.no+' · '+r.employeeName)+'</b><small>'+esc(r.position)+'</small><small>'+esc(r.classification+' · '+r.plant)+'</small>',esc(TYPES[r.kind])+'<small>'+esc(format(r))+'</small>',esc(r.scheduledDate),esc(status(r))+'<small>'+esc(r.reason||(r.completedDate?'Realizada: '+r.completedDate:r.deliveredDate?'Entregada al departamento: '+r.deliveredDate:''))+'</small>',esc(dossier(r)||'Por recibir'),'<button class="button outline" data-ev-open="'+esc(r.id)+'">'+(canEdit()?'Seguimiento':'Ver')+'</button> <button class="button outline" data-ev-template="'+esc(r.id)+'" '+(r.exempt?'disabled':'')+'>Formato</button>'].map((html,i)=>'<td data-label="'+['Empleado','Tipo','Fecha','Seguimiento','Documentos','Acciones'][i]+'">'+html+'</td>').join('')+'</tr>';}
function grouped(rows){const groups=new Map();for(const r of rows){const d=r.department||'Sin departamento';if(!groups.has(d))groups.set(d,[]);groups.get(d).push(r);}return [...groups].sort(([a],[b])=>a.localeCompare(b,'es')).map(([department,list])=>'<details class="ev-department" open><summary><b>'+esc(department)+'</b><span>'+list.length+' evaluaciones</span></summary><table class="ev-table"><thead><tr>'+['Empleado / puesto','Evaluación','Programada','Seguimiento','Documentos','Acciones'].map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+list.sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate)||a.employeeName.localeCompare(b.employeeName,'es')).map(rowHTML).join('')+'</tbody></table></details>').join('')||'<div class="ev-card">No hay evaluaciones con estos filtros.</div>';}
function render(){if(!api||!$('view-evaluations')?.classList.contains('active'))return;const ctx=api.context(),data=selection(),rows=data.rows,available=years(ctx,api.load()),departments=[...new Set(ctx.employees.map(e=>e.department).filter(Boolean))].sort(),all=allRows().rows;
 syncNavigation();
 const tabs=Object.entries({...TYPES,promotion:'Promociones'}).map(([k,v])=>'<button type="button" class="ev-tab '+(state.kind===k?'active':'')+'" data-ev-tab="'+k+'" aria-pressed="'+(state.kind===k)+'">'+v+(k!=='promotion'?'<span>'+all.filter(r=>r.kind===k&&['Pendiente','Entregada','Vencida'].includes(status(r))).length+'</span>':'')+'</button>').join('');
 $('evaluations-root').innerHTML='<div class="page-heading"><div><div class="eyebrow">CONTROL POR DEPARTAMENTOS</div><h1>Evaluaciones</h1><p>Los contratos se actualizan en Personal; los pendientes se calculan aquí.</p></div><div class="ev-actions">'+(window.SamaraAccess?.can&&!window.SamaraAccess.can('people','edit')?'':'<button type="button" class="button outline" data-ev-action="personal">Actualizar datos en Personal</button>')+'</div></div><div class="ev-tabs" role="group" aria-label="Apartados de evaluaciones">'+tabs+'</div>'+(state.kind==='promotion'?'<article class="ev-card"><h2>Promociones</h2><p>Este apartado queda reservado hasta que definas cómo lo trabajaremos.</p></article>':'<div class="ev-actions">'+(canEdit()?'<button class="button primary" data-ev-action="history">Registrar evaluación anterior</button>':'')+'<button class="button outline" data-ev-action="csv">Exportar control CSV</button><button class="button outline" data-ev-action="department">Imprimir entrega por departamento</button></div><p class="ev-note">Se muestran Por atender de forma predeterminada: pendientes, entregadas y vencidas. Cambia Estado para ver realizadas o No aplica. La anual corresponde a abril; una mitad de periodo o renovación realizada ese año la excluye hasta abril del siguiente. No se requiere un supervisor registrado.</p><div class="ev-filters"><label>Año<select data-ev-filter="year">'+option('0','Todos los años',String(state.year))+available.map(y=>option(String(y),String(y),String(state.year))).join('')+'</select></label><label>Buscar<input data-ev-filter="search" value="'+esc(state.search)+'" placeholder="Nombre, número o puesto"></label><label>Estado<select data-ev-filter="status">'+option('Por atender','Por atender',state.status)+option('','Todos',state.status)+['Pendiente','Entregada','Vencida','Realizada','No aplica','Histórico'].map(v=>option(v,v,state.status)).join('')+'</select></label><label>Departamento<select data-ev-filter="department">'+option('','Todos',state.department)+departments.map(v=>option(v,v,state.department)).join('')+'</select></label><label>Clasificación<select data-ev-filter="classification">'+option('','Todos',state.classification)+option('D','D · Directo',state.classification)+option('I','I · Indirecto',state.classification)+'</select></label><label>Planta<select data-ev-filter="plant">'+option('','Todas',state.plant)+option('Planta 1','Planta 1',state.plant)+option('Planta 2','Planta 2',state.plant)+'</select></label><label>Desde<input type="date" data-ev-filter="from" value="'+esc(state.from)+'"></label><label>Hasta<input type="date" data-ev-filter="to" value="'+esc(state.to)+'"></label><button class="button outline" data-ev-action="reset">Ver pendientes</button></div><div class="ev-stats">'+[['Por atender',rows.filter(r=>['Pendiente','Entregada','Vencida'].includes(status(r))).length],['Vencidas',rows.filter(r=>status(r)==='Vencida').length],['Realizadas',rows.filter(r=>r.completedDate).length],['No aplican',rows.filter(r=>r.exempt).length]].map(([label,total])=>'<span><b>'+total+'</b>'+label+'</span>').join('')+'</div>'+(data.issues.length?'<details class="ev-warning"><summary>'+data.issues.length+' datos pendientes en Personal</summary>'+data.issues.map(i=>'<p>'+esc(i.employee.no+' · '+name(i.employee)+': '+i.message)+'</p>').join('')+'</details>':'')+grouped(rows));window.SamaraAccess?.apply($('view-evaluations'));
}
const field=(key,label,value='',type='text',extra='')=>'<label>'+label+'<input name="'+key+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></label>',check=(key,label,value)=>'<label class="ev-check"><input name="'+key+'" type="checkbox" '+(value?'checked':'')+'>'+label+'</label>';
function find(id){return selection().rows.find(r=>r.id===id);}
function open(id){const r=find(id);if(!r)return;current=r;const dialog=$('evaluation-dialog'),editable=canEdit()&&!r.exempt;
 dialog.innerHTML='<form id="evaluation-form"><div class="dialog-head"><div><div class="eyebrow">'+esc(TYPES[r.kind]+' · '+format(r))+'</div><h2>'+esc(r.no+' · '+r.employeeName)+'</h2></div><button type="button" class="close-dialog" data-ev-close aria-label="Cerrar">×</button></div><p class="ev-note">'+esc(r.position+' · '+r.department+' · '+r.plant)+'</p>'+(r.reason?'<p class="ev-warning">'+esc(r.reason)+'</p>':'')+'<fieldset '+(!editable?'disabled':'')+'><div class="ev-grid">'+field('scheduledDate','Fecha programada (ajustable)',r.scheduledDate,'date','required')+field('periodStart','Periodo a evaluar: desde',r.periodStart,'date')+field('periodEnd','Hasta',r.periodEnd,'date')+field('deliveredDate','Entrega al departamento',r.deliveredDate,'date')+field('completedDate','Fecha real de evaluación realizada',r.completedDate,'date')+check('evaluationReturned','Evaluación firmada recibida',r.evaluationReturned)+(r.classification==='D'?check('examReceived','Examen del área recibido (sin resultados)',r.examReceived)+field('rioLevel','Nivel del RIO',r.rioLevel)+check('rioSigned','RIO firmado recibido',r.rioSigned):'')+(r.kind==='renewal'?'<label>Decisión de renovación<select name="decision">'+[['','Pendiente'],['Sí','Se renueva'],['No','No se renueva']].map(([k,v])=>option(k,v,r.decision||'')).join('')+'</select></label>'+check('supervisorSigned','Lista de autorización firmada recibida',r.supervisorSigned):'')+field('evidenceUrl','Enlace HTTPS al expediente (opcional)',r.evidenceUrl,'url')+'<label class="ev-wide">Observaciones<textarea name="notes" rows="3">'+esc(r.notes||'')+'</textarea></label></div></fieldset><p class="ev-note">La fecha real se captura solo cuando ya se realizó la evaluación. Las firmas y documentos se confirman manualmente. La decisión no cambia automáticamente el contrato ni da de baja al empleado.</p><p id="evaluation-error" class="ev-error" role="alert"></p><div class="dialog-actions"><button class="button outline" type="button" data-ev-close>Cancelar</button>'+(editable?'<button type="submit" class="button primary">Guardar seguimiento</button>':'')+(editable&&api.load().some(x=>x.id===id)?'<button type="button" class="button outline" data-delete-evaluation="'+esc(id)+'" aria-label="Eliminar seguimiento">×</button>':'')+'</div></form>';
 dialog.querySelectorAll('[data-ev-close]').forEach(b=>b.onclick=()=>dialog.close());dialog.querySelector('[data-delete-evaluation]')?.addEventListener('click',async()=>{if(!canEdit())return;if(await api.confirm('¿Eliminar el seguimiento? La obligación calculada desde Personal volverá a aparecer como pendiente.')){try{await api.save(api.load().filter(x=>x.id!==id));dialog.close();render();}catch(e){$('evaluation-error').textContent=e.message;}}});
 dialog.querySelector('form').onsubmit=async event=>{event.preventDefault();if(!canEdit())return;const button=event.submitter;if(button.disabled)return;button.disabled=true;
 try{const form=new FormData(event.target),row={...current};for(const key of ['scheduledDate','periodStart','periodEnd','deliveredDate','completedDate','rioLevel','decision','notes','evidenceUrl'])if(form.has(key))row[key]=String(form.get(key)).trim();for(const key of ['evaluationReturned','examReceived','rioSigned','supervisorSigned'])row[key]=form.has(key);validate(row);if((row.periodStart||row.periodEnd)&&(!date(row.periodStart)||!date(row.periodEnd)||row.periodEnd<row.periodStart))throw Error('Revisa el periodo a evaluar.');row.updated=new Date().toISOString();delete row.exempt;delete row.reason;delete row.historical;await api.save([row,...api.load().filter(x=>x.id!==row.id)]);dialog.close();render();api.toast('Seguimiento guardado.');}catch(e){$('evaluation-error').textContent=e.message;}finally{button.disabled=false;}};
 dialog.showModal();window.SamaraAccess?.apply(dialog);
}
function history(){
 if(!canEdit())return;const people=api.context().employees.filter(e=>norm(e.company||'SAMARA')==='samara'),dialog=$('evaluation-dialog');
 dialog.innerHTML='<form id="evaluation-form"><div class="dialog-head"><h2>Registrar evaluación anterior</h2><button type="button" class="close-dialog" data-ev-close aria-label="Cerrar">×</button></div><p class="ev-note">Registra una evaluación que realmente se realizó. No uses la fecha programada como fecha real si no la conoces. Se conservará aunque el contrato actual sea diferente.</p><div class="ev-grid"><label class="ev-wide">Buscar empleado<input id="evaluation-history-search" placeholder="Nombre o número"></label><label class="ev-wide">Empleado<select name="employee" required><option value="">Selecciona</option>'+people.map(e=>option(identity(e),e.no+' · '+name(e),'')).join('')+'</select></label><label>Tipo<select name="kind">'+Object.entries(TYPES).map(([k,v])=>option(k,v,'mid')).join('')+'</select></label>'+field('completedDate','Fecha real de realización','','date','required')+'</div><p id="evaluation-error" class="ev-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button outline" data-ev-close>Cancelar</button><button type="submit" class="button primary">Registrar y revisar documentos</button></div></form>';
 dialog.querySelectorAll('[data-ev-close]').forEach(b=>b.onclick=()=>dialog.close());dialog.querySelector('#evaluation-history-search').oninput=event=>{const query=norm(event.target.value),selected=dialog.querySelector('[name="employee"]');selected.innerHTML=option('','Selecciona','')+people.filter(e=>norm(e.no+' '+name(e)).includes(query)).map(e=>option(identity(e),e.no+' · '+name(e),'')).join('');};
 dialog.querySelector('form').onsubmit=async event=>{event.preventDefault();if(!canEdit())return;const button=event.submitter;button.disabled=true;

 const row={id,employeeId:identity(e),no:String(e.no),employeeName:name(e),position:e.position,department:e.department,plant:e.plant||'',classification:cl,supervisor:e.supervisor||'',rioLevel:e.rioLevel||'',kind,scheduledDate:done,completedDate:done,cycle:'historico-'+done,notes:'Evaluación anterior registrada manualmente.',updated:new Date().toISOString()};validate(row);await api.save([row,...api.load()]);state.year=Number(done.slice(0,4));state.kind=kind;state.status='';state.search='';state.department='';state.classification='';state.plant='';state.from='';state.to='';render();dialog.close();open(id);
 }catch(error){$('evaluation-error').textContent=error.message;}finally{button.disabled=false;}};
 dialog.showModal();
}
function csv(rows){return '\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');}
function controlRows(rows){return [['No.','Empleado','Puesto','Departamento','Clasificación','Planta','Contrato','Días','Inicio de contrato','Vencimiento','Tipo','Programada','Estado de evaluación','Entrega','Realizada','Formato','Documentación','Renovación','Nivel RIO','Evidencia'],...rows.map(r=>[r.no,r.employeeName,r.position,r.department,r.classification,r.plant,r.contractType||'',r.contractDays||'',r.contractStart||'',r.contractEnd||'',TYPES[r.kind],r.scheduledDate,status(r),r.deliveredDate||'',r.completedDate||'',format(r),dossier(r),r.decision||'',r.rioLevel||'',r.evidenceUrl||''])];}
function departmentHTML(rows){const groups=new Map();for(const r of rows.filter(r=>!r.exempt&&!r.historical)){const d=r.department||'Sin departamento';if(!groups.has(d))groups.set(d,[]);groups.get(d).push(r);}return [...groups].sort(([a],[b])=>a.localeCompare(b,'es')).map(([department,list])=>'<article class="ev-print"><h1>MAM DE LA FRONTERA, S.A. DE C.V.</h1><h2>Entrega de evaluaciones · '+esc(department)+'</h2><p>Samara University · '+esc(TYPES[state.kind]||'Evaluaciones')+' · Fecha de emisión '+today()+'</p><table><thead><tr>'+['No. / Nombre','Puesto / Planta','Evaluación / Fecha','Contrato / Inicio / Vencimiento','¿Se renueva?','Firma de autorización'].map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+list.map(r=>'<tr><td>'+esc(r.no+' · '+r.employeeName)+'</td><td>'+esc(r.position+' / '+r.plant)+'</td><td>'+esc(TYPES[r.kind]+' / '+r.scheduledDate)+'</td><td>'+esc((r.contractDays?r.contractDays+' días':r.contractType||'Pendiente')+' / '+(r.contractStart||'—')+' / '+(r.contractEnd||(r.contractType==='Indefinido'?'Indefinido':'Pendiente')))+'</td><td>'+(r.kind==='renewal'?'□ Sí  □ No':'No aplica')+'</td><td class="ev-sign">________________</td></tr>').join('')+'</tbody></table><p>Entregó RH: ____________________ Recibió departamento: ____________________ Fecha: ______________</p><small>Las firmas se recaban manualmente. La decisión de renovación no modifica el contrato ni el estado del empleado.</small></article>').join('');}
function syncNavigation(){document.querySelectorAll('[data-evaluation-section]').forEach(button=>{const active=$('view-evaluations')?.classList.contains('active')&&button.dataset.evaluationSection===state.kind;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});}
function selectSection(kind){if(!Object.hasOwn({...TYPES,promotion:'Promociones'},kind))return;Object.assign(state,{kind,status:'Por atender',search:'',department:'',from:'',to:''});syncNavigation();render();}
function init(config){api=config;const dialog=document.createElement('dialog');dialog.id='evaluation-dialog';dialog.className='ev-editor';document.body.append(dialog);const root=$('evaluations-root');root.addEventListener('change',e=>{const k=e.target.dataset.evFilter;if(k){state[k]=k==='year'?Number(e.target.value):e.target.value;render();}});root.addEventListener('input',e=>{if(e.target.dataset.evFilter==='search'){const pos=e.target.selectionStart;state.search=e.target.value;render();const input=root.querySelector('[data-ev-filter="search"]');input.focus();input.setSelectionRange(pos,pos);}});root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.evTab){selectSection(b.dataset.evTab);return;}if(b.dataset.evAction==='personal'){api.openPeople?.();return;}if(b.dataset.evOpen)open(b.dataset.evOpen);if(b.dataset.evTemplate){const row=find(b.dataset.evTemplate);b.disabled=true;try{await window.EvaluationTemplates.download(row,api.context().employees.find(x=>identity(x)===row.employeeId)||{});}catch(error){api.toast('No se pudo preparar el formato: '+error.message);}finally{b.disabled=false;}}if(b.dataset.evAction==='reset'){Object.assign(state,{year:0,search:'',status:'Por atender',department:'',classification:'',plant:'',from:'',to:''});render();}if(b.dataset.evAction==='history')history();if(b.dataset.evAction==='csv')window.descargarArchivo(new Blob([csv(controlRows(selection().rows))],{type:'text/csv;charset=utf-8'}),'Control-evaluaciones-'+state.year+'.csv');if(b.dataset.evAction==='department'){if(!selection().rows.some(r=>!r.exempt&&!r.historical))return api.toast('No hay evaluaciones para imprimir con estos filtros.');api.print(departmentHTML(selection().rows));}});}
return {init,render,selectSection,syncNavigation,build,contract,contractPatch,contractLabel,importContract,classification,date,add,inputDate,validate,status,dossier,format,identity,controlRows,csv,departmentHTML,today};
})();
