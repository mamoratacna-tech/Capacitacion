 if(raw){const n=norm(raw);out.contractType=/indefin|indetermin/.test(n)?'Indefinido':n.includes('obra')?'Obra determinada':/temporal|dias|determinado/.test(n)||/^\d+$/.test(n)?'Temporal':'Especial';const days=raw.match(/\d+/);if(days&&e.contractDays&&Number(e.contractDays)!==Number(days[0]))throw Error('El tipo de contrato y los días capturados no coinciden.');if(!e.contractDays&&days)out.contractDays=days[0];}
