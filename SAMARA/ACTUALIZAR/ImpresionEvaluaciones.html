<style>
.ev-preview{width:min(1120px,96vw);height:92vh;max-height:94vh;padding:0;border:0;border-radius:14px;color:#28465b;overflow:hidden}.ev-preview::backdrop{background:#12293eaa}.ev-preview-shell{height:100%;display:flex;flex-direction:column}.ev-preview-toolbar{padding:17px 20px;border-bottom:1px solid #dce5ec;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:white}.ev-preview-toolbar>div:first-child{flex:1;min-width:160px}.ev-preview-toolbar h2{font-size:17px;margin:0 0 4px}.ev-preview-toolbar p{font-size:11px;color:#718595;margin:0}.ev-preview-toolbar .close-dialog{flex:none}.ev-preview-pages{display:block;flex:1;width:100%;min-height:0;overflow:auto;background:#e5e9ed;padding:18px}.ev-preview-paper{background:white;max-width:850px;margin:0 auto 20px;box-shadow:0 2px 10px #12293e22}.ev-preview-paper canvas{display:block;width:100%;height:auto}.ev-preview-page-number{text-align:center;font-size:11px;color:#718595;margin:-12px 0 20px}.ev-preview-print-frame{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;bottom:0;border:0}.ev-preview-message{padding:18px;font-size:13px;line-height:1.6;background:#f5f8fa}.ev-preview-message[hidden]{display:none}@media(max-width:600px){.ev-preview-toolbar{padding:13px}.ev-preview-toolbar .button{font-size:11px;padding:8px 10px}}
</style>
<script>
window.SamaraEvaluationPrint=(()=>{
'use strict';
let api,dialog,frame,url='',ticket=0,pdfDocument=null,rendered=[];const templates=new Map();
const TYPES={mid:'Mitad de periodo',renewal:'Renovación',annual:'Anual'};
const dateText=value=>window.SamaraEvaluations.date(value)?value.split('-').reverse().join('/'):'';
const numberFont=8.5;
async function template(key){if(!templates.has(key))templates.set(key,api.template(key).catch(error=>{templates.delete(key);throw error;}));return templates.get(key);}
function textFor(font,value){return [...String(value??'').replace(/[\r\n\t]+/g,' ').replace(/[\u2010-\u2015]/g,'-')].map(c=>{try{font.encodeText(c);return c;}catch{return c.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');}}).join('');}
function lines(font,text,size,width){const out=[];let line='';for(const word of text.split(/\s+/)){if(!word)continue;const next=line?line+' '+word:word;if(font.widthOfTextAtSize(next,size)<=width){line=next;continue;}if(line)out.push(line);line='';if(font.widthOfTextAtSize(word,size)<=width){line=word;continue;}for(const c of word){if(line&&font.widthOfTextAtSize(line+c,size)>width){out.push(line);line='';}line+=c;}}if(line)out.push(line);return out;}
function drawField(page,font,field,value){const text=textFor(font,value);if(!text)return;let size=field.size||numberFont,rows=lines(font,text,size,field.w);while(size>5.5&&rows.length*size*1.15>field.h){size-=.25;rows=lines(font,text,size,field.w);}const height=page.getHeight();rows.forEach((line,i)=>{const width=font.widthOfTextAtSize(line,size),x=field.x+(field.align==='center'?(field.w-width)/2:0);page.drawText(line,{x,y:height-field.y-size-i*size*1.15,size,font,color:PDFLib.rgb(.06,.09,.12)});});}
function addTraining(doc,font,row,training){const {rgb}=PDFLib;let page,y;const newPage=()=>{page=doc.addPage([612,792]);page.drawText('CAPACITACIÓN TOMADA POR EL TRABAJADOR',{x:40,y:746,size:13,font,color:rgb(.08,.18,.26)});drawField(page,font,{x:40,y:61,w:530,h:30,size:10},row.no+' · '+row.employeeName);page.drawText('Año '+training.year+' · Continuación del RHF0005F',{x:40,y:675,size:10,font});for(const [x,text]of [[40,'Fecha'],[132,'Clave'],[247,'Capacitación']])page.drawText(text,{x,y:645,size:9,font});page.drawLine({start:{x:40,y:635},end:{x:570,y:635},thickness:.7,color:rgb(.5,.6,.65)});y=622;page.drawText('Samara University · Hoja adicional de capacitación',{x:40,y:30,size:8,font,color:rgb(.35,.42,.48)});};newPage();for(const course of training.courses.slice(3)){const name=lines(font,textFor(font,course.name),9,320),code=lines(font,textFor(font,course.code),9,106),height=Math.max(28,Math.max(name.length,code.length)*11+12);if(y-height<55)newPage();page.drawText(dateText(course.date),{x:40,y:y-10,size:9,font});code.forEach((v,i)=>page.drawText(v,{x:132,y:y-10-i*11,size:9,font}));name.forEach((v,i)=>page.drawText(v,{x:247,y:y-10-i*11,size:9,font}));y-=height;page.drawLine({start:{x:40,y},end:{x:570,y},thickness:.4,color:rgb(.75,.79,.82)});}}
async function prepare(row,employee={},context={},exam=false){
 if(!window.PDFLib)throw Error('No se cargó el visor de impresión. Recarga la aplicación.');
 const key=exam?window.SamaraEvaluations.examKey(row):row.classification==='D'?'direct':row.kind==='mid'?'mid':'review';if(!key)throw Error('El examen aplica solo a personal directo en renovación y requiere un departamento con examen asignado.');
 const source=await template(key),doc=await PDFLib.PDFDocument.load(Uint8Array.from(atob(source.pdf),c=>c.charCodeAt(0))),font=await doc.embedFont(PDFLib.StandardFonts.Helvetica),training=window.SamaraEvaluations.yearTraining(row,employee,context),values={no:row.no,name:row.employeeName,position:row.position,department:row.department,plant:row.plant,supervisor:row.supervisor||'',hireDate:dateText(row.contractStart||employee.contractStart||employee.hireDate),type:TYPES[row.kind]||'',due:dateText(row.completedDate||row.scheduledDate),periodStart:dateText(row.periodStart||row.contractStart),periodEnd:dateText(row.periodEnd||row.contractEnd),trainingYear:training.year,trainingContinuation:training.courses.length>3?'(continúa en anexo)':''};
 for(let i=0;i<3;i++){values['trainingDate'+(i+1)]=dateText(training.courses[i]?.date);values['trainingCourse'+(i+1)]=training.courses[i]?.name||'';}
 source.fields.forEach(field=>drawField(doc.getPages()[field.page],font,field,values[field.key]));if(key==='direct'&&training.courses.length>3)addTraining(doc,font,row,training);
 doc.setTitle((exam?'Examen':'Evaluación')+' · '+row.no+' · '+row.employeeName);doc.setAuthor('Samara University');const bytes=await doc.save();return {blob:new Blob([bytes],{type:'application/pdf'}),key,pages:doc.getPageCount()};
}
function clear(){ticket++;if(frame){frame.remove();frame=null;}rendered=[];dialog?.querySelector('.ev-preview-pages').replaceChildren();if(pdfDocument){pdfDocument.destroy().catch(()=>{});pdfDocument=null;}if(url)URL.revokeObjectURL(url);url='';}
async function renderPdf(blob,id){if(!window.pdfjsLib)await window.samaraLoadPdfLibrary('reader');const loading=pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),useSystemFonts:true}),pdf=await loading.promise;if(ticket!==id||!dialog.open){await pdf.destroy();return;}pdfDocument=pdf;const container=dialog.querySelector('.ev-preview-pages'),message=dialog.querySelector('.ev-preview-message');for(let n=1;n<=pdf.numPages;n++){if(ticket!==id)return;message.textContent='Preparando página '+n+' de '+pdf.numPages+'…';const page=await pdf.getPage(n),viewport=page.getViewport({scale:2}),canvas=document.createElement('canvas'),paper=document.createElement('div');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);paper.className='ev-preview-paper';paper.append(canvas);container.append(paper);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;if(ticket!==id)return;rendered.push({canvas,width:viewport.width/2,height:viewport.height/2});const count=document.createElement('p');count.className='ev-preview-page-number';count.textContent='Página '+n+' de '+pdf.numPages;container.append(count);page.cleanup();}message.hidden=true;dialog.querySelector('[data-ev-preview-print]').disabled=false;dialog.querySelector('[data-ev-preview-tab]').disabled=false;}
async function printPreview(){if(!rendered.length)return;const button=dialog.querySelector('[data-ev-preview-print]');button.disabled=true;try{if(frame)frame.remove();frame=document.createElement('iframe');frame.className='ev-preview-print-frame';frame.title='Impresión del documento';document.body.append(frame);const d=frame.contentDocument,first=rendered[0];d.open();d.write('<!doctype html><html><head><title>Samara University</title><style>@page{size:'+first.width+'pt '+first.height+'pt;margin:0}body{margin:0;padding:0}.ev-paper{margin:0;break-after:page;page-break-after:always;overflow:hidden}.ev-paper:last-child{break-after:auto;page-break-after:auto}.ev-paper img{display:block;width:100%;height:100%}</style></head><body></body></html>');d.close();const ready=[];for(const {canvas,width,height}of rendered){const paper=d.createElement('div'),img=d.createElement('img');paper.className='ev-paper';paper.style.width=width+'pt';paper.style.height=height+'pt';ready.push(new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('No se pudo preparar una página para imprimir.'));}));img.src=canvas.toDataURL('image/png');paper.append(img);d.body.append(paper);}await Promise.all(ready);frame.contentWindow.focus();frame.contentWindow.print();}catch(error){api.toast('No se pudo imprimir: '+error.message);}finally{button.disabled=false;}}
async function preview(row,employee,context,exam=false){clear();const id=ticket;dialog.querySelector('h2').textContent=exam?'Vista previa del examen':'Vista previa de evaluación';dialog.querySelector('.ev-preview-person').textContent=row.no+' · '+row.employeeName;const message=dialog.querySelector('.ev-preview-message'),print=dialog.querySelector('[data-ev-preview-print]'),tab=dialog.querySelector('[data-ev-preview-tab]');message.hidden=false;message.textContent='Preparando el documento para imprimir…';print.disabled=true;tab.disabled=true;delete dialog.dataset.previewKey;if(!dialog.open)dialog.showModal();try{const result=await prepare(row,employee,context,exam);if(ticket!==id||!dialog.open)return result;url=URL.createObjectURL(result.blob);dialog.dataset.previewUrl=url;dialog.dataset.previewKey=result.key;dialog.dataset.previewPages=String(result.pages);await renderPdf(result.blob,id);return result;}catch(error){if(ticket!==id)return;message.textContent='No se pudo preparar: '+error.message;throw error;}}
function init(config){api=config;dialog=document.createElement('dialog');dialog.id='evaluation-preview-dialog';dialog.className='ev-preview';dialog.innerHTML='<div class="ev-preview-shell"><div class="ev-preview-toolbar"><div><h2>Vista previa de impresión</h2><p class="ev-preview-person"></p></div><button type="button" class="button primary" data-ev-preview-print disabled>Imprimir</button><button type="button" class="button outline" data-ev-preview-tab disabled>Abrir en pestaña</button><button type="button" class="close-dialog" data-ev-preview-close aria-label="Cerrar vista previa">×</button></div><div class="ev-preview-message" role="status"></div><div class="ev-preview-pages" aria-label="Páginas del documento para imprimir"></div></div>';document.body.append(dialog);dialog.querySelector('[data-ev-preview-close]').onclick=()=>dialog.close();dialog.addEventListener('close',clear);dialog.querySelector('[data-ev-preview-print]').onclick=printPreview;dialog.querySelector('[data-ev-preview-tab]').onclick=()=>{if(url)window.open(url,'_blank','noopener');};}
function dispose(){clear();templates.clear();dialog?.remove();}
return {init,prepare,preview,dispose};
})();
</script>
