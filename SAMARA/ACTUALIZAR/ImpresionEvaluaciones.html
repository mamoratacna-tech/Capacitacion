<script>
window.SamaraEvaluationPrint=(()=>{
'use strict';
let api,dialog,frame,url='',ticket=0,pdfDocument=null,rendered=[],wordContext=null,wordBusy=false;const templates=new Map();
const TYPES={mid:'Mitad de periodo',renewal:'Renovación',annual:'Anual',promotion:'Promoción'};
const dateText=value=>window.SamaraEvaluations.date(value)?value.split('-').reverse().join('/'):'';
const numberFont=8.5;
async function template(key){if(!templates.has(key))templates.set(key,api.template(key).catch(error=>{templates.delete(key);throw error;}));return templates.get(key);}
function textFor(font,value){return [...String(value??'').replace(/[\r\n\t]+/g,' ').replace(/[\u2010-\u2015]/g,'-')].map(c=>{try{font.encodeText(c);return c;}catch{return c.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');}}).join('');}

function drawField(page,font,field,value){const text=textFor(font,value);if(!text)return;let size=field.size||numberFont,rows=lines(font,text,size,field.w);while(size>5.5&&rows.length*size*1.15>field.h){size-=.25;rows=lines(font,text,size,field.w);}const height=page.getHeight();rows.forEach((line,i)=>{const width=font.widthOfTextAtSize(line,size),x=field.x+(field.align==='center'?(field.w-width)/2:0);page.drawText(line,{x,y:height-field.y-size-i*size*1.15,size,font,color:PDFLib.rgb(.06,.09,.12)});});}
// All layout coordinates below use a top-left origin, in points on Letter paper.
function appendTrainingPages(doc,font,bold,row,training,{indirect=false,entries=training.courses.map((course,i)=>({...course,number:i+1}))}={}){
 const {rgb}=PDFLib,W=532,X=40,BOTTOM=746,gray=rgb(.93,.93,.93),black=rgb(0,0,0),pages=[];

 };

 const pair=(label,value)=>{const a=W*.22,h=Math.max(height(label,a,{label:true}),height(value,W-a));cell(X,y,a,h,label,{label:true});cell(X+a,y,W-a,h,value);y+=h;};
 const split=(leftLabel,leftValue,rightLabel,rightValue)=>{const widths=[.22,.18,.16,.44].map(p=>p*W),values=[leftLabel,leftValue,rightLabel,rightValue],h=Math.max(...values.map((v,i)=>height(v,widths[i],{label:i%2===0})));let x=X;values.forEach((v,i)=>{cell(x,y,widths[i],h,v,{label:i%2===0});x+=widths[i];});y+=h;};
 function newPage(full=false){
  page=doc.addPage([612,792]);pages.push(page);y=30;
  cell(X,y,W,22,'SAMARA - Formato',{label:true,size:11,align:'center'});y+=22;
  cell(X,y,W,22,indirect?'ANEXO DE CAPACITACIÓN Y REVISIÓN CMCAP':'RHF0005F · CONTINUACIÓN DE CAPACITACIÓN',{size:10,align:'center'});y+=22;
  cell(X,y,W*.64,18,indirect?'No. Formato: N/A':'Continuación del RHF0005F',{size:8});cell(X+W*.64,y,W*.18,18,'Anexo',{size:8,align:'center'});cell(X+W*.82,y,W*.18,18,'Página '+pages.length,{size:8,align:'center'});y+=18;

   split('No.:',row.no,'Nombre:',row.employeeName);pair('Puesto:',row.position);pair('Dpto.:',row.department);split('Clasificación:',row.classification+' · '+(row.classification==='I'?'Indirecto':'Directo'),'Planta:',row.plant);pair('Tipo de evaluación:',window.SamaraEvaluations.evaluationType(row)||'');if(row.kind==='promotion'){pair(window.SamaraEvaluations.movementCode(row)==='leveling'?'Puesto que se conserva:':'Puesto propuesto:',row.proposedPosition);pair(window.SamaraEvaluations.movementCode(row)==='leveling'?'Dpto. actual:':'Dpto. propuesto:',row.proposedDepartment||'');if(row.proposedSalary)pair('Salario propuesto:',window.SamaraEvaluations.salaryText(row.proposedSalary));}pair('Periodo a evaluar:','Del '+period);

   if(h>BOTTOM-y)throw Error('La clave del curso es demasiado extensa para imprimir. Revisa el glosario de cursos.');

  // Keep comments, decision and all four signatures together on the same page.
  const labels=['Comentarios de la CMCAP\nComisión Mixta de Capacitación, Adiestramiento y Productividad','Representante CMCAP:','Fecha de revisión:','¿Aplica para renovación de contrato?'],a=W*.32,heights=[Math.max(84,height(labels[0],a,{label:true})),24,24,Math.max(36,height(labels[3],a,{label:true}))],signatureLabels=['Empleado evaluado','Jefe de departamento','Representante CMCAP','Recursos Humanos'],signatureHeights=signatureLabels.map(t=>height(t,a,{label:true,min:28})),block=heights.reduce((n,h)=>n+h,0)+signatureHeights.reduce((n,h)=>n+h,0)+16;

  labels.forEach((label,i)=>{const h=heights[i];cell(X,y,a,h,label,{label:true,size:9,vertical:i===0?'top':'middle'});cell(X+a,y,W-a,h);
   if(i===0)for(let n=1;n<=4;n++)page.drawLine({start:{x:X+a+12,y:792-y-12-n*(h-20)/4},end:{x:X+W-12,y:792-y-12-n*(h-20)/4},thickness:.5,color:black});
   if(i===3){const start=X+a+20,step=(W-a-40)/3;['Sí','No','N/A'].forEach((t,j)=>{const x=start+j*step,top=y+(h-10)/2;page.drawText(t,{x,y:792-top-9,size:9,font});page.drawRectangle({x:x+font.widthOfTextAtSize(t,9)+7,y:792-top-10,width:9,height:9,borderWidth:.6,borderColor:black});});}
   y+=h;
  });y+=16;
  signatureLabels.forEach((label,i)=>{const h=signatureHeights[i];cell(X,y,a,h,label,{label:true});cell(X+a,y,W-a,h);const top=y+(h-9)/2;page.drawText('Nombre:',{x:X+a+8,y:792-top-9,size:8.5,font});page.drawText('Firma:',{x:X+a+220,y:792-top-9,size:8.5,font});page.drawLine({start:{x:X+a+47,y:792-top-11},end:{x:X+a+207,y:792-top-11},thickness:.5,color:black});page.drawLine({start:{x:X+a+251,y:792-top-11},end:{x:X+W-8,y:792-top-11},thickness:.5,color:black});y+=h;});
 }
 pages.forEach((p,i)=>{p.drawText('Samara University',{x:X,y:24,size:8,font,color:black});const footer='Anexo · Página '+(i+1)+' de '+pages.length;p.drawText(footer,{x:X+W-font.widthOfTextAtSize(footer,8),y:24,size:8,font,color:black});});

async function prepare(row,employee={},context={},exam=false){
 row=window.SamaraEvaluations.levelingRecord(row,employee,context);
 if(!window.PDFLib)throw Error('No se cargó el visor de impresión. Recarga la aplicación.');
 const E=window.SamaraEvaluations,key=exam?E.examKey(row):E.formatKey(row);if(!key)throw Error('El examen aplica solo a personal directo en renovación y requiere un departamento con examen asignado.');

 const training=exam?null:E.periodTraining(row,employee,context);if(training&&!training.valid)throw Error('Captura un periodo a evaluar válido (Desde y Hasta) en Actualizar estado antes de imprimir.');
 const source=await template(key),doc=await PDFLib.PDFDocument.load(Uint8Array.from(atob(source.pdf),c=>c.charCodeAt(0))),font=await doc.embedFont(PDFLib.StandardFonts.Helvetica),bold=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold),values={no:row.no,name:row.employeeName,position:row.position,department:row.department,plant:row.plant,supervisor:row.supervisor||'',hireDate:dateText(row.contractStart||employee.contractStart||employee.hireDate),type:window.SamaraEvaluations.evaluationType(row)||'',due:dateText(row.completedDate||row.scheduledDate),periodStart:dateText(training?.start),periodEnd:dateText(training?.end)};
 const extra=[];
 if(training){
  values.trainingPeriod=dateText(training.start)+' al '+dateText(training.end);
  for(let i=0;i<4;i++){
   const course=training.courses[i],field=source.fields.find(f=>f.key==='trainingCourse'+(i+1));values['trainingDate'+(i+1)]=dateText(course?.date);values['trainingCourse'+(i+1)]=course?.name||'';
   if(course&&field&&lines(font,textFor(font,course.name),5.5,field.w).length*5.5*1.15>field.h){values['trainingCourse'+(i+1)]=(course.code?course.code+' · ':'')+'Ver detalle en continuación';extra.push({...course,number:i+1});}
  }
  training.courses.slice(4).forEach((course,i)=>extra.push({...course,number:i+5}));values.trainingContinuation=extra.length?' · continúa en anexo':'';
 }
 source.fields.forEach(field=>{let target=field;if(row.kind==='promotion'&&key==='review'&&field.key==='position')target={...field,y:173,h:14,size:9};if(row.kind==='promotion'&&key==='review'&&field.key==='department')target={...field,y:220,h:15,size:9};drawField(doc.getPages()[field.page],font,target,values[field.key]);});

  const salary=E.salaryText(row.proposedSalary);
  if(key==='direct'){
   drawField(doc.getPages()[0],font,{x:175,y:198,w:197,h:14,size:8},row.proposedPosition);drawField(doc.getPages()[0],font,{x:466,y:198,w:94,h:14,size:8},row.proposedPositionCode||'');
   if(salary){const page=doc.getPages()[1];page.drawRectangle({x:494,y:792-164,width:68,height:13,color:PDFLib.rgb(1,1,1)});drawField(page,font,{x:495,y:153,w:65,h:10,size:8},salary);}
  }else if(key==='review'){
   const page=doc.getPages()[0];drawField(page,font,{x:135,y:189,w:390,h:17,size:8},(window.SamaraEvaluations.movementCode(row)==='leveling'?'Puesto que se conserva: ':'Puesto propuesto: ')+row.proposedPosition);drawField(page,font,{x:135,y:242,w:390,h:11,size:9},'Tipo de evaluación: '+E.evaluationType(row));if(salary)drawField(page,font,{x:135,y:255,w:390,h:11,size:8},'Salario propuesto: '+salary);
  }

 let annexPages=0;if(!exam&&key==='direct'&&extra.length)annexPages=appendTrainingPages(doc,font,bold,row,training,{entries:extra});

}
function clear(){ticket++;wordContext=null;wordBusy=false;const word=dialog?.querySelector('[data-ev-preview-word]');if(word){word.hidden=true;word.disabled=true;word.textContent='Word';}if(frame){frame.remove();frame=null;}rendered=[];dialog?.querySelector('.ev-preview-pages').replaceChildren();if(pdfDocument){pdfDocument.destroy().catch(()=>{});pdfDocument=null;}if(url)URL.revokeObjectURL(url);url='';}
async function renderPdf(blob,id){if(!window.pdfjsLib)await window.samaraLoadPdfLibrary('reader');const loading=pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),useSystemFonts:true}),pdf=await loading.promise;if(ticket!==id||!dialog.open){await pdf.destroy();return;}pdfDocument=pdf;const container=dialog.querySelector('.ev-preview-pages'),message=dialog.querySelector('.ev-preview-message');for(let n=1;n<=pdf.numPages;n++){if(ticket!==id)return;message.textContent='Preparando página '+n+' de '+pdf.numPages+'…';const page=await pdf.getPage(n),viewport=page.getViewport({scale:2}),canvas=document.createElement('canvas'),paper=document.createElement('div');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);paper.className='ev-preview-paper';paper.append(canvas);container.append(paper);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;if(ticket!==id)return;rendered.push({canvas,width:viewport.width/2,height:viewport.height/2});const count=document.createElement('p');count.className='ev-preview-page-number';count.textContent='Página '+n+' de '+pdf.numPages;container.append(count);page.cleanup();}message.hidden=true;dialog.querySelector('[data-ev-preview-print]').disabled=false;dialog.querySelector('[data-ev-preview-tab]').disabled=false;}
async function printPreview(){if(!rendered.length)return;const button=dialog.querySelector('[data-ev-preview-print]');button.disabled=true;try{if(frame)frame.remove();frame=document.createElement('iframe');frame.className='ev-preview-print-frame';frame.title='Impresión del documento';document.body.append(frame);const d=frame.contentDocument,first=rendered[0];d.open();d.write('<!doctype html><html><head><title>Samara University</title><style>@page{size:'+first.width+'pt '+first.height+'pt;margin:0}body{margin:0;padding:0}.ev-paper{margin:0;break-after:page;page-break-after:always;overflow:hidden}.ev-paper:last-child{break-after:auto;page-break-after:auto}.ev-paper img{display:block;width:100%;height:100%}</style></head><body></body></html>');d.close();const ready=[];for(const {canvas,width,height}of rendered){const paper=d.createElement('div'),img=d.createElement('img');paper.className='ev-paper';paper.style.width=width+'pt';paper.style.height=height+'pt';ready.push(new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('No se pudo preparar una página para imprimir.'));}));img.src=canvas.toDataURL('image/png');paper.append(img);d.body.append(paper);}await Promise.all(ready);frame.contentWindow.focus();frame.contentWindow.print();}catch(error){api.toast('No se pudo imprimir: '+error.message);}finally{button.disabled=false;}}
async function downloadWordPreview(){
 if(!wordContext||wordBusy||!dialog.open)return;const snapshot=wordContext,id=ticket,button=dialog.querySelector('[data-ev-preview-word]');wordBusy=true;button.disabled=true;button.textContent='Preparando…';
 try{if(!window.EvaluationTemplates?.downloadWord)throw Error('No se cargó la descarga Word. Recarga la aplicación.');await window.EvaluationTemplates.downloadWord(snapshot.row,snapshot.employee,snapshot.context,{canDownload:()=>ticket===id&&dialog.open&&wordContext===snapshot});}
 catch(error){if(ticket===id&&dialog.open)api.toast('No se pudo descargar Word: '+error.message);}
 finally{if(ticket===id){wordBusy=false;button.textContent='Word';button.disabled=!wordContext;}}
}
async function preview(row,employee,context,exam=false){
 clear();const id=ticket,snapshot=structuredClone({row,employee:employee||{},context:context||{}});dialog.querySelector('h2').textContent=exam?'Vista previa del examen':'Vista previa de evaluación';dialog.querySelector('.ev-preview-person').textContent=row.no+' · '+row.employeeName;
 const message=dialog.querySelector('.ev-preview-message'),print=dialog.querySelector('[data-ev-preview-print]'),tab=dialog.querySelector('[data-ev-preview-tab]'),word=dialog.querySelector('[data-ev-preview-word]');word.hidden=exam||row.classification!=='I'||window.SamaraEvaluations.formatKey(row)==='direct';word.disabled=true;message.hidden=false;message.textContent='Preparando el documento para imprimir…';print.disabled=true;tab.disabled=true;delete dialog.dataset.previewKey;if(!dialog.open)dialog.showModal();
 try{const result=await prepare(snapshot.row,snapshot.employee,snapshot.context,exam);if(ticket!==id||!dialog.open)return result;url=URL.createObjectURL(result.blob);dialog.dataset.previewUrl=url;dialog.dataset.previewKey=result.key;dialog.dataset.previewPages=String(result.pages);await renderPdf(result.blob,id);if(ticket===id&&dialog.open&&!word.hidden){wordContext=snapshot;word.disabled=false;}return result;}
 catch(error){if(ticket!==id)return;message.textContent='No se pudo preparar: '+error.message;throw error;}
}
function init(config){api=config;dialog=document.createElement('dialog');dialog.id='evaluation-preview-dialog';dialog.className='ev-preview';dialog.innerHTML='<div class="ev-preview-shell"><div class="ev-preview-toolbar"><div><h2>Vista previa de impresión</h2><p class="ev-preview-person"></p></div><button type="button" class="button primary" data-ev-preview-print disabled>Imprimir</button><button type="button" class="button outline" data-ev-preview-word hidden disabled>Word</button><button type="button" class="button outline" data-ev-preview-tab disabled>Abrir en pestaña</button><button type="button" class="close-dialog" data-ev-preview-close aria-label="Cerrar vista previa">×</button></div><div class="ev-preview-message" role="status"></div><div class="ev-preview-pages" aria-label="Páginas del documento para imprimir"></div></div>';document.body.append(dialog);dialog.querySelector('[data-ev-preview-close]').onclick=()=>dialog.close();dialog.addEventListener('close',clear);dialog.querySelector('[data-ev-preview-print]').onclick=printPreview;dialog.querySelector('[data-ev-preview-word]').onclick=downloadWordPreview;dialog.querySelector('[data-ev-preview-tab]').onclick=()=>{if(url)window.open(url,'_blank','noopener');};}

})();
