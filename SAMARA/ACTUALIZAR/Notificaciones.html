<style>
#notifications-toggle{position:relative;width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;border-radius:7px;background:#fff;cursor:pointer;color:#526b7e}#notifications-toggle:hover,#notifications-toggle[aria-expanded=true]{background:#f0f6f8;border-color:#dce6ed}#notifications-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.notifications-badge{position:absolute;right:-5px;top:-3px;min-width:17px;height:17px;border-radius:12px;padding:1px 4px;background:#c94646;color:#fff;font:700 9px/15px Arial;border:1px solid white}.notifications-badge[hidden]{display:none}#notifications-panel{position:fixed;inset:65px 28px auto auto;margin:0;width:min(460px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 85px);padding:0;border:1px solid #dce6ed;border-radius:12px;box-shadow:0 14px 50px #18344f33;color:#28465b;overflow:hidden}#notifications-panel::backdrop{background:#10243a22;backdrop-filter:none}.notifications-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 12px}.notifications-head h2{font:700 18px Arial,sans-serif;margin:0}.notifications-tabs{display:flex;gap:8px;padding:0 20px 14px;border-bottom:1px solid #e7edf2}.notifications-tabs button{flex:1;border:1px solid #dce6ed;border-radius:6px;padding:9px;background:#fff;color:#647c90;font:600 11px Arial;cursor:pointer}.notifications-tabs button[aria-selected=true]{border-color:#3f9d87;background:#eff8f4;color:#276b5c}.notifications-scroll{max-height:calc(100dvh - 295px);overflow-y:auto;overflow-x:hidden;padding:0 20px;overscroll-behavior:contain}.notification-item{border-bottom:1px solid #e7edf2;padding:16px 0}.notification-top{display:flex;align-items:flex-start;gap:10px}.notification-dot{flex:none;width:8px;height:8px;margin-top:5px;border-radius:50%;background:#5b8ba9}.notification-item.danger .notification-dot{background:#cf5050}.notification-item.warning .notification-dot{background:#df943d}.notification-item h3{font:600 12px/1.5 Arial;margin:0;color:#29465c}.notification-item p{font:11px/1.6 Arial;margin:6px 0 0;white-space:pre-line;overflow-wrap:anywhere;color:#72899c}.notification-item small{display:block;margin:5px 0 0;font:10px/1.5 Arial;color:#8396a5}.notification-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}.notification-actions .button{font:600 10px Arial;height:30px}.notifications-empty{padding:30px 0;text-align:center;color:#8194a5;font:12px/1.6 Arial}.notifications-foot{padding:12px 20px;border-top:1px solid #e7edf2;background:#fbfcfd}.notifications-foot p{font:10px/1.6 Arial;color:#7a91a5;margin:0}.notifications-foot [role=alert]{color:#b33643;margin:0 0 7px}.notifications-foot [role=alert]:empty{display:none}.notifications-foot button{border:0;padding:5px 0;background:none;color:#27816a;font:600 10px Arial;cursor:pointer}.notification-item.read{background:#fafcfd}@media(max-width:600px){#notifications-panel{inset:62px 12px auto auto}.notifications-head{padding:16px 16px 12px}.notifications-tabs{padding-left:16px;padding-right:16px}.notifications-scroll{padding:0 16px}}
</style>
<dialog id="notifications-panel" aria-labelledby="notifications-title"><div class="notifications-head"><h2 id="notifications-title">Notificaciones</h2><button type="button" id="notifications-close" class="close-dialog" aria-label="Cerrar notificaciones">×</button></div><div class="notifications-tabs" role="tablist" aria-label="Estado de lectura"><button type="button" id="notifications-pending-tab" role="tab" aria-selected="true" aria-controls="notifications-list" data-notification-tab="pending">Pendientes</button><button type="button" id="notifications-read-tab" role="tab" aria-selected="false" aria-controls="notifications-list" data-notification-tab="read" tabindex="-1">Leídas</button></div><div id="notifications-list" class="notifications-scroll" role="tabpanel" aria-labelledby="notifications-pending-tab"></div><div class="notifications-foot"><p id="notifications-error" role="alert"></p><p>Los avisos leídos siguen pendientes hasta corregir su causa. Solo ves los módulos que puedes consultar.</p><button type="button" id="notifications-refresh">Actualizar avisos</button></div></dialog>
<script>
window.SamaraNotifications=(()=>{
 'use strict';
 const n=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const valid=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))&&!isNaN(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;
 const format=v=>v.split('-').reverse().join('/');
 function fingerprint(value){const s=JSON.stringify(value);let a=2166136261,b=2246822507;for(let i=0;i<s.length;i++){a=Math.imul(a^s.charCodeAt(i),16777619);b=Math.imul(b^s.charCodeAt(i),3266489909);}return (a>>>0).toString(16).padStart(8,'0')+(b>>>0).toString(16).padStart(8,'0');}
 function build(context,{today,can,dashboard,program,validateList}){
  const year=Number(today.slice(0,4)),month=Number(today.slice(5,7)),out=[],authorized=new Set((context.authorizedCourseCodes||[]).map(n));
  function add(kind,ref,title,description,priority,module,options,version,sortDate=''){
   if(!can(module))return;out.push({id:kind+':'+fingerprint(ref),version:fingerprint([title,priority,version]),title,description,priority,module,options,sortDate});
  }
  if(can('program'))for(const y of [...new Set((context.plans||[]).map(p=>Number(p.year)))].filter(y=>y<=year&&y>=2000)){
   const d=dashboard.compute(context,{year:y,month:0,today},program.coverage);
   for(const p of d.plans){const overdue=p.pending.length>0&&p.due<today,dueNow=p.pending.length&&y===year&&Math.max(...p.plan.months)===month,noInstructor=can('courses')&&!authorized.has(n(p.course.code)),unconfigured=p.unconfigured||!p.target.length;
    if(!overdue&&!dueNow&&!noInstructor&&!unconfigured)continue;
    const title=overdue?'Curso programado vencido':dueNow?'Capacitación por concluir este mes':unconfigured?'Revisar población del curso':'Curso sin instructor autorizado';
    let description=p.course.name+' · '+p.course.code+'\nPeriodo '+y+' · Concluir: '+format(p.due);
    if(p.pending.length)description+='\n'+p.pending.length+' de '+p.target.length+' personas pendientes.';
    if(unconfigured)description+='\nRevisa puestos, clasificación e integrantes de la programación.';
    if(noInstructor)description+='\nSin instructor autorizado en el glosario.';
    add('course',[y,n(p.course.code)],title,description,overdue?'danger':dueNow?'warning':'info',overdue||dueNow||unconfigured?'program':'courses',{year:y,courseCode:p.course.code},[p.due,p.pending.map(e=>String(e.no||e.curp||e.id)).sort(),p.target.length,noInstructor,unconfigured],p.due);
   }
  }
  if(can('attendance'))for(const list of context.attendance||[]){
   if(!valid(list.fecha)||list.fecha>today||!dashboard.belongsToSamara(list,context.employees))continue;
   const review=n(list.estado)!=='validada',result=validateList?validateList(list):{issues:[]},issues=[...new Set((result.issues||[]).filter(i=>!String(i).includes('CLAVE CURSO')))].sort(),missingKey=!String(list.sirceDatos?.claveCurso||'').trim();
   const course=context.courses.find(c=>n(c.code)===n(list.cursoCodigo)),isSirce=/^(s[ií]|true|1)$/i.test(String(course?.sirce||''))||Boolean(list.sirceDatos?.claveCurso);
   const sirceIssues=isSirce?issues:[],keyIssue=isSirce&&missingKey;
   if(!review&&!sirceIssues.length&&!keyIssue)continue;
   const messages=[];if(review)messages.push('Listado '+(list.estado||'Borrador')+': revisa la captura y los asistentes.');if(keyIssue)messages.push('Clave del curso SIRCE pendiente.');if(sirceIssues.length)messages.push(sirceIssues.length+' datos o validaciones por completar para SIRCE.');
   const title=review?'Listado pendiente de validar':'Datos pendientes para SIRCE';
   add('list',String(list.id),title,(list.cursoNombre||course?.name||list.cursoCodigo)+' · '+format(list.fecha)+'\n'+messages.join('\n'),'info','attendance',{listId:list.id,review,fixPeople:!review&&Boolean(result.personIssues?.length)},[list.estado,keyIssue,sirceIssues,(list.asistentes||[]).map(a=>[String(a.numero||a.curp||''),a.estado,a.firmo]).sort((a,b)=>a[0].localeCompare(b[0]))],list.fecha);
  }
  if(can('cmcap')){
   const members=(context.cmcap||[]).filter(m=>m.name&&valid(m.startDate)&&valid(m.endDate)&&m.endDate>=m.startDate);
   for(const m of members){const days=Math.round((Date.parse(m.endDate+'T12:00:00Z')-Date.parse(today+'T12:00:00Z'))/86400000);if(m.startDate>today||days>30)continue;
    const uniqueRole=['representante de los trabajadores','coordinador de cmcap','coordinador'].includes(n(m.role));
    const successor=members.some(other=>other!==m&&n(other.role)===n(m.role)&&(uniqueRole||n(other.name)===n(m.name))&&other.startDate>m.startDate&&other.startDate<=(days<0?today:new Date(Date.parse(m.endDate+'T12:00:00Z')+86400000).toISOString().slice(0,10))&&other.endDate>m.endDate&&other.endDate>=today);
    if(successor)continue;
    const expired=days<0;
    add('cmcap',m.id||[n(m.role),n(m.name),m.startDate,m.endDate],expired?'Nombramiento CMCAP vencido':'Nombramiento CMCAP por vencer',m.name+' · '+m.role+'\nVencimiento: '+format(m.endDate)+(expired?' · Vencido':' · '+days+' días restantes'),expired?'danger':'warning','cmcap',{memberId:m.id,name:m.name,role:m.role,startDate:m.startDate,endDate:m.endDate},[m.name,m.role,m.startDate,m.endDate,expired?'expired':'expiring'],m.endDate);
   }
  }
  const order={danger:0,warning:1,info:2};return out.sort((a,b)=>order[a.priority]-order[b.priority]||a.sortDate.localeCompare(b.sortDate)||a.title.localeCompare(b.title,'es')||a.id.localeCompare(b.id));
 }
 let api,reads={},notices=[],tab='pending',timer,busy=false;const $=id=>document.getElementById(id);
 const isRead=item=>reads[item.id]?.version===item.version;
 function render(){if(!api)return;const unread=notices.filter(n=>!isRead(n)),read=notices.filter(isRead),badge=$('notifications-badge');badge.hidden=!unread.length;badge.textContent=unread.length>99?'99+':String(unread.length);$('notifications-toggle').setAttribute('aria-label','Notificaciones: '+unread.length+' pendientes de leer');
  $('notifications-pending-tab').textContent='Pendientes ('+unread.length+')';$('notifications-read-tab').textContent='Leídas ('+read.length+')';
  for(const name of ['pending','read']){const el=$('notifications-'+name+'-tab');el.setAttribute('aria-selected',String(tab===name));el.tabIndex=tab===name?0:-1;}
  $('notifications-list').setAttribute('aria-labelledby','notifications-'+tab+'-tab');const items=tab==='pending'?unread:read;
  $('notifications-list').innerHTML=items.map(item=>'<article class="notification-item '+item.priority+(isRead(item)?' read':'')+'"><div class="notification-top"><span class="notification-dot" aria-hidden="true"></span><div><h3>'+esc(item.title)+'</h3><small>'+({danger:'Prioridad alta',warning:'Próximo a vencer',info:'Seguimiento'}[item.priority])+'</small><p>'+esc(item.description)+'</p></div></div><div class="notification-actions"><button type="button" class="button outline" data-notification-read="'+esc(item.id)+'" '+(busy?'disabled':'')+'>'+(isRead(item)?'Marcar pendiente':'Marcar leída')+'</button><button type="button" class="button primary" data-notification-review="'+esc(item.id)+'">Revisar</button></div></article>').join('')||'<p class="notifications-empty">'+(tab==='pending'?'No tienes avisos pendientes de leer.':'No hay avisos activos marcados como leídos.')+'</p>';
 }
 function refresh(){if(!api)return;clearTimeout(timer);notices=build(api.context(),{today:api.today(),can:api.can,dashboard:window.SamaraDashboard,program:window.SamaraProgram,validateList:api.validateList});render();}
 function schedule(){if(api){clearTimeout(timer);timer=setTimeout(refresh,250);}}
 function close(){if($('notifications-panel').open)$('notifications-panel').close();}
 async function mark(id){const item=notices.find(n=>n.id===id);if(!item||busy||!api.can(item.module))return;busy=true;$('notifications-error').textContent='';render();try{const result=await api.save([{id:item.id,version:item.version,module:item.module,read:!isRead(item)}],notices.map(n=>n.id));if(!api)return;reads=result.readState||{};refresh();}catch(error){if(api)$('notifications-error').textContent='No se guardó la lectura: '+(error.message||String(error));}finally{busy=false;render();}}
 function init(options){api=options;reads=options.readState||{};const dialog=$('notifications-panel'),toggle=$('notifications-toggle');toggle.onclick=()=>{refresh();if(dialog.open)close();else{dialog.showModal();toggle.setAttribute('aria-expanded','true');$('notifications-close').focus();}};$('notifications-close').onclick=close;dialog.addEventListener('close',()=>{toggle.setAttribute('aria-expanded','false');toggle.focus();});dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)close();}const r=event.target.closest('[data-notification-read]'),v=event.target.closest('[data-notification-review]');if(r)mark(r.dataset.notificationRead);if(v){const item=notices.find(n=>n.id===v.dataset.notificationReview);if(item&&api.can(item.module)){close();api.navigate(item.module,item.options);}}});
  for(const el of dialog.querySelectorAll('[data-notification-tab]')){el.addEventListener('click',()=>{tab=el.dataset.notificationTab;render();});el.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();tab=event.key==='Home'?'pending':event.key==='End'?'read':tab==='pending'?'read':'pending';render();$('notifications-'+tab+'-tab').focus();}});}
  $('notifications-refresh').onclick=refresh;refresh();
 }
 return {init,refresh,schedule,build,fingerprint,dispose:()=>{clearTimeout(timer);api=null;reads={};notices=[];}};
})();
</script>
