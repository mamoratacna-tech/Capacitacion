<style>
.program-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.program-filters{margin:22px 0}.program-filters label{display:grid;gap:7px}.program-filters input,.program-filters select,.program-dialog input:not([type=checkbox]),.program-dialog select,.program-dialog textarea{border:1px solid #d4e0e8;background:#fff;border-radius:6px;padding:10px;color:#28465b;font:inherit;max-width:100%;box-sizing:border-box}.program-note{color:#607a8e;font-size:12px;line-height:1.7}.program-summary{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.program-summary span{padding:14px 20px;background:white;border:1px solid #e0e8ee;border-radius:9px}.program-card{border:1px solid #dce6ed;border-radius:10px;background:#fff;margin:14px 0;padding:20px}.program-card header{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.program-card h3{margin:5px 0}.program-card small{color:#607a8e}.program-progress{height:6px;background:#edf2f5;border-radius:5px;margin:15px 0;overflow:hidden}.program-progress span{display:block;height:100%;background:#32a68d}.program-counts{display:flex;flex-wrap:wrap;gap:22px;margin:12px 0;color:#4b6477}.program-counts b{color:#153247;font-size:20px;display:block}.program-dialog{width:min(760px,calc(100vw - 32px));max-height:88vh;overflow:auto;padding:25px;border:0;border-radius:12px;box-sizing:border-box;color:#28465b}.program-dialog::backdrop{background:#12293e88}.program-dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.program-dialog label{display:grid;gap:7px;margin-bottom:16px}.program-dialog fieldset{border:1px solid #dce6ed;border-radius:8px;padding:15px;margin:15px 0}.program-months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.program-months label,.program-member{display:flex!important;align-items:center;gap:7px!important;font-size:12px;margin:0!important}.program-members{max-height:180px;overflow:auto;display:grid;gap:10px;padding:12px 0}.program-footer{justify-content:flex-end;margin-top:20px}#program-error{color:#bb263c}.program-people{width:100%;border-collapse:collapse;font-size:12px}.program-people th,.program-people td{white-space:normal;text-align:left;padding:10px 6px;border-bottom:1px solid #e1e8ed;overflow-wrap:anywhere}.program-table-scroll{overflow:auto}.program-empty{padding:25px;color:#607a8e;background:#fff;border:1px dashed #d4e0e8;border-radius:10px}.program-warning{color:#966022;font-size:12px}.program-print-sheet{font-family:Arial,sans-serif;color:#111;background:white}.program-print-sheet h1{font-size:21px;margin:0}.program-print-title{border:1px solid #111;padding:9px}.program-print-title small{display:block}.program-print-table{white-space:normal;width:100%;border-collapse:collapse;font-size:8px;table-layout:fixed}.program-print-table th,.program-print-table td{white-space:normal;color:#111;letter-spacing:normal;line-height:1.4;vertical-align:top;border:1px solid #777;padding:5px 3px;overflow-wrap:anywhere}.program-print-table th{background:#edf2f5}.program-print-table .program-print-course{width:19%}.program-print-table .program-print-pop{width:18%}.program-print-table tr{break-inside:avoid}.program-print-table thead{display:table-header-group}.program-print-table .program-planned{background:#e3f1eb;text-align:center}.program-print-sheet p{font-size:9px;line-height:1.5}@media(max-width:600px){.program-months{grid-template-columns:repeat(3,1fr)}.program-dialog{padding:18px}.program-filters label{width:100%}}
</style>
<script>
window.SamaraProgram=(()=>{
 'use strict';
 const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
 const n=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const $=id=>document.getElementById(id);
 const key=e=>n(e.no||e.curp||e.id);
 const name=e=>[e.names,e.paternal,e.maternal].filter(Boolean).join(' ')||e.nombre||e.no;
 const special=c=>Boolean(c.cmcapOnly||c.safetyCommissionOnly||c.emergencyBrigadesOnly);
 const direct=value=>{const v=n(value);return ['d','directo'].includes(v)?'D':['i','indirecto'].includes(v)?'I':'';};
 function population(context,course){
  const aliases=new Map();(context.departments||[]).forEach(d=>[d.name,...(d.aliases||[])].forEach(a=>aliases.set(n(a),n(d.name))));
  const dept=value=>aliases.get(n(value))||n(value),seen=new Set(),out=[],pairs=new Map();
  for(const p of context.positions){const pair=n(p.job)+'|'+dept(p.department);if(!pairs.has(pair))pairs.set(pair,[]);pairs.get(pair).push(p);}
  for(const e of context.employees){
   if(n(e.company||e.empresa||e.entity||'SAMARA')!=='samara'||['inactivo','baja'].includes(n(e.activeStatus||e.status||e._legacy?.estado||'Activo'))||!key(e)||seen.has(key(e)))continue;
   const rows=(pairs.get(n(e.position)+'|'+dept(e.department))||[]).filter(p=>direct(p.classification)&&(!direct(e.classification)||direct(e.classification)===direct(p.classification)));
   if(rows.some(p=>special(course)||(course.applicablePositions||[]).includes(p.id))){seen.add(key(e));out.push({...e,classification:direct(e.classification)||direct(rows[0].classification)});}
  }
  return out.sort((a,b)=>name(a).localeCompare(name(b),'es'));
 }
 function coverage(context,plan,month,cachedPopulation){
  const course=context.courses.find(c=>n(c.code)===n(plan.courseCode));
  if(!course)return {course:null,target:[],trained:[],review:[],pending:[],lists:[],unconfigured:true};
  const candidates=cachedPopulation||population(context,course),unconfigured=special(course)&&!Array.isArray(plan.memberKeys);
  const target=special(course)?candidates.filter(e=>(plan.memberKeys||[]).includes(key(e))):candidates;
  const confirmed=new Set(),reviewed=new Set(),lists=[],prefix=String(plan.year)+'-'+String(month).padStart(2,'0');
  const byNo=new Map(),byCurp=new Map();target.forEach(e=>{if(e.no)byNo.set(n(e.no),key(e));if(e.curp)byCurp.set(n(e.curp),key(e));});
  for(const list of context.attendance){
   if(n(list.cursoCodigo)!==n(plan.courseCode)||String(list.fecha||'').slice(0,7)!==prefix)continue;
   lists.push(list);
   for(const a of list.asistentes||[]){
    const person=byNo.get(n(a.numero))||byCurp.get(n(a.curp));if(!person||a.firmo!==true)continue;
    if(n(list.estado)==='validada'&&a.estado==='ok')confirmed.add(person);else reviewed.add(person);
   }
  }
  return {course,target,trained:target.filter(e=>confirmed.has(key(e))),review:target.filter(e=>!confirmed.has(key(e))&&reviewed.has(key(e))),pending:target.filter(e=>!confirmed.has(key(e))),lists,unconfigured};
 }
 let api,plans=[],busy=false;
 function selected(){const context=api.context(),cache=new Map();const y=Number($('program-year').value),m=Number($('program-month').value),q=n($('program-search').value);return plans.filter(p=>p.year===y).flatMap(p=>p.months.filter(month=>!m||m===month).map(month=>({plan:p,month,...coverage(context,p,month,(()=>{if(!cache.has(p.courseCode)){const course=context.courses.find(c=>n(c.code)===n(p.courseCode));cache.set(p.courseCode,course?population(context,course):[]);}return cache.get(p.courseCode);})())}))).filter(row=>n(row.plan.courseCode+' '+(row.course?.name||'')).includes(q)).sort((a,b)=>a.month-b.month||a.plan.courseCode.localeCompare(b.plan.courseCode,'es',{numeric:true}));}
 function counters(row){return '<div class="program-counts"><span><b>'+row.target.length+'</b>Población objetivo</span><span><b>'+row.trained.length+'</b>Capacitados</span><span><b>'+row.pending.length+'</b>Faltan de validar / capacitar</span><span><b>'+row.review.length+'</b>Con asistencia por revisar</span></div>';}
 function render(){
  if(!api||!$('view-program').classList.contains('active'))return;
  const rows=selected();$('program-summary').innerHTML='<span><b>'+rows.length+'</b> cursos / meses programados</span><span><b>'+rows.filter(r=>r.target.length&&r.trained.length===r.target.length).length+'</b> con cobertura completa</span>';
  $('program-list').innerHTML=rows.map(r=>'<article class="program-card"><header><div><small>'+MONTHS[r.month-1]+' '+r.plan.year+' · '+esc(r.plan.courseCode)+'</small><h3>'+esc(r.course?.name||'Curso no disponible en el glosario')+'</h3></div><div class="program-actions"><button class="button outline" data-program-detail="'+esc(r.plan.id)+'" data-month="'+r.month+'">Ver personas y listas</button><button class="button outline" data-program-edit="'+esc(r.plan.id)+'">Editar</button><button class="button outline" data-program-delete="'+esc(r.plan.id)+'" aria-label="Eliminar programación">×</button></div></header>'+counters(r)+'<div class="program-progress"><span style="width:'+(r.target.length?100*r.trained.length/r.target.length:0)+'%"></span></div><small>'+r.lists.length+' listas del mismo curso en este mes. '+(r.target.length?Math.round(100*r.trained.length/r.target.length)+'% de cobertura.':'Sin población objetivo activa.')+'</small>'+(special(r.course||{})?'<p class="program-warning">Curso de comisión o brigada: población definida por integrantes seleccionados.</p>':'')+(r.unconfigured?'<p class="program-warning">Revisa la configuración del curso y su población antes de evaluar el avance.</p>':'')+(r.plan.comments?'<p>'+esc(r.plan.comments)+'</p>':'')+'</article>').join('')||'<div class="program-empty">No hay cursos programados con estos filtros. Agrega un curso y selecciona sus meses.</div>';
  window.SamaraAccess?.apply($('view-program'));
 }
 function populationPreview(saved){
  const course=api.context().courses.find(c=>c.code===$('program-form').elements.courseCode.value),people=course?population(api.context(),course):[];
  $('program-population').innerHTML=course&&special(course)?'<p>Este curso aplica solo a integrantes de comisión o brigada. Selecciona a los integrantes; no se considera a toda la plantilla.</p><div class="program-members">'+people.map(e=>'<label class="program-member"><input type="checkbox" name="member" value="'+esc(key(e))+'" '+((saved?.memberKeys||[]).includes(key(e))?'checked':'')+'>'+esc(name(e)+' · '+e.position+' · '+e.department)+'</label>').join('')+'</div>':'<p class="program-note">'+people.length+' empleados activos de SAMARA cumplen puesto, departamento y clasificación en la matriz. La población se actualiza con el padrón.</p>';
 }
 function open(id){
  if(busy)return;const saved=plans.find(p=>p.id===id),f=$('program-form');f.reset();$('program-error').textContent='';
  f.elements.id.value=saved?.id||'';f.elements.year.value=saved?.year||$('program-year').value;
  f.elements.courseCode.innerHTML='<option value="">Selecciona un curso</option>'+api.context().courses.filter(c=>n(c.activeStatus||'Activo')!=='inactivo'||c.code===saved?.courseCode).sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true})).map(c=>'<option value="'+esc(c.code)+'">'+esc(c.code+' · '+c.name)+'</option>').join('');
  f.elements.courseCode.value=saved?.courseCode||'';f.elements.comments.value=saved?.comments||'';
  $('program-months').innerHTML=MONTHS.map((m,i)=>'<label><input type="checkbox" name="month" value="'+(i+1)+'" '+(saved?.months.includes(i+1)?'checked':'')+'>'+m+'</label>').join('');populationPreview(saved);$('program-dialog').showModal();
 }
 function detail(id,month){
  const plan=plans.find(p=>p.id===id);if(!plan)return;const r=coverage(api.context(),plan,month),trained=new Set(r.trained.map(key)),review=new Set(r.review.map(key));
  $('program-detail-body').innerHTML='<h3>'+esc(r.course?.name||plan.courseCode)+'</h3><p>'+MONTHS[month-1]+' '+plan.year+'</p>'+counters(r)+'<div class="program-table-scroll"><table class="program-people"><thead><tr><th>Empleado</th><th>Puesto / departamento</th><th>D / I</th><th>Seguimiento</th></tr></thead><tbody>'+r.target.map(e=>'<tr><td>'+esc(e.no+' · '+name(e))+'</td><td>'+esc(e.position)+'<br>'+esc(e.department)+'</td><td>'+esc(e.classification)+'</td><td>'+(trained.has(key(e))?'Capacitado':review.has(key(e))?'Asistencia por revisar':'Pendiente de capacitación')+'</td></tr>').join('')+'</tbody></table></div><h3>Listas vinculadas automáticamente</h3>'+(r.lists.map(l=>'<p>'+esc(l.fecha+' · '+(l.encabezado?.instructor||l.enc?.instructor||'')+' · '+l.estado)+' · '+(l.asistentes||[]).length+' asistentes</p>').join('')||'<p>Sin listas de asistencia de este curso en este mes.</p>');$('program-detail').showModal();
 }
 function printHtml(rows){
  const groups=new Map();rows.forEach(r=>{if(!groups.has(r.plan.id))groups.set(r.plan.id,[]);groups.get(r.plan.id).push(r);});
  return '<article class="program-print-sheet"><header class="program-print-title"><small>SAMARA · PROGRAMA DE CAPACITACIÓN · FT-RH-012 · Revisión A</small><h1>Programa de cursos '+esc($('program-year').value)+'</h1></header><p>Objetivo: programar por mes las capacitaciones aplicables a los puestos, departamentos y clasificación de la matriz.</p><table class="program-print-table"><thead><tr><th style="width:3%">No.</th><th class="program-print-course">Código / curso</th>'+MONTHS.map(m=>'<th>'+m.slice(0,3)+'</th>').join('')+'<th class="program-print-pop">Población / evidencia</th><th style="width:5%">SIRCE</th><th style="width:10%">Comentarios</th></tr></thead><tbody>'+[...groups.values()].map((items,i)=>{const r=items[0],people=[...new Set(r.target.map(e=>e.position+' · '+e.department+' · '+e.classification))];return '<tr><td>'+(i+1)+'</td><td>'+esc(r.plan.courseCode)+'<br>'+esc(r.course?.name||'Curso no disponible')+'</td>'+MONTHS.map((_,j)=>{const row=items.find(v=>v.month===j+1);return '<td'+(row?' class="program-planned"':'')+'>'+(row?'P<br>'+row.trained.length+'/'+row.target.length:'—')+'</td>';}).join('')+'<td>'+esc(people.join('; ')||'Sin población activa')+'<br>Asistencia: FT-RH-010 / listas validadas. Competencia: según expediente del curso.</td><td>'+esc(r.course?.sirce||'No')+'</td><td>'+esc(r.plan.comments||'')+'</td></tr>';}).join('')+'</tbody></table><p>P = mes programado. La fracción indica personas capacitadas / población objetivo activa actual. Solo se cuentan listas del mismo curso y mes, validadas con firma y asistente validado. No se duplican personas. Los cursos de comisión o brigada usan los integrantes seleccionados. Los filtros de pantalla se aplican a esta impresión. Sin fecha ni horario obligatorios.</p></article>';
 }
 function init(options){
  api=options;plans=api.load();$('program-year').value=new Intl.DateTimeFormat('en',{year:'numeric',timeZone:'America/Tijuana'}).format(new Date());$('program-month').insertAdjacentHTML('beforeend',MONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join(''));
  ['program-year','program-month','program-search'].forEach(id=>$(id).addEventListener('input',render));
  $('add-program').addEventListener('click',()=>open());$('program-form').elements.courseCode.addEventListener('change',()=>populationPreview());
  document.querySelectorAll('[data-program-close]').forEach(b=>b.addEventListener('click',()=>{if(!busy)b.closest('dialog').close();}));
  $('program-list').addEventListener('click',async event=>{const b=event.target.closest('button');if(!b||busy)return;if(b.dataset.programDetail)detail(b.dataset.programDetail,Number(b.dataset.month));if(b.dataset.programEdit)open(b.dataset.programEdit);if(b.dataset.programDelete&&await api.confirm('¿Eliminar esta programación y sus meses? Las listas de asistencia y el curso se conservan.')){busy=true;b.disabled=true;try{const next=plans.filter(p=>p.id!==b.dataset.programDelete);await api.save(next);plans=next;render();}catch(e){api.toast('No se guardó: '+e.message);}finally{busy=false;b.disabled=false;}}});
  $('program-form').addEventListener('submit',async event=>{
   event.preventDefault();if(busy)return;const f=event.target,form=new FormData(f),months=form.getAll('month').map(Number),course=api.context().courses.find(c=>c.code===form.get('courseCode')),year=Number(form.get('year')),id=form.get('id')||crypto.randomUUID();
   try{if(!course||!months.length||!Number.isInteger(year)||year<2000||year>2100)throw Error('Selecciona un curso, año y al menos un mes.');if(plans.some(p=>p.id!==id&&p.year===year&&p.courseCode===course.code))throw Error('Este curso ya está programado en ese año. Edita su programación para agregar o cambiar meses.');const memberKeys=form.getAll('member');if(special(course)&&!memberKeys.length)throw Error('Selecciona los integrantes de la comisión o brigada.');const record={id,year,courseCode:course.code,months,comments:String(form.get('comments')||'').trim()};if(special(course))record.memberKeys=memberKeys;const next=[...plans.filter(p=>p.id!==id),record];busy=true;f.querySelector('[type=submit]').disabled=true;await api.save(next);plans=next;$('program-dialog').close();render();api.toast('Programa mensual guardado.');}catch(e){$('program-error').textContent='No se guardó: '+e.message;}finally{busy=false;f.querySelector('[type=submit]').disabled=false;}
  });
  $('program-print').addEventListener('click',()=>{const rows=selected();if(!rows.length)return api.toast('No hay cursos programados para imprimir.');api.print(printHtml(rows));});
 }
 return {init,render,population,coverage};
})();
</script>
