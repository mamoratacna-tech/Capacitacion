<script>
window.SamaraCoursePicker=(()=>{
 const normalize=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
 function distance(a,b){let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,row[j]+1,row[j-1]+(a[i-1]===b[j-1]?0:1));row=next;}return row[b.length];}
 function rank(options,query){
  const q=normalize(query),tokens=q.split(' ').filter(Boolean);
  return options.filter(o=>o.value).map(o=>{const label=normalize(o.text),code=normalize(o.value),words=label.split(' ');let score=!q?0:code===q?1000:label.includes(q)?800-(label.indexOf(q)/100):0;
   if(q&&!score){let total=0;for(const token of tokens){if(words.some(w=>w.includes(token))){total+=100;continue;}const best=token.length>=4?Math.min(...words.filter(w=>Math.abs(w.length-token.length)<=2).map(w=>distance(token,w))):99;if(best<=Math.max(1,Math.floor(token.length/5)))total+=50-best;else return {o,score:-1};}score=total;}
   return {o,score};}).filter(r=>r.score>=0).sort((a,b)=>b.score-a.score||a.o.text.localeCompare(b.o.text,'es',{numeric:true})).slice(0,30).map(r=>r.o);
 }
 function bind(select,id){
  if(!select)return;if(select._coursePicker){select._coursePicker.sync();return;}
  const required=select.required;select.required=false;const host=document.createElement('div');host.className='course-picker';select.before(host);host.append(select);select.classList.add('course-picker-native');select.tabIndex=-1;select.setAttribute('aria-hidden','true');
  const input=document.createElement('input');input.id=id;input.type='search';input.autocomplete='off';input.placeholder='Buscar curso por nombre o código…';input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-expanded','false');input.setAttribute('aria-label','Buscar curso por nombre o código');input.required=required;host.append(input);if(host.closest('label'))host.closest('label').htmlFor=id;
  const list=document.createElement('div');list.id=id+'-results';list.className='course-picker-results';list.setAttribute('role','listbox');list.hidden=true;input.setAttribute('aria-controls',list.id);host.append(list);let results=[],active=-1;
  const sync=()=>{input.value=select.selectedOptions[0]?.value?select.selectedOptions[0].text:'';if(required)input.setCustomValidity(select.value?'':'Selecciona un curso de las sugerencias.');};
  const close=()=>{list.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');active=-1;};
  function choose(option){if(!option)return;select.value=option.value;sync();close();select.dispatchEvent(new Event('change',{bubbles:true}));}
  function highlight(){[...list.querySelectorAll('[role=option]')].forEach((el,i)=>{el.setAttribute('aria-selected',i===active?'true':'false');if(i===active){input.setAttribute('aria-activedescendant',el.id);el.scrollIntoView({block:'nearest'});}});}
  function show(){results=rank([...select.options],input.value);active=-1;list.replaceChildren();if(!results.length){const empty=document.createElement('p');empty.textContent='Sin coincidencias. Prueba otra palabra o el código.';list.append(empty);}results.forEach((option,i)=>{const button=document.createElement('button');button.type='button';button.id=id+'-option-'+i;button.setAttribute('role','option');button.setAttribute('aria-selected','false');button.textContent=option.text;button.addEventListener('pointerdown',e=>e.preventDefault());button.addEventListener('click',()=>choose(option));list.append(button);});list.hidden=false;input.setAttribute('aria-expanded','true');}
  input.addEventListener('input',()=>{const query=input.value;if(select.value){select.value='';select.dispatchEvent(new Event('change',{bubbles:true}));}input.value=query;show();});input.addEventListener('focus',()=>{input.select();show();});input.addEventListener('blur',()=>{setTimeout(()=>{if(!host.contains(document.activeElement))close();},120);});
  input.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!list.hidden){event.preventDefault();event.stopPropagation();close();}}else if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();if(list.hidden)show();active=Math.max(0,Math.min(results.length-1,active+(event.key==='ArrowDown'?1:-1)));highlight();}else if(event.key==='Enter'&&!list.hidden){event.preventDefault();choose(results[active<0?0:active]);}});
  select.addEventListener('change',sync);select._coursePicker={sync};sync();
 }
 return {bind,rank};
})();

window.SamaraProgram=(()=>{
 'use strict';
 const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
 const n=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const $=id=>document.getElementById(id);
 const key=e=>n(e.no||e.curp||e.id);
 const name=e=>[e.names,e.paternal,e.maternal].filter(Boolean).join(' ')||e.nombre||e.no;
 const special=c=>Boolean(c.cmcapOnly||c.safetyCommissionOnly||c.emergencyBrigadesOnly);
 const direct=value=>{const v=n(value);return ['d','directo'].includes(v)?'D':['i','indirecto'].includes(v)?'I':'';};
 function population(context,course){
  const aliases=new Map();(context.departments||[]).forEach(d=>[d.name,...(d.aliases||[])].forEach(a=>aliases.set(n(a),n(d.name))));
  const dept=value=>aliases.get(n(value))||n(value),seen=new Set(),out=[],pairs=new Map();
  for(const p of context.positions){const pair=n(p.job)+'|'+dept(p.department);if(!pairs.has(pair))pairs.set(pair,[]);pairs.get(pair).push(p);}
  for(const e of context.employees){
   if(n(e.company||e.empresa||e.entity||'SAMARA')!=='samara'||['inactivo','baja'].includes(n(e.activeStatus||e.status||e._legacy?.estado||'Activo'))||!key(e)||seen.has(key(e)))continue;
   const rows=(pairs.get(n(e.position)+'|'+dept(e.department))||[]).filter(p=>direct(p.classification)&&(!direct(e.classification)||direct(e.classification)===direct(p.classification)));
   if(rows.some(p=>special(course)||(course.applicablePositions||[]).includes(p.id))){seen.add(key(e));out.push({...e,classification:direct(e.classification)||direct(rows[0].classification)});}
  }
  return out.sort((a,b)=>name(a).localeCompare(name(b),'es'));
 }
 function coverage(context,plan,month,cachedPopulation){
  const course=context.courses.find(c=>n(c.code)===n(plan.courseCode));
  if(!course)return {course:null,target:[],trained:[],review:[],pending:[],lists:[],unconfigured:true};
  const candidates=cachedPopulation||population(context,course),unconfigured=special(course)&&!Array.isArray(plan.memberKeys);
  const target=special(course)?candidates.filter(e=>(plan.memberKeys||[]).includes(key(e))):candidates;
  const confirmed=new Set(),reviewed=new Set(),lists=[],months=new Set(plan.months.filter(value=>!month||value<=month));
  const byNo=new Map(),byCurp=new Map();target.forEach(e=>{if(e.no)byNo.set(n(e.no),key(e));if(e.curp)byCurp.set(n(e.curp),key(e));});
  for(const list of context.attendance){
   const date=String(list.fecha||'');if(n(list.cursoCodigo)!==n(plan.courseCode)||Number(date.slice(0,4))!==Number(plan.year)||!months.has(Number(date.slice(5,7))))continue;
   lists.push(list);
   for(const a of list.asistentes||[]){
    const person=byNo.get(n(a.numero))||byCurp.get(n(a.curp));if(!person||a.firmo!==true)continue;
    if(n(list.estado)==='validada'&&a.estado==='ok')confirmed.add(person);else reviewed.add(person);
   }
  }
  return {course,target,trained:target.filter(e=>confirmed.has(key(e))),review:target.filter(e=>!confirmed.has(key(e))&&reviewed.has(key(e))),pending:target.filter(e=>!confirmed.has(key(e))),lists,unconfigured};
 }
 let api,plans=[],busy=false,years={};
 const period=plan=>plan.months.slice().sort((a,b)=>a-b).map(m=>MONTHS[m-1]).join(', ')+' '+plan.year;
 function selected(){
  const context=api.context(),m=Number($('program-month').value),q=n($('program-search').value);
  return plans.filter(p=>!m||p.months.includes(m)).map(p=>({plan:p,...coverage(context,p)})).filter(row=>n(row.plan.courseCode+' '+(row.course?.name||'')).includes(q)).sort((a,b)=>b.plan.year-a.plan.year||Math.min(...a.plan.months)-Math.min(...b.plan.months)||a.plan.courseCode.localeCompare(b.plan.courseCode,'es',{numeric:true}));
 }
 function counters(row){return '<div class="program-counts"><span><b>'+row.target.length+'</b>Población objetivo</span><span><b>'+row.trained.length+'</b>Capacitados</span><span><b>'+row.pending.length+'</b>Faltan de validar / capacitar</span><span><b>'+row.review.length+'</b>Con asistencia por revisar</span></div>';}
 function render(){
  if(!api||!$('view-program').classList.contains('active'))return;
  const rows=selected();$('program-summary').innerHTML='<span><b>'+rows.length+'</b> cursos programados</span><span><b>'+rows.filter(r=>r.target.length&&r.trained.length===r.target.length).length+'</b> con cobertura completa</span>';
  const groups=new Map();rows.forEach(row=>{if(!groups.has(row.plan.year))groups.set(row.plan.year,[]);groups.get(row.plan.year).push(row);});
  $('program-list').innerHTML=[...groups.entries()].map(([year,items],index)=>'<details class="program-year" data-program-year="'+year+'" '+((years[year]??index===0)?'open':'')+'><summary><b>'+year+'</b><span>'+items.length+' curso'+(items.length===1?'':'s')+'</span><button type="button" class="button outline" data-program-print-year="'+year+'">Imprimir año</button></summary>'+items.map(r=>'<article class="program-card"><header><div><small>'+esc(period(r.plan))+' · '+esc(r.plan.courseCode)+'</small><h3>'+esc(r.course?.name||'Curso no disponible en el glosario')+'</h3></div><div class="program-actions"><button class="button outline" data-program-detail="'+esc(r.plan.id)+'">Ver personas y listas</button><button class="button outline" data-program-edit="'+esc(r.plan.id)+'">Editar</button><button class="button outline" data-program-delete="'+esc(r.plan.id)+'" aria-label="Eliminar programación">×</button></div></header>'+counters(r)+'<div class="program-progress"><span style="width:'+(r.target.length?100*r.trained.length/r.target.length:0)+'%"></span></div><small>'+r.lists.length+' listas del curso durante los meses seleccionados. '+(r.target.length?Math.round(100*r.trained.length/r.target.length)+'% de cobertura acumulada.':'Sin población objetivo activa.')+'</small>'+(special(r.course||{})?'<p class="program-warning">Curso de comisión o brigada: población definida por integrantes seleccionados.</p>':'')+(r.unconfigured?'<p class="program-warning">Revisa la configuración del curso y su población antes de evaluar el avance.</p>':'')+(r.plan.comments?'<p>'+esc(r.plan.comments)+'</p>':'')+'</article>').join('')+'</details>').join('')||'<div class="program-empty">No hay cursos programados con estos filtros. Agrega un curso y selecciona sus meses.</div>';
  window.SamaraAccess?.apply($('view-program'));
 }
 function populationPreview(saved){
  const course=api.context().courses.find(c=>c.code===$('program-form').elements.courseCode.value),people=course?population(api.context(),course):[];
  $('program-population').innerHTML=course&&special(course)?'<p>Este curso aplica solo a integrantes de comisión o brigada. Selecciona a los integrantes; no se considera a toda la plantilla.</p><div class="program-members">'+people.map(e=>'<label class="program-member"><input type="checkbox" name="member" value="'+esc(key(e))+'" '+((saved?.memberKeys||[]).includes(key(e))?'checked':'')+'>'+esc(name(e)+' · '+e.position+' · '+e.department)+'</label>').join('')+'</div>':'<p class="program-note">'+people.length+' empleados activos de SAMARA cumplen puesto, departamento y clasificación en la matriz. La población se actualiza con el padrón.</p>';
 }
 function open(id){
  if(busy)return;const saved=plans.find(p=>p.id===id),f=$('program-form');f.reset();$('program-error').textContent='';
  f.elements.id.value=saved?.id||'';f.elements.year.value=saved?.year||new Intl.DateTimeFormat('en',{year:'numeric',timeZone:'America/Tijuana'}).format(new Date());
  f.elements.courseCode.innerHTML='<option value="">Selecciona un curso</option>'+api.context().courses.filter(c=>n(c.activeStatus||'Activo')!=='inactivo'||c.code===saved?.courseCode).sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true})).map(c=>'<option value="'+esc(c.code)+'">'+esc(c.code+' · '+c.name)+'</option>').join('');
  f.elements.courseCode.value=saved?.courseCode||'';f.elements.comments.value=saved?.comments||'';
  $('program-months').innerHTML=MONTHS.map((m,i)=>'<label><input type="checkbox" name="month" value="'+(i+1)+'" '+(saved?.months.includes(i+1)?'checked':'')+'>'+m+'</label>').join('');populationPreview(saved);window.SamaraCoursePicker.bind(f.elements.courseCode,'program-course-search');$('program-dialog').showModal();
 }
 function detail(id){
  const plan=plans.find(p=>p.id===id);if(!plan)return;const r=coverage(api.context(),plan),trained=new Set(r.trained.map(key)),review=new Set(r.review.map(key));
  $('program-detail-body').innerHTML='<div class="program-actions"><button type="button" class="button outline" data-program-pending="'+esc(plan.id)+'">Exportar pendientes CSV</button></div><h3>'+esc(r.course?.name||plan.courseCode)+'</h3><p>'+esc(period(plan))+'</p>'+counters(r)+'<div class="program-table-scroll"><table class="program-people"><thead><tr><th>Empleado</th><th>Puesto / departamento</th><th>D / I</th><th>Seguimiento</th></tr></thead><tbody>'+r.target.map(e=>'<tr><td>'+esc(e.no+' · '+name(e))+'</td><td>'+esc(e.position)+'<br>'+esc(e.department)+'</td><td>'+esc(e.classification)+'</td><td>'+(trained.has(key(e))?'Capacitado':review.has(key(e))?'Asistencia por revisar':'Pendiente de capacitación')+'</td></tr>').join('')+'</tbody></table></div><h3>Listas vinculadas automáticamente</h3>'+(r.lists.map(l=>'<p>'+esc(l.fecha+' · '+(l.encabezado?.instructor||l.enc?.instructor||'')+' · '+l.estado)+' · '+(l.asistentes||[]).length+' asistentes</p>').join('')||'<p>Sin listas de asistencia de este curso durante los meses seleccionados.</p>');$('program-detail').showModal();
 }
 function courseEvidence(course){const raw=n(course.competenceEvidence??course.program?.competence??'');return {attendance:'Listado de asistencia',competence:raw.includes('carta')?'Carta acreditación':raw.includes('evaluacion')?'Evaluación escrita / virtual':'No aplica'};}
 function printPopulation(context,course){
  if(special(course)){const groups=[];if(course.cmcapOnly)groups.push('CMCAP');if(course.safetyCommissionOnly)groups.push('COMISIÓN DE SEGURIDAD E HIGIENE');if(course.emergencyBrigadesOnly)groups.push('BRIGADAS');return 'SOLO INTEGRANTES DE '+groups.join(' / ');}
  const positions=context.positions.filter(p=>!['inactivo','baja'].includes(n(p.activeStatus||p.status||'Activo'))),assigned=positions.filter(p=>(course.applicablePositions||[]).includes(p.id));
  if(positions.length&&assigned.length===positions.length)return 'TODOS LOS PUESTOS';
  return [...new Set(assigned.map(p=>p.job))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true})).join(', ')||'SIN PUESTOS ACTIVOS ASIGNADOS';
 }
 function periodDates(plan){const first=Math.min(...plan.months),last=Math.max(...plan.months);return ['01-'+MONTHS[first-1]+'-'+plan.year,String(new Date(Date.UTC(plan.year,last,0)).getUTCDate()).padStart(2,'0')+'-'+MONTHS[last-1]+'-'+plan.year];}
 function pendingRows(context,plan){const r=coverage(context,plan),review=new Set(r.review.map(key));return [['Año','Meses del periodo','Código del curso','Curso','Número de empleado','Nombre','Puesto','Departamento','Clasificación','Seguimiento'],...r.pending.map(e=>[plan.year,plan.months.map(m=>MONTHS[m-1]).join(', '),plan.courseCode,r.course?.name||'',e.no||'',name(e),e.position||'',e.department||'',e.classification||'',review.has(key(e))?'Asistencia por revisar':'Pendiente de capacitación'])];}
 function csvText(rows){return '\uFEFF'+rows.map(row=>row.map(value=>{let text=String(value??'');if(/^[\s]*[=+@-]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
 function printHtml(rows){
  const context=api.context(),groups=new Map();rows.forEach(r=>{if(!groups.has(r.plan.year))groups.set(r.plan.year,[]);groups.get(r.plan.year).push(r);});
  const widths=[1.2,7.5,...MONTHS.map(()=>25/12),26,7,10,5,5,3.5,9.8];
  return [...groups.entries()].map(([year,items])=>'<article class="program-print-sheet ft012-sheet"><table class="program-print-table ft012-table"><colgroup>'+widths.map(width=>'<col style="width:'+width+'%">').join('')+'</colgroup><thead><tr><td colspan="21" class="ft012-banner"><span>Samara</span><h1>PROGRAMA ANUAL DE CAPACITACIÓN</h1><div><span>Formato: FT-RH-012</span><span>Revisión A</span></div></td></tr><tr><td colspan="21" class="ft012-objective"><b>CALENDARIO ANUAL DE CAPACITACIÓN DE ENERO A DICIEMBRE DE '+year+'</b><br>Objetivo: Proporcionar capacitación para el desarrollo continuo de nuestros colaboradores, creando con ello el crecimiento y mejoras en los procesos de producción.</td></tr><tr class="ft012-columns"><th>No</th><th>Código</th>'+MONTHS.map(m=>'<th class="ft012-month"><span>'+m+'</span></th>').join('')+'<th>POBLACIÓN (Puestos / categorías) DIRIGIDO:</th><th>Evidencia asistencia</th><th>Evidencia competencia ((E) Evaluación escrita/virtual, (C) Carta acreditación)</th><th>Fecha de inicio</th><th>Fecha Fin</th><th>SIRCE</th><th>Comentarios</th></tr></thead><tbody>'+items.slice().sort((a,b)=>a.plan.courseCode.localeCompare(b.plan.courseCode,'es',{numeric:true})).map((r,i)=>{const c=r.course||{},dates=periodDates(r.plan);return '<tr><td>'+(i+1)+'</td><td>'+esc(r.plan.courseCode)+'</td>'+MONTHS.map((_,j)=>'<td class="ft012-check">'+(r.plan.months.includes(j+1)?'✓':'')+'</td>').join('')+'<td class="ft012-population">'+esc(printPopulation(context,c))+'</td><td>'+esc(courseEvidence(c).attendance)+'</td><td>'+esc(courseEvidence(c).competence)+'</td><td>'+dates[0]+'</td><td>'+dates[1]+'</td><td>'+esc(typeof c.sirce==='boolean'?(c.sirce?'Sí':'No'):c.sirce||'No')+'</td><td>'+esc(r.plan.comments||c.program?.comments||'')+'</td></tr>';}).join('')+'</tbody></table></article>').join('');
 }
 function init(options){
  api=options;plans=api.load();$('program-month').insertAdjacentHTML('beforeend',MONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join(''));
  ['program-month','program-search'].forEach(id=>$(id).addEventListener('input',render));
  $('program-list').addEventListener('toggle',event=>{if(event.target.matches('.program-year'))years[event.target.dataset.programYear]=event.target.open;},true);
  $('add-program').addEventListener('click',()=>open());$('program-form').elements.courseCode.addEventListener('change',()=>populationPreview());
  document.querySelectorAll('[data-program-close]').forEach(b=>b.addEventListener('click',()=>{if(!busy)b.closest('dialog').close();}));
  $('program-list').addEventListener('click',async event=>{const b=event.target.closest('button');if(!b||busy)return;if(b.dataset.programPrintYear){event.preventDefault();api.print(printHtml(selected().filter(row=>row.plan.year===Number(b.dataset.programPrintYear))));return;}if(b.dataset.programDetail)detail(b.dataset.programDetail);if(b.dataset.programEdit)open(b.dataset.programEdit);if(b.dataset.programDelete&&await api.confirm('¿Eliminar esta programación y sus meses? Las listas de asistencia y el curso se conservan.')){busy=true;b.disabled=true;try{const next=plans.filter(p=>p.id!==b.dataset.programDelete);await api.save(next);plans=next;render();}catch(e){api.toast('No se guardó: '+e.message);}finally{busy=false;b.disabled=false;}}});
  $('program-form').addEventListener('submit',async event=>{
   event.preventDefault();if(busy)return;const f=event.target,form=new FormData(f),months=form.getAll('month').map(Number),course=api.context().courses.find(c=>c.code===form.get('courseCode')),year=Number(form.get('year')),id=form.get('id')||crypto.randomUUID();
   try{if(!course||!months.length||!Number.isInteger(year)||year<2000||year>2100)throw Error('Selecciona un curso, año y al menos un mes.');if(plans.some(p=>p.id!==id&&p.year===year&&p.courseCode===course.code))throw Error('Este curso ya está programado en ese año. Edita su programación para agregar o cambiar meses.');const memberKeys=form.getAll('member');if(special(course)&&!memberKeys.length)throw Error('Selecciona los integrantes de la comisión o brigada.');years[year]=true;const record={id,year,courseCode:course.code,months,comments:String(form.get('comments')||'').trim()};if(special(course))record.memberKeys=memberKeys;const next=[...plans.filter(p=>p.id!==id),record];busy=true;f.querySelector('[type=submit]').disabled=true;await api.save(next);plans=next;$('program-dialog').close();render();api.toast('Programa mensual guardado.');}catch(e){$('program-error').textContent='No se guardó: '+e.message;}finally{busy=false;f.querySelector('[type=submit]').disabled=false;}
  });
  $('program-detail-body').addEventListener('click',async event=>{const button=event.target.closest('[data-program-pending]');if(!button)return;const plan=plans.find(p=>p.id===button.dataset.programPending);if(!plan)return;button.disabled=true;try{await window.descargarArchivo(new Blob([csvText(pendingRows(api.context(),plan))],{type:'text/csv;charset=utf-8;'}),'PENDIENTES-'+plan.courseCode+'-'+plan.year+'.csv');}catch(error){api.toast('No se pudo descargar: '+error.message);}finally{button.disabled=false;}});
  $('program-print').addEventListener('click',()=>{const rows=selected();if(!rows.length)return api.toast('No hay cursos programados para imprimir.');api.print(printHtml(rows));});
 }
 return {init,render,population,coverage,printPopulation,periodDates,pendingRows,csvText,courseEvidence};
})();
</script>
