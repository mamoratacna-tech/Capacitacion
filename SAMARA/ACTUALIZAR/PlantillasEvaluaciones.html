<script>
window.EvaluationTemplates=(()=>{
 const xml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
 async function prepare(row,employee){
  if(!window.JSZip)throw Error('No se cargó la herramienta de archivos. Recarga la aplicación.');
  const key=row.classification==='D'?'direct':row.kind==='mid'?'mid':'review',extension=key==='direct'?'xlsx':'docx',zip=await JSZip.loadAsync(window.SAMARA_EVALUATION_TEMPLATES[key],{base64:true});
  const values={no:row.no,name:row.employeeName,position:row.position,department:row.department,plant:row.plant,supervisor:row.supervisor,hireDate:employee.hireDate||'',type:window.SamaraEvaluations.format(row)+' · '+({mid:'Mitad de periodo',renewal:'Renovación',annual:'Anual'}[row.kind]),due:row.completedDate||row.scheduledDate,periodStart:row.periodStart||row.contractStart||'',periodEnd:row.periodEnd||row.contractEnd||''};
  const file=key==='direct'?'xl/worksheets/sheet1.xml':'word/document.xml';let source=await zip.file(file).async('string');source=source.replace(/\{\{(\w+)\}\}/g,(_,name)=>xml(values[name]||''));zip.file(file,source);
  const blob=await zip.generateAsync({type:'blob',mimeType:key==='direct'?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});return {blob,extension};
 }
 async function download(row,employee){const result=await prepare(row,employee);await window.descargarArchivo(result.blob,'Evaluacion-'+String(row.no).replace(/[^a-z0-9-]/gi,'')+'-'+row.kind+'-'+row.scheduledDate+'.'+result.extension);}
 return {prepare,download};
})();
</script>
