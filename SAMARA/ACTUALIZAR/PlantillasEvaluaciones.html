  const doc=parse(source),body=doc.getElementsByTagNameNS(W,'body')[0],previous=body.lastElementChild;if(!previous||previous.localName!=='sectPr')throw Error('No se encontró la sección final del documento Word.');

 async function prepare(row,employee,context={}){
  if(!window.JSZip)throw Error('No se cargó la herramienta de archivos. Recarga la aplicación.');
  const key=window.SamaraEvaluations.formatKey(row),extension=key==='direct'?'xlsx':'docx',zip=await JSZip.loadAsync(window.SAMARA_EVALUATION_TEMPLATES[key],{base64:true});
  const training=window.SamaraEvaluations.periodTraining(row,employee,context);if(!training.valid)throw Error('Captura un periodo a evaluar válido (Desde y Hasta) en Actualizar estado antes de imprimir.');
  const values={no:row.no,name:row.employeeName,position:row.position,department:row.department,plant:row.plant,supervisor:row.supervisor,hireDate:row.contractStart||employee.contractStart||employee.hireDate||'',type:({mid:'Mitad de periodo',renewal:'Renovación',annual:'Anual'}[row.kind]),due:row.completedDate||row.scheduledDate,periodStart:training.start,periodEnd:training.end};
  if(key!=='direct')for(const name of ['hireDate','due','periodStart','periodEnd'])if(window.SamaraEvaluations.date(values[name]))values[name]=values[name].split('-').reverse().join('/');
  values.trainingPeriod=training.start.split('-').reverse().join('/')+' al '+training.end.split('-').reverse().join('/');values.trainingContinuation=training.courses.length>4?'(continúa en hoja Capacitación)':'';for(let i=0;i<4;i++){const course=training.courses[i];values['trainingDate'+(i+1)]=course?course.date.split('-').reverse().join('/'):'';values['trainingCourse'+(i+1)]=course?course.name:'';}
  const file=key==='direct'?'xl/worksheets/sheet1.xml':'word/document.xml';let source=await zip.file(file).async('string');source=source.replace(/\{\{(\w+)\}\}/g,(_,name)=>xml(values[name]||''));if(key!=='direct')source=await wordAnnex(zip,source,row,training);zip.file(file,source);
  if(key==='direct'&&training.courses.length>4)await trainingSheet(zip,row,training);
  const blob=await zip.generateAsync({type:'blob',mimeType:key==='direct'?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});return {blob,extension};
 }
 async function download(row,employee,context){const result=await prepare(row,employee,context);await window.descargarArchivo(result.blob,'Evaluacion-'+String(row.no).replace(/[^a-z0-9-]/gi,'')+'-'+row.kind+'-'+row.scheduledDate+'.'+result.extension);}
 async function downloadWord(row,employee,context,{canDownload=()=>true}={}){
  if(row.classification!=='I'||window.SamaraEvaluations.formatKey(row)==='direct')throw Error('Word está disponible para Performance Review y Mitad de periodo del personal indirecto.');
  const result=await prepare(row,employee,context);if(result.extension!=='docx')throw Error('No se pudo preparar el archivo Word.');if(!canDownload())return false;
  await window.descargarArchivo(result.blob,'Evaluacion-'+String(row.no).replace(/[^a-z0-9-]/gi,'')+'-'+row.kind+'-'+row.scheduledDate+'.docx');
