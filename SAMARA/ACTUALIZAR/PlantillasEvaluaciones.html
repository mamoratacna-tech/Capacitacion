 async function prepare(row,employee,context={}){

  const key=window.SamaraEvaluations.formatKey(row),extension=key==='direct'?'xlsx':'docx',zip=await JSZip.loadAsync(window.SAMARA_EVALUATION_TEMPLATES[key],{base64:true});
  const training=window.SamaraEvaluations.periodTraining(row,employee,context);if(!training.valid)throw Error('Captura un periodo a evaluar válido (Desde y Hasta) en Actualizar estado antes de imprimir.');
  const values={no:row.no,name:row.employeeName,position:row.position,department:row.department,plant:row.plant,supervisor:row.supervisor,hireDate:row.contractStart||employee.contractStart||employee.hireDate||'',type:({mid:'Mitad de periodo',renewal:'Renovación',annual:'Anual',promotion:'Promoción'}[row.kind]),due:row.completedDate||row.scheduledDate,periodStart:training.start,periodEnd:training.end};
  values.proposedPosition=row.kind==='promotion'?row.proposedPosition:'';values.proposedPositionCode=row.kind==='promotion'?row.proposedPositionCode||'':'';values.proposedSalary=row.kind==='promotion'&&row.proposedSalary?window.SamaraEvaluations.salaryText(row.proposedSalary):'__________';
  if(key!=='direct')for(const name of ['hireDate','due','periodStart','periodEnd'])if(window.SamaraEvaluations.date(values[name]))values[name]=values[name].split('-').reverse().join('/');
  values.trainingPeriod=training.start.split('-').reverse().join('/')+' al '+training.end.split('-').reverse().join('/');values.trainingContinuation=training.courses.length>4?'(continúa en hoja Capacitación)':'';for(let i=0;i<4;i++){const course=training.courses[i];values['trainingDate'+(i+1)]=course?course.date.split('-').reverse().join('/'):'';values['trainingCourse'+(i+1)]=course?course.name:'';}
  const file=key==='direct'?'xl/worksheets/sheet1.xml':'word/document.xml';let source=await zip.file(file).async('string');source=source.replace(/\{\{(\w+)\}\}/g,(_,name)=>xml(values[name]||''));if(key!=='direct')source=await wordAnnex(zip,source,row,training);zip.file(file,source);

 }
