<script>

  const scoreCourse=c=>{const code=normalize(c.code||c.codigo),name=normalize(c.name||c.nombre),tokens=words(name);if(code&&(' '+all+' ').includes(' '+code+' '))return 3;if(name&&(' '+all+' ').includes(' '+name+' '))return 2;const coverage=tokens.length?tokens.filter(t=>(' '+all+' ').includes(' '+t+' ')).length/tokens.length:0;return tokens.length>=3&&coverage>=.85?coverage:0;};

   if(!response.ok)throw Error('No se pudo descargar el idioma del lector local. Revisa la conexión y reintenta esta página.');
   await response.arrayBuffer();

    window.Tesseract.createWorker('spa',1,{langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/spa@1.0.0/4.0.0_best_int',workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0',errorHandler:error=>{failed=true;reject(Error('Falló el lector local: '+String(error)));},logger:m=>{if(progress)progress(m.status==='recognizing text'?'Leyendo página escaneada… '+Math.round((m.progress||0)*100)+'%':'Preparando lector local…');}}).then(value=>{if(failed)value.terminate();else resolve(value);},reject);

 async function open(file){
