    S.cursos=(d.gl||[]).filter(r=>r[1]&&r[2]).map(r=>({codigo:String(r[1]).trim(),nombre:String(r[2]).trim(),duracion:String(r[3]||'').trim(),instructor:String(r[4]||'').trim(),modalidad:String(r[5]||'').trim(),clasificacion:String(r[6]||'').trim(),objetivo:String(r[10]||'').trim(),area:String(r[13]||'').trim(),sirce:/^s/i.test(String(r[14]||'').trim())}));
    S.bd={};(d.bd||[]).forEach(r=>{const n=String(r[0]||'').trim();if(n)S.bd[n]={curp:String(r[1]||'').trim().toUpperCase(),nombres:String(r[2]||'').trim(),paterno:String(r[3]||'').trim(),materno:String(r[4]||'').trim()}});
    S.instructores=(d.ins||[]).filter(i=>i.nombre).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
    S.sesiones=(d.listados||[]).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    S.altas=d.altas||[];S.cargaError='';
  }catch(e){S.cargaError='No se pudo cargar la información: '+errTxt(e)}
  armarPadron();
}
function autorizado(i,cod){if(!i)return false;if(i.tipo==='Externo'&&!(i.cursos||[]).length)return true;const c=C(cod);return (i.cursos||[]).includes(cod)||(c?(i.cursosNombres||[]).some(n=>sim(n,c.nombre)>=.7&&sim(c.nombre,n)>=.7):false)}

/* ---------- reglas ---------- */
function est(a){const p=S.padron[a.numero];if(!p)return['wa','Número no existe'];if(!a.firmo)return['no','Sin firma'];if(a.ok)return['ok','Validado'];if(!a.escrito||sim(a.escrito,p.nombre)>=.5)return['ok',!a.escrito||sim(a.escrito,p.nombre)>=.99?'Coincide':'Nombre ajustado'];return['wa','Nombre no coincide']}
function candidatos(a,n=3){const q=a.escrito||'';if(!q)return[];return S.padronList.map(p=>({p,s:sim(q,p.nombre)+(a.numero&&p.numero.slice(0,3)===a.numero.slice(0,3)?.15:0)})).filter(x=>x.s>=.5).sort((x,y)=>y.s-x.s).slice(0,n).map(x=>x.p)}
function buscarIns(nombre){if(!nombre)return null;let b=null,bs=0;S.instructores.forEach(i=>{const s=Math.min(sim(nombre,i.nombre),sim(i.nombre,nombre)+.25);if(s>bs){bs=s;b=i}});return bs>=.6?b:null}
function estadoIns(){const e=S.ed,i=INS(e.enc.instructorId);if(!i)return e.enc.instructor?{t:'noreg',msg:`El instructor “${e.enc.instructor}” no está registrado.`}:{t:'vacio',msg:'Elige al instructor o dalo de alta.'};if(e.cursoCodigo&&!autorizado(i,e.cursoCodigo))return{t:'noaut',msg:`${i.nombre} no tiene autorizado este curso.`,i};return{t:'ok',i}}
const HCAMPOS=[['duracion','Duración (horas)'],['clasificacion','Clasificación del instructor'],['registro','Registro STPS / Estándar'],['rfc','RFC instructor / institución'],['area','Área temática DC-3'],['objetivo','Objetivo DC-2'],['modalidad','Modalidad'],['lugar','Lugar']];
function catVal(k,c){if(!c)return null;if(k==='duracion')return String(parseFloat(c.duracion)||'');if(k==='clasificacion')return c.clasificacion;if(k==='area')return c.area.trim();if(k==='objetivo'){const i=objIdx(c.objetivo);return i>=0?String(i):null}if(k==='modalidad')return c.modalidad;return null}
function coincide(k,v,cv){if(cv==null||cv==='')return null;if(!v)return false;if(k==='duracion')return parseFloat(v)===parseFloat(cv);if(k==='area')return norm(v).slice(0,4)===norm(cv).slice(0,4);if(k==='modalidad'){const m=norm(cv).replace('en linea','online');return m.includes(norm(v))||(norm(v)==='mixta'&&m.includes(','))}return norm(v)===norm(cv)}
function opciones(k,v){const set=new Set(),c=C(S.ed.cursoCodigo),cv=catVal(k,c);
  if(k==='duracion'){HORAS.forEach(h=>set.add(h));if(cv)set.add(cv)}if(k==='clasificacion'){set.add('Interno');set.add('Externo')}
  if(k==='area')S.cursos.forEach(x=>x.area&&set.add(x.area.trim()));if(k==='modalidad')MODS.forEach(m=>set.add(m));if(k==='lugar')LUG.forEach(m=>set.add(m));if(v)set.add(v);
  if(k==='objetivo')return `<option value="">Sin marcar</option>`+OBJ_CORTO.map((o,i)=>`<option value="${i}" ${String(v)===String(i)?'selected':''}>${esc(o)}</option>`).join('');
  return `<option value="">Sin dato</option>`+[...set].sort((a,b)=>k==='duracion'?parseFloat(a)-parseFloat(b):a.localeCompare(b,'es')).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}
const catTexto=(k,cv)=>k==='objetivo'?OBJ_CORTO[cv]||cv:k==='duracion'?cv+' h':cv;
function bloqueos(){const e=S.ed,b=[];if(!e.cursoCodigo)b.push('Elige el curso del glosario.');const ins=estadoIns();if(ins.t!=='ok')b.push(ins.msg);const nx=e.asistentes.filter(a=>!S.padron[a.numero]).length;if(nx)b.push(`${nx} colaborador${nx>1?'es':''} sin registro en el padrón: elige al correcto o dalo de alta.`);if(!e.asistentes.length)b.push('Agrega al menos un asistente.');return b}
function avisos(){const e=S.ed,c=C(e.cursoCodigo);return e.asistentes.filter(a=>S.padron[a.numero]&&est(a)[0]==='wa').length+HCAMPOS.filter(([k])=>coincide(k,e.enc[k],catVal(k,c))===false&&!e.encOk[k]).length}

  const c=C(e.cursoCodigo),w=avisos();
  const doc={cursoCodigo:e.cursoCodigo,cursoNombre:c?c.nombre:'',sirce:!!(c&&c.sirce),fecha:e.fecha||hoy(),encabezado:{...e.enc},encabezadoAceptado:{...e.encOk},listaCurso:e.lista.curso||'',leidaDeFoto:!!e.leida,
    asistentes:e.asistentes.map(a=>{const p=S.padron[a.numero],[cl]=est(a);return{numero:a.numero,nombre:p?p.nombre:'',puesto:p?p.puesto:'',departamento:p?p.depto:'',escrito:a.escrito||'',firmo:!!a.firmo,ok:!!a.ok,estado:cl}}),
    estado:w?'Por validar':'Validada',actualizado:new Date().toISOString()};
  btn.disabled=true;btn.textContent='Guardando…';
  try{if(e.id)doc.id=e.id;const l=await api('listados_guardar',doc);S.sesiones=l.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));toast(w?'Listado guardado como “Por validar”.':'Listado guardado.');S.ed=null;S.view='sesiones';render()}
  catch(err){btn.disabled=false;btn.textContent='Guardar listado';toast('No se pudo guardar: '+errTxt(err))}}

/* ---------- PDF con tus formatos ---------- */
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function entregar(bytes,nombre){const file=nombre.replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim()+'.pdf',blob=new Blob([bytes],{type:'application/pdf'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('PDF listo.')}
const pdfOk=()=>{if(!window.PDFLib){toast('No se cargó el generador de PDF. Recarga la página.');return false}return true};
const ses=id=>S.sesiones.find(x=>x.id===id);
async function imprimirLista(id){if(!pdfOk())return;const s=ses(id);if(!s)return;const h=s.encabezado||{};
  const as=(s.asistentes||[]).slice().sort((a,b)=>(a.nombre||a.escrito||'').localeCompare(b.nombre||b.escrito||'','es')).map(a=>({numero:a.numero,nombre:a.nombre||a.escrito,puesto:a.puesto}));
  try{const bytes=await pdfFT(b64(TPL_FT),{curso:s.cursoNombre,duracion:h.duracion,fecha:s.fecha,clasificacion:h.clasificacion,registro:h.registro,instructor:h.instructor,rfc:h.rfc,area:h.area,lugar:h.lugar,objetivo:h.objetivo,modalidad:h.modalidad,asistentes:as});
    entregar(bytes,`FT-RH-010 ${s.cursoCodigo||''} ${s.fecha||''}`)}catch(e){toast('No se pudo generar la lista.')}}
function nombreDC3(a){const b=S.bd[a.numero];if(b&&b.paterno)return `${[b.paterno,b.materno].filter(Boolean).join(' ')}, ${b.nombres}`.toUpperCase();return (a.nombre||'').toUpperCase()}
const areaDC3=a=>{const m=String(a||'').trim().match(/^(\d+)\s*-?\s*(.*)$/);return m?`${m[1]} - ${m[2]}`.toUpperCase():String(a||'').toUpperCase()};
async function imprimirDC3(id){if(!pdfOk())return;const s=ses(id);if(!s)return;const h=s.encabezado||{};
  const as=(s.asistentes||[]).filter(a=>a.estado==='ok'&&a.firmo).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  if(!as.length){toast('Este listado no tiene asistentes validados que hayan firmado.');return}
  const ins=String(h.instructor||'').toUpperCase(),reg=h.registro&&!/^n\/?a$/i.test(h.registro)?' / '+h.registro:'';
  let firmas;try{firmas=await api('api_cmcapFirmantes',s.fecha)}catch(error){toast('No se pueden emitir las DC-3: '+errTxt(error));return}
  const lista=as.map(a=>{const alta=S.altas.find(x=>x.numero===a.numero);return{legal:firmas.legal,trab:firmas.trab,nombre:nombreDC3(a),curp:(S.bd[a.numero]&&S.bd[a.numero].curp)||(alta&&alta.curp)||'',ocupacion:OCUPACION_DEF,puesto:a.puesto,curso:String(s.cursoNombre||'').toUpperCase(),horas:(parseFloat(h.duracion)||0).toFixed(2)+' HORAS',fecha:s.fecha,area:areaDC3(h.area),agente:ins+reg,instructor:ins}});
  try{const bytes=await pdfDC3(b64(TPL_DC3),lista);entregar(bytes,`DC-3 ${s.cursoCodigo||''} ${s.fecha||''}`);const f=lista.filter(x=>!x.curp).length;if(f)setTimeout(()=>toast(`${f} constancia${f>1?'s':''} sin CURP: revisa la pestaña BD de tu hoja.`),3800)}catch(e){toast('No se pudieron generar las DC-3.')}}

/* ---------- acciones ---------- */
const A={
  tab:d=>{S.view=d.v;S.ed=null;render();window.scrollTo(0,0)},
  recargar:async()=>{$('#main').innerHTML='<div class="card"><div class="spin"></div></div>';await cargarHoja();if(S.ed&&!INS(S.ed.enc.instructorId)){const i=buscarIns(S.ed.enc.instructor);if(i){S.ed.enc.instructorId=i.id;S.ed.enc.instructor=i.nombre;if(i.rfc)S.ed.enc.rfc=i.rfc;if(i.registro)S.ed.enc.registro=i.registro;if(i.tipo)S.ed.enc.clasificacion=i.tipo}}render()},
  filtro:d=>{S.filtro=d.v;render()},
  manual:()=>abrirEditor({leida:false,cursoCodigo:'',fecha:hoy()}),
  abrir:d=>{const s=ses(d.id);if(!s)return;abrirEditor({id:s.id,leida:s.leidaDeFoto,lista:{curso:s.listaCurso||''},cursoCodigo:s.cursoCodigo,fecha:s.fecha,enc:{...(s.encabezado||{})},encOk:{...(s.encabezadoAceptado||{})},asistentes:(s.asistentes||[]).map(a=>({numero:a.numero,escrito:a.escrito,firmo:a.firmo,ok:a.ok}))})},
  usarcat:d=>{S.ed.enc[d.k]=catVal(d.k,C(S.ed.cursoCodigo))||'';pintarEditor()},
  dejar:d=>{S.ed.encOk[d.k]=true;pintarEditor()},
  quitar:d=>{S.ed.asistentes.splice(+d.i,1);pintarEditor()},
  confirmar:d=>{S.ed.asistentes[+d.i].ok=true;pintarEditor()},
  sugerencia:d=>{if(S.ed.asistentes.some(a=>a.numero===d.n)){toast('Ese colaborador ya está en la lista.');return}const a=S.ed.asistentes[+d.i];a.numero=d.n;a.ok=true;pintarEditor()},
  guardar:(d,el)=>guardar(el),
  borrarlista:async(d,el)=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Toca otra vez';return}try{S.sesiones=await api('listados_eliminar',S.ed.id);toast('Listado eliminado.');S.ed=null;S.view='sesiones';render()}catch(err){toast('No se pudo eliminar: '+errTxt(err))}},
  borrarfila:async(d,el)=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='¿Eliminar?';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='🗑'}},3000);return}try{S.sesiones=await api('listados_eliminar',d.id);toast('Listado eliminado.');render()}catch(err){toast('No se pudo eliminar: '+errTxt(err))}},
  pdflista:d=>imprimirLista(d.id),pdfdc3:d=>imprimirDC3(d.id),
  cerrar:()=>cerrar(),
  altaemp:d=>altaForm(d.i),
  guardaralta:async(d,el)=>{const f=$('#altaf'),num=f.numero.value.trim(),nom=f.nombre.value.trim().toUpperCase();
    if(!/^\d{3,}$/.test(num)){toast('Escribe un número de empleado válido.');return}if(S.padron[num]){toast('Ese número ya existe en el padrón: '+S.padron[num].nombre);return}if(!nom){toast('Escribe el nombre.');return}
    const o={numero:num,nombre:nom,puesto:f.puesto.value.trim().toUpperCase(),depto:f.depto.value.trim().toUpperCase(),planta:f.planta.value,curp:f.curp.value.trim().toUpperCase()};
    el.disabled=true;try{S.altas=await api('listados_alta',o);armarPadron();if(d.i!==''&&S.ed&&S.ed.asistentes[+d.i]){const a=S.ed.asistentes[+d.i];a.numero=num;a.ok=true}toast('Colaborador dado de alta.');cerrar()}catch(err){el.disabled=false;toast('No se pudo guardar: '+errTxt(err))}},
};
document.addEventListener('click',ev=>{
  const o=ev.target.closest('.cbo');if(o){ev.preventDefault();const inp=o.parentElement.previousElementSibling;if(o.dataset.alta==='ins'){cbCerrar();window.open(APP_URL,'_blank');return}if(o.dataset.alta==='emp'){cbCerrar();const i=inp.dataset.i;if(i==='new'){S.ed.asistentes.push({numero:'',escrito:inp.value.trim(),firmo:true,ok:false});altaForm(S.ed.asistentes.length-1)}else{S.ed.asistentes[+i].escrito=inp.value.trim()||S.ed.asistentes[+i].escrito;altaForm(i)}return}cbElegir(inp,o.dataset.v);return}
  if(!ev.target.closest('.cb'))cbCerrar();
  const el=ev.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){ev.preventDefault();f(el.dataset,el)}});
document.addEventListener('focusin',ev=>{if(ev.target.classList&&ev.target.classList.contains('cbi')){cbCerrar();cbAbrir(ev.target)}});
document.addEventListener('input',ev=>{if(ev.target.classList&&ev.target.classList.contains('cbi'))cbAbrir(ev.target)});
document.addEventListener('keydown',ev=>{const t=ev.target;if(!(t.classList&&t.classList.contains('cbi')))return;const box=t.nextElementSibling,ops=[...box.querySelectorAll('.cbo')];if(ev.key==='Escape'){cbCerrar();return}if(ev.key==='ArrowDown'&&ops.length){ev.preventDefault();ops[0].focus()}if(ev.key==='Enter'){ev.preventDefault();const first=box.querySelector('.cbo[data-v]');if(first&&!box.hidden)cbElegir(t,first.dataset.v)}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.closest&&t.closest('#dlg'))return;
  else if(t.id==='curso'){S.ed.cursoCodigo=t.value;S.ed.encOk={};pintarEditor()}
  else if(t.id==='fecha')S.ed.fecha=t.value;
  else if(t.dataset.h){S.ed.enc[t.dataset.h]=t.value;delete S.ed.encOk[t.dataset.h];pintarEditor()}
  else if(t.dataset.firma){S.ed.asistentes[+t.dataset.firma].firmo=t.checked;pintarEditor()}});
$('#dlg').addEventListener('close',()=>{if(S.view==='editar')pintarEditor()});

(async()=>{await cargarHoja();render()})();

</script>
