<script>
window.SamaraDashboard=(()=>{
 'use strict';
 const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
 const n=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const personKey=e=>String(e.no||e.curp||e.id||'');
 const isSamara=e=>n(e.company||e.empresa||e.entity||'SAMARA')==='samara';
 const active=e=>!['inactivo','inactiva','baja','bajas','i','no','0','false'].includes(n(e.activeStatus||e.status||e._legacy?.estado||'Activo'));
 const validDate=value=>/^\d{4}-\d{2}-\d{2}$/.test(String(value||''))&&!isNaN(Date.parse(value+'T12:00:00Z'))&&new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value;
 const lastDay=(year,month)=>new Date(Date.UTC(year,month,0)).toISOString().slice(0,10);
 const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Tijuana',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const ICONS={dashboard:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',courses:'<path d="M12 5c-3-2-6-2-9-1v16c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1zm0 0v16"/>',matrix:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18M15 3v18"/>',people:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5v3"/>',instructors:'<circle cx="12" cy="9" r="6"/><path d="m8 14-2 8 6-3 6 3-2-8m-7-5 2 2 4-4"/>',attendance:'<rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="2" width="6" height="5" rx="1"/><path d="M9 11h6m-6 4h6m-6 3h4"/>',users:'<circle cx="12" cy="7" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2z"/>',cmcap:'<path d="M6 2h9l4 4v16H6zm9 0v5h4M9 12h7m-7 4h7"/>',program:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18m-14 4h3m4 0h3m-10 3h3"/>',reports:'<path d="M3 3v18h19M7 17V9m5 8V5m5 12v-6"/>',progress:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 6-7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>'};
 const icon=key=>'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+(ICONS[key]||ICONS.attendance)+'</svg>';
 function belongsToSamara(list,people){const byNo=new Map(people.map(e=>[String(e.no),e]));return !(list.asistentes||[]).length||(list.asistentes||[]).some(a=>!byNo.has(String(a.numero))||isSamara(byNo.get(String(a.numero))));}
 function compute(context,selection,coverage,validateList){
  const year=Number(selection.year),month=Number(selection.month)||0,now=selection.today||today(),end=lastDay(year,month||12),cutoff=now<end?now:end,start=String(year)+'-'+String(month||1).padStart(2,'0')+'-01';
  const workforce=context.employees.filter(e=>isSamara(e)&&active(e)),allPeople=new Map(context.employees.map(e=>[String(e.no),e]));
  const catalog=context.courses.filter(active),byCourse=new Map(catalog.map(c=>[n(c.code),c])),planMap=new Map();let duplicates=0,missingCourses=0;
  for(const raw of context.plans||[]){if(Number(raw.year)!==year)continue;const months=[...new Set((raw.months||[]).map(Number).filter(m=>Number.isInteger(m)&&m>=1&&m<=12))].sort((a,b)=>a-b);if(!months.length)continue;const course=byCourse.get(n(raw.courseCode));if(!course){missingCourses++;continue;}const key=n(course.code);if(planMap.has(key)){duplicates++;const prev=planMap.get(key);prev.months=[...new Set([...prev.months,...months])].sort((a,b)=>a-b);if(Array.isArray(raw.memberKeys))prev.memberKeys=[...new Set([...(prev.memberKeys||[]),...raw.memberKeys])];}else planMap.set(key,{...raw,courseCode:course.code,year,months});}
  const dated=context.attendance.filter(l=>validDate(l.fecha)&&l.fecha<=cutoff),coverageContext={...context,attendance:dated};
  const plans=[...planMap.values()].map(plan=>{const result=coverage(coverageContext,plan),due=lastDay(year,Math.max(...plan.months));return {plan,...result,due,inPeriod:month?plan.months.includes(month):true,overdue:due<cutoff&&result.pending.length>0,complete:result.target.length>0&&result.pending.length===0};});
  const required=plans.reduce((sum,p)=>sum+p.target.length,0),trained=plans.reduce((sum,p)=>sum+p.trained.length,0),overdue=plans.filter(p=>p.overdue),inPeriod=plans.filter(p=>p.inPeriod&&!p.overdue&&p.pending.length>0),unconfigured=plans.filter(p=>p.unconfigured||!p.target.length);
  const lists=dated.filter(l=>l.fecha>=start&&Number(l.fecha.slice(0,4))===year&&(!month||Number(l.fecha.slice(5,7))===month)).filter(l=>belongsToSamara(l,context.employees));
  const results=lists.map(list=>({list,result:validateList?validateList(list):{issues:[],personIssues:[]}})),review=lists.filter(l=>n(l.estado)!=='validada'),validated=lists.filter(l=>n(l.estado)==='validada'),missingKeys=lists.filter(l=>!String(l.sirceDatos?.claveCurso||'').trim());
  const incomplete=results.filter(r=>r.result.issues.some(issue=>!issue.includes('CLAVE CURSO'))),personIssues=new Map();
  results.forEach(({list,result})=>{for(const issue of result.personIssues||[]){const e=allPeople.get(String(issue.no));if(e&&isSamara(e))personIssues.set(String(issue.no),{...issue,listId:list.id});}});
  const authorized=new Set((context.authorizedCourseCodes||[]).map(n)),unassigned=catalog.filter(c=>!authorized.has(n(c.code)));
  const committee={current:0,expiring:0,expired:0,future:0,review:0};for(const member of context.cmcap||[]){if(!validDate(member.startDate)||!validDate(member.endDate)||member.endDate<member.startDate){committee.review++;continue;}if(member.endDate<cutoff)committee.expired++;else if(member.startDate>cutoff)committee.future++;else{committee.current++;const days=(Date.parse(member.endDate+'T12:00:00Z')-Date.parse(cutoff+'T12:00:00Z'))/86400000;if(days<=30)committee.expiring++;}}
  return {year,month,cutoff,start,end:cutoff,workforce,plans,required,trained,percent:required?Math.round(trained/required*100):null,overdue,inPeriod,pending:overdue.length+inPeriod.length,unconfigured,duplicates,missingCourses,lists,review,validated,missingKeys,incomplete,personIssues:[...personIssues.values()],catalog,unassigned,certified:new Set(context.certifiedInstructorIds||[]).size,committee,legalRegistered:(context.legal||[]).some(p=>String(p.name||'').trim())};
 }
 let api,actions=[];
 const $=id=>document.getElementById(id);
 function action(module,options={}){const id=actions.push({module,options})-1;return ' data-dash-action="'+id+'" '+(!api.can(module)?'disabled title="Tu perfil no permite abrir este módulo"':'');}
 function link(label,module,options={}){return '<button type="button" class="dash-link"'+action(module,options)+'>'+esc(label)+' →</button>';}
 function task(title,description,module,key,options={},urgent=false){return '<button type="button" class="dash-task '+(urgent?'urgent':'')+'"'+action(module,options)+'><span class="dash-mini-icon">'+icon(key)+'</span><span><b>'+esc(title)+'</b><small>'+esc(description)+'</small></span><span aria-hidden="true">›</span></button>';}
 const plural=(count,singular,more)=>count+' '+(count===1?singular:more);
 const period=plan=>plan.months.map(m=>MONTHS[m-1].slice(0,3)).join(', ');
 function render(){
  if(!api||!api.can('dashboard')||!$('view-dashboard').classList.contains('active'))return;actions=[];
  const ctx=api.context(),d=compute(ctx,{year:$('dashboard-year').value,month:$('dashboard-month').value},window.SamaraProgram.coverage,api.validateList),pOptions={year:d.year,month:d.month||''},aOptions={start:d.start,end:d.end};
  const stat=(key,value,label,helper,module,options={})=>'<article class="dash-stat"><div class="dash-stat-top"><span class="dash-icon">'+icon(key)+'</span><div><b>'+value+'</b><span class="dash-stat-label">'+label+'</span></div></div>'+ (key==='progress'&&d.percent!=null?'<div class="dash-progress"><i style="width:'+d.percent+'%"></i></div>':'')+'<small>'+helper+'</small>'+link('Consultar',module,options)+'</article>';
  let html='<div class="dash-stats">'+stat('people',d.workforce.length,'Personal activo','Base actual de SAMARA','people')+stat('progress',d.percent==null?'—':d.percent+'%','Avance total de capacitación','Validadas / requeridas del programa anual','program',{year:d.year})+stat('program',d.plans.length,'Cursos programados','Programación del año seleccionado','program',{year:d.year})+stat('clock',d.pending,'Cursos pendientes',d.inPeriod.length+(d.month?' en periodo · ':' por concluir · ')+d.overdue.length+' vencidos','program',pOptions)+stat('attendance',d.review.length,'Listados por revisar','Borradores y pendientes de validación','attendance',{...aOptions,review:true})+'</div>';
  html+='<p class="dash-explanation">Avance anual del programa: '+d.trained.toLocaleString('es-MX')+' de '+d.required.toLocaleString('es-MX')+' capacitaciones persona–curso validadas. Cada persona cuenta una vez por curso y periodo. Corte: '+d.cutoff.split('-').reverse().join('/')+'. '+(d.unconfigured.length?plural(d.unconfigured.length,'curso sin población confirmada.','cursos sin población confirmada.'):'')+(d.missingCourses? ' '+plural(d.missingCourses,'programación requiere revisar su curso.','programaciones requieren revisar su curso.'):'')+'</p>';
  const rows=d.plans.filter(p=>p.inPeriod).sort((a,b)=>a.due.localeCompare(b.due)||a.plan.courseCode.localeCompare(b.plan.courseCode,'es',{numeric:true}));
  html+='<div class="dash-main"><article class="dash-panel"><div class="dash-panel-heading"><h2>Avance del programa</h2>'+link('Ver programa','program',pOptions)+'</div><p>Acumulado de los meses seleccionados para cada curso. '+(d.month?'Vista del mes elegido.':'Vista anual.')+'</p><table class="dash-table"><thead><tr><th>CURSO</th><th>PERIODO</th><th>CAPACITADOS</th><th>AVANCE</th></tr></thead><tbody>'+rows.slice(0,5).map(p=>'<tr><td>'+link(p.course.name,'program',{year:d.year,courseCode:p.plan.courseCode})+'</td><td>'+esc(period(p.plan))+'</td><td>'+p.trained.length+' de '+p.target.length+'</td><td>'+(p.target.length?'<div class="dash-progress"><i style="width:'+(100*p.trained.length/p.target.length)+'%"></i></div><small>'+Math.round(100*p.trained.length/p.target.length)+'%</small>':'<small>Revisar población</small>')+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="dash-empty">No hay cursos programados para este periodo.</div>')+(rows.length>5?'<p class="dash-summary-note">Mostrando 5 de '+rows.length+' cursos del periodo.</p>':'');
  if(d.overdue.length)html+='<div class="dash-warning"><div><b>'+plural(d.overdue.length,'curso programado vencido','cursos programados vencidos')+'</b><small>El periodo terminó y aún tiene personal pendiente.</small></div>'+link('Revisar','program',{year:d.year,courseCode:d.overdue[0].plan.courseCode})+'</div>';
  html+='</article><article class="dash-panel"><h2>Pendientes por atender</h2><div class="dash-tasks">';let tasks=0;
  for(const p of d.overdue.slice(0,2)){html+=task('Curso programado vencido',p.course.name+' · '+plural(p.pending.length,'persona pendiente','personas pendientes'),'program','clock',{year:d.year,courseCode:p.plan.courseCode},true);tasks++;}
  if(d.inPeriod.length){html+=task(plural(d.inPeriod.length,d.month?'curso pendiente en periodo':'curso por concluir',d.month?'cursos pendientes en periodo':'cursos por concluir'),'Con personal aún por capacitar','program','courses',pOptions,true);tasks++;}
  if(d.review.length){html+=task(plural(d.review.length,'listado por revisar','listados por revisar'),'Revisar borradores y asistentes pendientes','attendance','attendance',{...aOptions,review:true});tasks++;}
  if(d.personIssues.length){html+=task(plural(d.personIssues.length,'empleado con datos incompletos','empleados con datos incompletos'),'Documento probatorio o institución para SIRCE','attendance','people',{...aOptions,listId:d.personIssues[0].listId,fixPeople:true});tasks++;}
  if(d.unassigned.length){html+=task(plural(d.unassigned.length,'curso sin instructor autorizado','cursos sin instructor autorizado'),'Revisar asignación en el glosario','courses','instructors',{courseCode:d.unassigned[0].code});tasks++;}
  if(d.unconfigured.length){html+=task(plural(d.unconfigured.length,'programación por revisar','programaciones por revisar'),'Verifica puestos, clasificación e integrantes','program','matrix',{year:d.year,courseCode:d.unconfigured[0].plan.courseCode});tasks++;}
  html+=(tasks?'':'<div class="dash-empty">Sin pendientes detectados con estos filtros.</div>')+'</div><p class="dash-summary-note">Cada aviso abre el módulo correspondiente, según los permisos de tu perfil.</p></article></div>';
  const summaryRow=(label,value,warn=false)=>'<div class="dash-summary-row"><span>'+label+'</span><b class="'+(warn?'warn':'')+'">'+value+'</b></div>';
  html+='<div class="dash-bottom"><article class="dash-panel"><div class="dash-panel-heading"><span class="dash-mini-icon">'+icon('attendance')+'</span><h2>Listados y SIRCE</h2></div>'+summaryRow('Listas validadas',d.validated.length)+summaryRow('Sin clave SIRCE',d.missingKeys.length,true)+summaryRow('Con datos por completar',d.incomplete.length,true)+link('Ver listados','attendance',aOptions)+'<p class="dash-summary-note">Sin clave y con datos incompletos pueden coincidir. Listas del año y mes elegidos.</p></article><article class="dash-panel"><div class="dash-panel-heading"><span class="dash-mini-icon">'+icon('people')+'</span><h2>Instructores y cursos</h2></div>'+summaryRow('Cursos activos',d.catalog.length)+summaryRow('Instructores certificados',d.certified)+summaryRow('Cursos sin instructor autorizado',d.unassigned.length,true)+link('Ver instructores','instructors')+'</article><article class="dash-panel"><div class="dash-panel-heading"><span class="dash-mini-icon">'+icon('cmcap')+'</span><h2>CMCAP</h2></div>'+summaryRow('Nombramientos vigentes',d.committee.current)+summaryRow('Por vencer en 30 días',d.committee.expiring,true)+summaryRow('Vencidos',d.committee.expired,true)+'<p class="dash-summary-note">Representante legal: <b>'+(d.legalRegistered?'registrado':'por registrar')+'</b>'+(d.committee.review?'<br>'+plural(d.committee.review,'nombramiento por revisar','nombramientos por revisar'):'')+'</p>'+link('Ver CMCAP','cmcap')+'</article></div><p class="dash-footer">El avance requiere asistencia validada y firma. Los cursos vencidos tienen periodo terminado y capacitación pendiente. La población proviene del personal activo actual y su puesto, departamento y clasificación en la matriz.</p>';
  $('dashboard-content').innerHTML=html;
 }
 function init(options){
  api=options;const date=today(),ctx=api.context(),year=Number(date.slice(0,4)),years=[...new Set([year,...(ctx.plans||[]).map(p=>Number(p.year)),...ctx.attendance.map(l=>Number(String(l.fecha).slice(0,4)))] )].filter(y=>Number.isInteger(y)&&y>=2000&&y<=2100).sort((a,b)=>b-a);
  $('dashboard-year').innerHTML=years.map(y=>'<option value="'+y+'">'+y+'</option>').join('');$('dashboard-year').value=year;$('dashboard-month').insertAdjacentHTML('beforeend',MONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join(''));$('dashboard-month').value=Number(date.slice(5,7));
  ['dashboard-year','dashboard-month'].forEach(id=>$(id).addEventListener('change',render));
  $('dashboard-content').addEventListener('click',event=>{const b=event.target.closest('[data-dash-action]');if(!b||b.disabled)return;const entry=actions[Number(b.dataset.dashAction)];if(entry&&api.can(entry.module))api.navigate(entry.module,entry.options);});
  document.querySelectorAll('.nav-item[data-view]').forEach(button=>{const span=button.querySelector('.nav-icon');if(span)span.innerHTML=icon(button.dataset.view);});
 }
 return {init,render,compute,icon,today,belongsToSamara,context:()=>api.context(),navigate:(module,options)=>api.navigate(module,options)};
})();
